        tenant: { type: string }
        reason: { type: string, minLength: 10, maxLength: 500 }
        ticket: { type: string }
        durationMinutes: { type: integer, minimum: 15, maximum: 480, default: 60 }
        scope: { type: string, enum: [READ_ONLY], default: READ_ONLY }
    SupportAccess:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant: { type: string, description: Present in control-plane responses }
        engineer: { type: string }
        reason: { type: string }
        ticket: { type: string }
        scope: { type: string }
        durationMinutes: { type: integer }
        requestedAt: { type: string, format: date-time }
        status: { type: string, enum: [REQUESTED, APPROVED, REJECTED, REVOKED, EXPIRED, LAPSED, UNKNOWN] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokeReason: { type: [string, 'null'] }
    UsageDay:
      type: object
      properties:
        tenant: { type: string }
        day: { type: string, format: date }
        activeLoans: { type: [integer, 'null'] }
        activeCustomers: { type: [integer, 'null'] }
        staffUsers: { type: [integer, 'null'] }
        apiCalls: { type: integer }
        documentBytes: { type: [integer, 'null'] }
        databaseBytes: { type: [integer, 'null'] }
        storageBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
    UsageMonth:
      type: object
      properties:
        tenant: { type: string }
        legalName: { type: string }
        edition: { type: string }
        month: { type: string }
        daysMeasured: { type: integer }
        peakActiveLoans: { type: [integer, 'null'] }
        closingActiveLoans: { type: [integer, 'null'] }
        peakActiveCustomers: { type: [integer, 'null'] }
        closingActiveCustomers: { type: [integer, 'null'] }
        peakStaffUsers: { type: [integer, 'null'] }
        apiCalls: { type: integer }
        peakStorageBytes: { type: [integer, 'null'] }
        closingStorageBytes: { type: [integer, 'null'] }
    DepositRuleSet:
      type: object
      properties:
        kind: { type: [string, 'null'], enum: [BANK, NBFC_DEPOSIT, null], description: 'null: this institution takes no deposits here' }
        entityType: { type: [string, 'null'] }
        depositTaking: { type: [boolean, 'null'] }
        depositRegistrationRef: { type: [string, 'null'] }
        asOf: { type: [string, 'null'], format: date, description: The business date }
        reason: { type: [string, 'null'], description: 'Why there is no rule set, when kind is null' }
        unverified: { type: integer, description: Rules whose source text was not read; to be confirmed before go-live }
        rules:
          type: array
          items:
            type: object
            properties:
              code: { type: string, examples: ['td.max-rate-percent'] }
              value: { type: string, description: 'A number; 1 and 0 for yes and no' }
              effectiveFrom: { type: string, format: date }
              source: { type: string }
              verified: { type: boolean }
              note: { type: [string, 'null'] }
    DepositProblems:
      type: object
      properties:
        problems: { type: array, items: { type: string } }
    DepositInterestBand:
      type: object
      required: [fromBalance, ratePercent]
      properties:
        fromBalance: { type: [number, string], description: 'The band runs from this balance to the next band; the first starts at 0' }
        ratePercent: { type: [number, string] }
    DepositRate:
      type: object
      required: [fromAmount, ratePercent]
      description: >-
        One cell of the rate card: the full annual rate for deposits from this amount and from this tenure, up to the next
        step. Never a base rate plus a slab rate.
      properties:
        fromAmount: { type: [number, string] }
        fromMonths: { type: integer, minimum: 0 }
        fromDays: { type: integer, minimum: 0 }
        ratePercent: { type: [number, string] }
    DepositAddOn:
      type: object
      required: [code, percent]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,29}$', description: 'SENIOR_CITIZEN is given only to an individual of the rule set''s senior-citizen age' }
        percent: { type: [number, string], description: 'Points added to the card rate (negative to take off)' }
    DepositProductInput:
      type: object
      required: [code, name, productType]
      description: Settings of the other family must be left out.
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,12}$' }
        name: { type: string, maxLength: 200 }
        productType: { type: string, enum: [SAVINGS, CURRENT, FD_CUMULATIVE, FD_PAYOUT, RD], description: 'RD - a recurring deposit (P4-5): the amount is the monthly instalment' }
        effectiveFrom: { type: [string, 'null'], format: date, description: Defaults to the business date }
        dayCount: { type: [string, 'null'], enum: [ACTUAL_365, ACTUAL_360, ACTUAL_ACTUAL, null], description: Default ACTUAL_365 }
        rounding: { type: [string, 'null'], enum: [PAISE_HALF_UP, PAISE_HALF_EVEN, RUPEE_HALF_UP, RUPEE_DOWN, RUPEE_UP, null], description: Default PAISE_HALF_UP }
        tdsApplicable: { type: [boolean, 'null'], description: 'Default: true for a term deposit product; for savings, what the rule set says (no). false: no tax is deducted and no preview shows any' }
        minBalance: { type: [number, string, 'null'], description: Savings and current. Default 0 }
        interestBands: { type: [array, 'null'], maxItems: 20, items: { $ref: '#/components/schemas/DepositInterestBand' }, description: Savings (required) and current; none for an account that bears no interest }
        bandMode: { type: [string, 'null'], enum: [WHOLE_BALANCE, INCREMENTAL, null], description: 'Whether the whole balance earns the rate of its band or each part its own. Default WHOLE_BALANCE' }
        interestPostingMonths: { type: [integer, 'null'], enum: [1, 3, 6, 12, null], description: 'Months between two interest credits. Default 3 (quarterly)' }
        chequeFacility: { type: [boolean, 'null'] }
        minAmount: { type: [number, string, 'null'], description: Term deposits. Smallest deposit accepted }
        maxAmount: { type: [number, string, 'null'], description: Largest deposit accepted; none for no limit }
        minTenureMonths: { type: [integer, 'null'], minimum: 0 }
        minTenureDays: { type: [integer, 'null'], minimum: 0 }
        maxTenureMonths: { type: [integer, 'null'], minimum: 0 }
        maxTenureDays: { type: [integer, 'null'], minimum: 0 }
        interestPeriodMonths: { type: [integer, 'null'], enum: [0, 1, 3, 6, 12, null], description: 'Months between two interest credits; 0 (payout products) for interest once, at maturity' }
        rateCard: { type: [array, 'null'], maxItems: 400, items: { $ref: '#/components/schemas/DepositRate' } }
        addOns: { type: [array, 'null'], maxItems: 10, items: { $ref: '#/components/schemas/DepositAddOn' } }
        prematureAllowed: { type: [boolean, 'null'], description: Default true }
        prematurePenaltyPercent: { type: [number, string, 'null'], description: 'Points taken off the rate for the period run. Left out where the rule set fixes the rate (deposit-taking NBFC)' }
        prematureMinDays: { type: [integer, 'null'], minimum: 0, description: 'No interest when the deposit ran for fewer days. Left out where the rule set fixes it' }
        autoRenewalAllowed: { type: [boolean, 'null'], description: Default false }
        glLiability: { type: [string, 'null'], description: 'Default 2401 savings, 2402 current, 2403 term deposits, 2405 recurring deposits' }
        glInterestExpense: { type: [string, 'null'], description: 'Default 5108 savings, 5107 term deposits' }
        charges: { oneOf: [ { $ref: '#/components/schemas/DepositChargesInput' }, { type: 'null' } ], description: 'Savings and current: the schedule of charges (P4-4); none for no charges' }
        rdLateChargePer100:
          type: [number, string, 'null']
          description: >-
            RD only, and required for it (P4-5): rupees charged for every Rs 100 of an instalment paid late, for each month or part
            of a month of delay (0 to 100, two decimals; 0 for no charge). A recurring deposit runs for whole months, is paid out at
            maturity and is never renewed.
    DepositChargesInput:
      type: object
      description: A savings or current product's schedule of charges. Amounts before GST.
      properties:
        gstRatePercent: { type: [number, string, 'null'], description: Default 18 }
        minBalancePercent: { type: [number, string, 'null'], description: 'Percentage of the month''s shortfall charged; with minBalanceMax, or neither for no charge' }
        minBalanceMax: { type: [number, string, 'null'], description: The most charged for one month }
        closureAmount: { type: [number, string, 'null'], description: 'Charged on closing the account; none for no charge' }
        closureFreeWithinDays: { type: [integer, 'null'], minimum: 0, description: 'No closure charge within this many days of opening (14 by convention)' }
        closureWithinDays: { type: [integer, 'null'], minimum: 0, description: 'No closure charge after this many days; none for no limit' }
        service:
          type: [array, 'null']
          maxItems: 30
          items:
            type: object
            required: [code, name, amount]
            properties:
              code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,29}$' }
              name: { type: string, maxLength: 100 }
              amount: { type: [number, string] }
    DepositProduct:
      type: object
      description: Amounts and rates are decimal strings. Settings of the other family are null.
      properties:
        code: { type: string }
        name: { type: string }
        family: { type: string, enum: [CASA, TERM_DEPOSIT] }
        productType: { type: string, enum: [SAVINGS, CURRENT, FD_CUMULATIVE, FD_PAYOUT, RD], description: 'RD - a recurring deposit (P4-5): the amount is the monthly instalment' }
        status: { type: string, enum: [ACTIVE, WITHDRAWN] }
        version: { type: [integer, 'null'] }
        effectiveFrom: { type: string, format: date }
        dayCount: { type: [string, 'null'] }
        rounding: { type: string }
        tdsApplicable: { type: boolean }
        minBalance: { type: [string, 'null'] }
        interestBands:
          type: [array, 'null']
          items:
            type: object
            properties:
              fromBalance: { type: string }
              ratePercent: { type: string }
        bandMode: { type: [string, 'null'] }
        interestPostingMonths: { type: [integer, 'null'] }
        chequeFacility: { type: [boolean, 'null'] }
        minAmount: { type: [string, 'null'] }
        maxAmount: { type: [string, 'null'] }
        minTenureMonths: { type: [integer, 'null'] }
        minTenureDays: { type: [integer, 'null'] }
        maxTenureMonths: { type: [integer, 'null'] }
        maxTenureDays: { type: [integer, 'null'] }
        interestPeriodMonths: { type: [integer, 'null'] }
        rateCard:
          type: [array, 'null']
          description: Ordered by amount step, then tenure step
          items:
            type: object
            properties:
              fromAmount: { type: string }
              fromMonths: { type: integer }
              fromDays: { type: integer }
              ratePercent: { type: string }
        addOns:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DepositAddOnGiven' }
        prematureAllowed: { type: [boolean, 'null'] }
        prematurePenaltyPercent: { type: [string, 'null'] }
        prematureMinDays: { type: [integer, 'null'] }
        autoRenewalAllowed: { type: [boolean, 'null'] }
        glLiability: { type: string }
        glInterestExpense: { type: [string, 'null'] }
        rdLateChargePer100: { type: [string, 'null'], description: 'RD only: the late charge per Rs 100 a month (P4-5)' }
        charges:
          type: [object, 'null']
          description: The schedule of charges (savings and current); amounts are decimal strings
          properties:
            gstRatePercent: { type: string }
            minBalancePercent: { type: [string, 'null'] }
            minBalanceMax: { type: [string, 'null'] }
            closureAmount: { type: [string, 'null'] }
            closureFreeWithinDays: { type: [integer, 'null'] }
            closureWithinDays: { type: [integer, 'null'] }
            service:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  amount: { type: string }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
    DepositAddOnGiven:
      type: object
      properties:
        code: { type: string }
        percent: { type: string }
    DepositProductVersion:
      type: object
      properties:
        version: { type: integer }
        changedBy: { type: string }
        changedAt: { type: string }
        approvalId: { type: [string, 'null'] }
        name: { type: string }
        status: { type: string }
    DepositProductWithdrawal:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    DepositNomineeInput:
      type: object
      required: [name, relationship]
      properties:
        name: { type: string, maxLength: 200 }
        relationship: { type: string, enum: [SPOUSE, CHILD, PARENT, SIBLING, GRANDCHILD, OTHER_RELATIVE, OTHER] }
        sharePercent: { type: [number, string, 'null'], description: 'SIMULTANEOUS: the shares total 100. SUCCESSIVE: none, the order named decides' }
        minor: { type: boolean, default: false }
        guardianName: { type: [string, 'null'], maxLength: 200, description: 'Who receives on a minor nominee''s behalf; required for a minor, not given otherwise' }
    CasaAccountInput:
      type: object
      required: [productCode, customerId, branchCode]
      properties:
        productCode: { type: string }
        customerId: { type: string, format: uuid, description: The sole or first-named holder }
        jointHolders: { type: array, maxItems: 3, items: { type: string, format: uuid }, description: 'The other holders, in the order named' }
        branchCode: { type: string }
        operatingMode: { type: [string, 'null'], enum: [SINGLE, EITHER_OR_SURVIVOR, FORMER_OR_SURVIVOR, ANYONE_OR_SURVIVOR, JOINTLY, null], description: 'Default SINGLE for one holder; required for a joint account' }
        nominationMode: { type: [string, 'null'], enum: [NONE, SIMULTANEOUS, SUCCESSIVE, null], description: 'Default NONE when no nominee is named; required otherwise' }
        nominees: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/DepositNomineeInput' } }
    TermDepositInput:
      type: object
      required: [productCode, amount]
      description: For a preview only productCode, amount and the tenure are required.
      properties:
        productCode: { type: string }
        customerId: { type: [string, 'null'], format: uuid, description: The sole or first-named depositor. Required to book }
        jointHolders: { type: [array, 'null'], maxItems: 3, items: { type: string, format: uuid } }
        branchCode: { type: [string, 'null'], description: Required to book }
        operatingMode: { type: [string, 'null'], enum: [SINGLE, EITHER_OR_SURVIVOR, FORMER_OR_SURVIVOR, ANYONE_OR_SURVIVOR, JOINTLY, null] }
        nominationMode: { type: [string, 'null'], enum: [NONE, SIMULTANEOUS, SUCCESSIVE, null] }
        nominees: { type: [array, 'null'], maxItems: 10, items: { $ref: '#/components/schemas/DepositNomineeInput' } }
        amount: { type: [number, string] }
        tenureMonths: { type: [integer, 'null'], minimum: 0 }
        tenureDays: { type: [integer, 'null'], minimum: 0 }
        addOns: { type: [array, 'null'], items: { type: string }, description: Codes of the product's add-ons claimed for this deposit }
        payoutTo: { type: [string, 'null'], enum: [CASA, BANK_ACCOUNT, null], description: 'Where interest and maturity proceeds go. Default BANK_ACCOUNT' }
        payoutAccountId: { type: [string, 'null'], format: uuid, description: 'With CASA: an active savings or current account held by the depositor' }
        maturityInstruction: { type: [string, 'null'], enum: [PAY_OUT, RENEW_PRINCIPAL, RENEW_WITH_INTEREST, null], description: Default PAY_OUT }
    TermDepositPreview:
      type: object
      properties:
        productCode: { type: string }
        productVersion: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        tenureMonths: { type: integer }
        tenureDays: { type: integer }
        startDate: { type: string, format: date, description: 'The business date, taken as the funding date' }
        maturityDate: { type: string, format: date }
        ratePercent: { type: string, description: The card rate plus the add-ons given }
        cardRatePercent: { type: string }
        cardFromAmount: { type: string, description: The amount step of the rate card the deposit falls in }
        cardFromMonths: { type: integer }
        cardFromDays: { type: integer }
        addOns: { type: array, items: { $ref: '#/components/schemas/DepositAddOnGiven' } }
        interestPeriodMonths: { type: integer }
        cumulative: { type: boolean }
        recurring: { type: boolean, description: 'A recurring deposit (P4-5): amount is the monthly instalment; the figures assume every instalment is paid on its due date' }
        totalInterest: { $ref: '#/components/schemas/Money' }
        maturityValue: { $ref: '#/components/schemas/Money', description: 'Repaid at maturity before tax: the principal, plus all interest when cumulative' }
        annualisedYieldPercent: { type: string }
        periods:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              from: { type: string, format: date, description: First day that earns }
              to: { type: string, format: date, description: Day of the credit }
              balance: { $ref: '#/components/schemas/Money' }
              interest: { $ref: '#/components/schemas/Money' }
              whole: { type: boolean, description: 'false for a last period shorter than the interest period' }
        tdsApplicable: { type: boolean }
        tax:
          type: array
          description: Empty for a product that deducts no tax
          items:
            type: object
            properties:
              period: { type: integer }
              'on': { type: string, format: date }
              taxYearStarting: { type: integer }
              interest: { $ref: '#/components/schemas/Money' }
              tax: { $ref: '#/components/schemas/Money' }
        totalTax: { type: [string, 'null'], description: null for a product that deducts no tax }
        taxNote: { type: [string, 'null'] }
        insured: { type: [boolean, 'null'], description: 'false: deposits with this institution are not insured (deposit-taking NBFC); say so on what the depositor is given' }
    BankAccountInput:
      type: object
      description: An account at another bank. Stored sealed; shown with its last four digits only.
      required: [holderName, accountNumber, ifsc]
      properties:
        holderName: { type: string, maxLength: 100 }
        accountNumber: { type: string, description: 6 to 35 letters or digits; spaces are ignored }
        ifsc: { type: string, pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$' }
    DepositTransactionInput:
      type: object
      required: [type, amount]
      properties:
        type: { type: string, enum: [CASH_DEPOSIT, CASH_WITHDRAWAL, BANK_TRANSFER_IN, BANK_TRANSFER_OUT] }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        reference: { type: [string, 'null'], maxLength: 60, description: 'The bank''s UTR (required for a bank transfer recorded by staff), or a slip number' }
        narration: { type: [string, 'null'], maxLength: 200 }
        bankAccount: { $ref: '#/components/schemas/BankAccountInput', description: 'The payee (required for BANK_TRANSFER_OUT) or the remitter (optional for BANK_TRANSFER_IN)' }
        viaGateway:
          type: [boolean, 'null']
          description: >-
            BANK_TRANSFER_OUT only (P4-2b): send it through the payment gateway. No UTR is needed: the bank gives it when it pays. The money
            leaves the account when the request is applied and waits in transit; if the payout fails or comes back, it returns to the account.
