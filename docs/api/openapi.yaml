        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-products/preview:
    post:
      tags: [Lending]
      operationId: previewLoanProduct
      summary: Simulate an account on a draft product - schedule, fees, net disbursal, APR (US-044; nothing is stored)
      description: >-
        The product need not be saved or approved, and needs no code. The sample loan defaults to the product's
        smallest amount, shortest tenor and lowest rate. GST is shown as an intra-state supply. For a STRUCTURED
        product without `scheduleRows`, equal principal on each period date is shown as an example
        (`sampleSchedule: true`). The engine is the one that books loans, so a product the engine would refuse is
        refused here (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPreviewRequest' }
      responses:
        '200':
          description: KFS figures of the sample loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanKfs' }
        default: { $ref: '#/components/responses/Problem' }
