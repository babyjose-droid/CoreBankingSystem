      type: object
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        narration: { type: [string, 'null'], maxLength: 200 }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    DepositHoldInput:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [DEBIT_FREEZE, CREDIT_FREEZE, TOTAL_FREEZE, LIEN] }
        amount: { type: [number, 'null'], description: A lien's amount; a freeze has none }
        reason: { type: string, maxLength: 500 }
        reference: { type: [string, 'null'], maxLength: 100, description: The order or the loan the hold is for }
    TermDepositFundingInput:
      type: object
      required: [source]
      properties:
