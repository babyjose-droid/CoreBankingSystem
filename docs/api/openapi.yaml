        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Integrations]
      operationId: proposeMessageTemplate
      summary: Propose a template (maker-checker)
      description: 'Permission: message:admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageTemplateInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/message-templates/variables:
    get:
      tags: [Integrations]
      operationId: listMessageTemplateVariables
      summary: Template codes (events) and the placeholders each may use
      description: 'Permission: message:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/messages:
    get:
      tags: [Integrations]
      operationId: listMessages
      summary: The delivery log - recipient masked, never the text
      description: 'Permission: message:view.'
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: loanId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: 'QUEUED, SENT, FAILED or SUPPRESSED', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/customers/{id}/message-opt-outs:
    post:
      tags: [Integrations]
      operationId: setMessageOptOut
      summary: Record or lift a customer opt-out of a channel
      description: 'Permission: message:admin.'
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageOptOut' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /platform/v1/tenants:
    get:
      tags: [Control plane]
      operationId: listTenants
      summary: List tenants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Control plane]
      operationId: provisionTenant
      summary: Provision a tenant (database, migrations, starter kit, first admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '201':
          description: Provisioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/tenants/{code}/modules:
    put:
      tags: [Control plane]
      operationId: setTenantModules
      summary: Set tenant modules
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/tenants/{code}/deposit-registration:
    put:
      tags: [Control plane]
      operationId: setTenantDepositRegistration
      summary: Record or withdraw an NBFC's registration to accept public deposits
      description: >-
        Permission platform:operator. The control plane records the registration (the evidence is the RBI certificate
        reference) and writes the operator log; the tenant's own database is then told, which puts the deposit-taking NBFC
        rule set in force there and adds the term deposit heads to its chart. The TD module can be enabled only afterwards
        (PUT /platform/v1/tenants/{code}/modules). 409 for a tenant that is not an NBFC, and for a withdrawal while the TD
        module is enabled. Repeating the call is safe.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositRegistration' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/migrations:
    post:
      tags: [Control plane]
      operationId: migrateAllTenants
      summary: Migrate all tenants
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Per-tenant result; one failure does not stop the others
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MigrationResult' }
        default: { $ref: '#/components/responses/Problem' }
  # ---- P2-7 platform completion ----
  /api/v1/custom-fields:
    get:
      tags: [Platform]
      operationId: listCustomFields
      summary: Custom field definitions for customers, loan accounts and loan products
      description: Permission `custom-field:view`.
      parameters:
        - { name: entity, in: query, schema: { type: string, enum: [CUSTOMER, LOAN_ACCOUNT, LOAN_PRODUCT] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomField' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeCustomField
      summary: Propose a custom field or a change to one (maker-checker)
      description: >-
        Permission `custom-field:propose`. The type and the personal-data flag of an existing field cannot change; a field
        is deactivated, never deleted. A field flagged `pii` must be TEXT: its values are stored encrypted and returned masked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-products/{code}/custom:
    get:
      tags: [Lending]
      operationId: getLoanProductCustom
      summary: Custom field values of a loan product
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanProductCustom' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Lending]
      operationId: proposeLoanProductCustom
      summary: Propose the custom field values of a loan product (maker-checker)
      description: Permission `product:propose`. The body holds the complete set of values.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom: { $ref: '#/components/schemas/CustomValues' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/deferred-receipts:
    get:
      tags: [Lending]
      operationId: listLoanDeferredReceipts
      summary: Receipts of the loan accepted during end of day
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts:
    get:
      tags: [Lending]
      operationId: listDeferredReceipts
      summary: Receipts accepted during end of day, in the caller's branch scope
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPLIED, FAILED, CANCELLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts/{id}/retry:
    post:
      tags: [Lending]
      operationId: retryDeferredReceipt
      summary: Queue a failed receipt again
      description: Permission `loan:admin`. Use it once the cause of the failure (for example a frozen loan) is fixed.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts/{id}/cancel:
    post:
      tags: [Lending]
      operationId: cancelDeferredReceipt
      summary: Set a failed receipt aside (refunded or handled outside)
      description: Permission `loan:admin`. The note says what was done with the money.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sessions:
    get:
      tags: [Session]
      operationId: listSessions
      summary: The caller's login sessions, or another user's with session:admin
      parameters:
        - { name: user, in: query, description: User name; needs `session:admin`, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoginSession' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{id}:
    delete:
      tags: [Session]
      operationId: terminateSession
      summary: End a login session
      description: >-
        Without `user` the session must be one of the caller's own; with `user` (`session:admin`) one of that user's.
        Every termination is audited. An access token already issued stays valid until it expires.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        '204': { description: Ended }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Job catalogue with schedules, next fire time and last run
      description: Permission `job:view`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/runs:
    get:
      tags: [Jobs]
      operationId: listJobRuns
      summary: Job runs, newest first
      parameters:
        - { name: job, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{code}:
    put:
      tags: [Jobs]
      operationId: proposeJobSchedule
      summary: Propose a job's schedule, on/off switch and parameters (maker-checker)
      description: >-
        Permission `job:schedule`. The schedule is a six-field cron (second minute hour day-of-month month day-of-week)
        in India Standard Time. For a report job the maker needs the report's permission; the scheduled runs use the
        maker's branch scope and belong to the maker.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobScheduleInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{code}/run:
    post:
      tags: [Jobs]
      operationId: runJob
      summary: Run a job now
      description: Permission `job:run`. Answers when the job has finished. 409 when the job is already running.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/dashboard/trend:
    get:
      tags: [Reporting]
      operationId: getDashboardTrend
      summary: Whole-book figures per business date (all-branch users)
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 366 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DashboardTrendPoint' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access:
    get:
      tags: [Platform]
      operationId: listSupportAccess
      summary: Support access requests and grants of this tenant
      description: Permission `support-access:approve`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, APPROVED, REJECTED, REVOKED, EXPIRED, LAPSED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/approve:
    post:
      tags: [Platform]
      operationId: approveSupportAccess
      summary: Approve a support access request; it expires after the requested duration
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/reject:
    post:
      tags: [Platform]
      operationId: rejectSupportAccess
      summary: Reject a support access request (a note is required)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/revoke:
    post:
      tags: [Platform]
      operationId: revokeSupportAccess
      summary: Revoke a support access grant at once
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage:
    get:
      tags: [Control plane]
      operationId: listUsage
      summary: Daily usage per tenant (active loans and customers, API calls, storage, staff users)
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageDay' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/monthly:
    get:
      tags: [Control plane]
      operationId: listMonthlyUsage
      summary: Monthly usage per tenant for billing
      parameters:
        - { name: month, in: query, description: YYYY-MM; the previous month when left out, schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageMonth' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/monthly.csv:
    get:
      tags: [Control plane]
      operationId: exportMonthlyUsage
      summary: Monthly usage per tenant as CSV
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/snapshot:
    post:
      tags: [Control plane]
      operationId: snapshotUsage
      summary: Take the usage snapshot now for one tenant or for all
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: One entry per tenant
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/support-access:
    get:
      tags: [Control plane]
      operationId: listSupportRequests
      summary: The engineer's own support access requests (all of them for an operator)
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Control plane]
      operationId: requestSupportAccess
      summary: Ask for time-boxed, read-only access to a tenant
      description: >-
        Permission `platform:support` (platform realm). Nothing is granted by this call: the tenant's admin approves in
        the tenant API. While a grant is in force the engineer may call that tenant's GET endpoints on the support list
        with the headers `X-Support-Tenant` and `X-Support-Grant`; responses have personal values masked and every call
        is written to the tenant's audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportAccessRequest' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/casa/rules:
    get:
      tags: [Deposits]
      operationId: getCasaDepositRules
      summary: The deposit rule set in force for this institution
      description: >-
        Module CASA. Permission product:view, casa:view or deposit:view. The rules are dated rows chosen by the institution's type
        (BANK, or NBFC_DEPOSIT for an NBFC registered to accept public deposits), each with its source and whether the source
        text was verified. The same answer under /api/v1/casa/rules and /api/v1/deposits/rules.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositRuleSet' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/products:
    get:
      tags: [Deposits]
      operationId: listCasaProducts
      summary: Savings and current products
      description: >-
        Module CASA. Permission product:view or casa:view. Ordered by code; withdrawn products included.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositProduct' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeCasaProduct
      summary: Propose a new savings and current product, or the replacement of an existing one (maker-checker)
      description: >-
        Module CASA. Permission product:propose. The whole product is proposed; an existing code is replaced on approval and
        becomes its next version (every version is kept). 422 with `problems`, every reason at once, when the product cannot be
        approved under the rule set in force: a savings rate band below the uniform-rate limit, interest on a current account,
        or an institution that may not take demand deposits. The check is repeated when the
        request is approved. The family and type of a product never change; a withdrawn product is not changed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/products/check:
    post:
      tags: [Deposits]
      operationId: checkCasaProduct
      summary: What stops a product as entered from being approved; nothing is stored
      description: >-
        Module CASA. Permission product:propose. `problems` is empty when the product can be proposed. 422 when the input
        itself is malformed (a missing code, an amount with three decimals).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositProblems' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/products/{code}:
    get:
      tags: [Deposits]
      operationId: getCasaProduct
      summary: One savings and current product
      description: >-
        Module CASA. Permission product:view or casa:view. 404 for a product of the other family.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositProduct' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/products/{code}/history:
    get:
      tags: [Deposits]
      operationId: getCasaProductHistory
      summary: Every version of the product, newest first
      description: >-
        Module CASA. Permission product:view.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositProductVersion' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/products/{code}/withdraw:
    post:
      tags: [Deposits]
      operationId: withdrawCasaProduct
      summary: Propose the withdrawal of a product (maker-checker)
      description: >-
        Module CASA. Permission product:propose. A withdrawn product takes no new account; its accounts go on as they are.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductWithdrawal' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts:
    get:
      tags: [Deposits]
      operationId: listCasaAccounts
      summary: Savings and current accounts in the caller's branches, newest first
      description: >-
        Module CASA. Permission casa:view. At most 500.
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid }, description: 'Accounts this customer holds, as any holder' }
        - { name: status, in: query, schema: { type: string, enum: [BOOKED, ACTIVE, MATURED, CLOSED, CANCELLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositAccountSummary' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: openCasaAccount
      summary: Propose the opening of a savings or current account (maker-checker)
      description: >-
        Module CASA. Permission casa:open. The account opens with no balance when the request is approved; its number comes
        from the CASA series. 422 with `problems`, every reason at once: a holder who is not ACTIVE or whose KYC is not VERIFIED,
        a holder under 18, the wrong number of holders for the operating mode, a joint holder that is not an individual, nominee
        shares that do not total 100, more nominees than the rule set allows, a withdrawn product, a branch that is not active.
        403 for a branch outside the caller's branch scope. 409 while the business day is not OPEN.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CasaAccountInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}:
    get:
      tags: [Deposits]
      operationId: getCasaAccount
      summary: One savings or current account with its holders and nominees
      description: >-
        Module CASA. Permission casa:view. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositAccount' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/transactions:
    post:
      tags: [Deposits]
      operationId: proposeCasaTransaction
      summary: Propose a cash deposit or withdrawal, or a bank transfer in or out (maker-checker by amount)
      description: >-
        Module CASA. Permission casa:transact. Applied at once below the tenant's threshold (approval rules: 2,00,000 to start
        with), when the answer is already APPROVED; from the threshold upward it waits for a checker. The maker's role amount limit
        DEPOSIT_CREDIT (money in) or DEPOSIT_DEBIT (money out) applies, and the checker's on approval. A bank transfer is recorded
        with the bank's reference (UTR); a transfer out names the payee's bank account, which is stored sealed and shown masked.
        Sending and receiving through the payment gateway comes later (P4-2b). 422 with `problems`, every reason at once: an
        amount not above zero or in fractions of a paisa, a balance that would fall below zero or below the liens, a freeze in
        force, a missing UTR or bank account, an invalid IFSC. The same checks run again when the request is applied.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositTransactionInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/movements:
    get:
      tags: [Deposits]
      operationId: listCasaMovements
      summary: The movements of a savings or current account, newest first, with the balance after each
      description: Module CASA. Permission casa:view. At most 1000. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: from, in: query, schema: { type: string, format: date }, description: First business date }
        - { name: to, in: query, schema: { type: string, format: date }, description: Last business date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositMovement' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/collection-orders:
    post:
      tags: [Deposits]
      operationId: createCasaCollectionOrder
      summary: Create a payment link for a savings or current account
      description: >-
        Module CASA. Permission casa:transact. Needs an active collection provider. The payment credits the account when it arrives (value on the business date it is posted).
        A payment the account cannot take goes to the unmatched receipts queue.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositCollectionOrderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Deposits]
      operationId: listCasaCollectionOrders
      summary: The payment links of a savings or current account
      description: Module CASA. Permission casa:view.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/interest:
    get:
      tags: [Deposits]
      operationId: getCasaInterest
      summary: Where the interest of a savings or current account stands
      description: Module CASA. Permission casa:view. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositInterest' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/holds:
    get:
      tags: [Deposits]
      operationId: listCasaHolds
      summary: The freezes and liens of a savings or current account, active first
      description: Module CASA. Permission casa:view.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositHold' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeCasaHold
      summary: Propose a freeze or a lien (maker-checker)
      description: >-
        Module CASA. Permission casa:hold. Always waits for a checker. A debit freeze stops money going out, a credit freeze money
        coming in, a total freeze both; a lien holds an amount of the balance. 422: a freeze of a kind already in force, a freeze
        with an amount, a lien without one or above the available balance, no reason, an account that is not active.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositHoldInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/holds/{holdId}/release:
    post:
      tags: [Deposits]
      operationId: releaseCasaHold
      summary: Propose the release of a freeze or lien (maker-checker)
      description: Module CASA. Permission casa:hold. Always waits for a checker. 422 when already released or without a reason.
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/standing-instructions:
    get:
      tags: [Deposits]
      operationId: listStandingInstructions
      summary: The standing instructions an account pays or is paid by, or that pay a loan
      description: Module CASA. Permission casa:view. One of accountId and loanId is required. Active first, newest first.
      parameters:
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: loanId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StandingInstruction' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeStandingInstruction
      summary: Propose a standing instruction (maker-checker)
      description: >-
        Module CASA. Permission casa:transact. P4-5b. A checker approves it. The job STANDING_INSTRUCTIONS (every 15 minutes, and
        right after end of day) carries it out: each payment from its date, whole or not at all, tried again for the retry days
        (setting deposits.si.retry-days, 3) when it cannot be made. 422 with every reason it cannot be given.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StandingInstructionInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/standing-instructions/{id}:
    get:
      tags: [Deposits]
      operationId: getStandingInstruction
      summary: A standing instruction with its runs
      description: Module CASA. Permission casa:view. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandingInstructionDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/standing-instructions/{id}/cancel:
    post:
      tags: [Deposits]
      operationId: proposeStandingInstructionCancel
      summary: Propose cancelling a standing instruction, with a reason (maker-checker)
      description: Module CASA. Permission casa:transact. A checker approves it; nothing more is paid under it.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/pledge-quote:
    get:
      tags: [Deposits]
      operationId: getPledgeQuote
      summary: What pledging a term deposit for a loan would give, and why it cannot be
      description: Module TD. Permission deposit:view. P4-5b.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: loanId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PledgeQuote' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/pledge:
    post:
      tags: [Deposits]
      operationId: proposeDepositPledge
      summary: Propose pledging a term deposit for a loan (maker-checker)
      description: >-
        Module TD. Permission deposit:hold. P4-5b. A lien of the deposit's balance that names the loan. At a deposit-taking NBFC
        the loan is at most 75% of the deposits pledged, at least 2 points above their rate, and none within three months of a
        deposit; at a bank the tenant's policy applies (deposits.loan.max-percent, deposits.loan.spread-percent). The loan does
        not run past a deposit's maturity. The pledge is released once the loan is closed (by the day-end, or a staff release).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositPledgeInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/pledges:
    get:
      tags: [Deposits]
      operationId: listLoanPledges
      summary: The deposits pledged for a loan
      description: Module TD. Permission deposit:view. 404 for a loan outside the caller's branch scope.
      parameters:
        - { name: loanId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanPledge' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/cheques:
    get:
      tags: [Deposits]
      operationId: getCasaCheques
      summary: An account's cheque books and leaves, the cheques presented on it and the cheques paid into it
      description: Module CASA. Permission casa:view. P4-6. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasaCheques' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/cheque-books:
    post:
      tags: [Deposits]
      operationId: proposeChequeBook
      summary: Propose issuing a cheque book (maker-checker)
      description: >-
        Module CASA. Permission casa:transact. P4-6. On an active, operative account whose product has the cheque facility. A checker
        approves it; the book takes the next run of cheque numbers (each number issued once across the institution).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChequeBookInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/cheques/stop:
    post:
      tags: [Deposits]
      operationId: stopCheques
      summary: Stop payment of one cheque or a run of them
      description: >-
        Module CASA. Permission casa:transact. P4-6. Takes effect at once (approval rule CHEQUE STOP, no checker): a stop payment
        protects the customer. Every cheque in the run is issued to the account and unused.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChequeStopInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/cheques/{leafNo}/revoke-stop:
    post:
      tags: [Deposits]
      operationId: proposeChequeStopRevoke
      summary: Propose revoking a stop payment (maker-checker)
      description: Module CASA. Permission casa:transact. P4-6. A checker approves it; the cheque may then be paid.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: leafNo, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/clearing/inward:
    post:
      tags: [Deposits]
      operationId: presentCheque
      summary: Present a cheque drawn on one of our accounts (the inward clearing simulator)
      description: >-
        Module CASA. Permission casa:transact. P4-6. Decided at once and recorded either way. Paid: the account is debited (CHEQUE_PAID)
        against the inward clearing head (setting deposits.gl.inward-clearing, 2409). Returned, with the first reason that applies:
        the account is not ours or not active, the cheque was not issued to it, is already paid or stopped, is post-dated or stale
        (older than deposits.cheque-valid-months, 3), the account is frozen or inoperative, or the available balance is short
        (AMOUNT_HELD when a lien makes it short). No return charge is levied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChequePresentmentInput' }
      responses:
        '200':
          description: The outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChequePresentmentOutcome' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/cheque-deposits:
    post:
      tags: [Deposits]
      operationId: lodgeCheque
      summary: Pay in another bank's cheque (outward clearing)
      description: >-
        Module CASA. Permission casa:transact. P4-6. The cheque waits in clearing; the account is credited only once it is settled
        as cleared. Not a post-dated or stale cheque; the account takes credits.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChequeDepositInput' }
      responses:
        '201':
          description: Lodged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChequeDeposit' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/cheque-deposits:
    get:
      tags: [Deposits]
      operationId: listChequesInClearing
      summary: Cheques paid in and waiting in clearing
      description: Module CASA. Permission casa:view. P4-6. Within the caller's branch scope, oldest first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChequeDeposit' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/cheque-deposits/{id}/settle:
    post:
      tags: [Deposits]
      operationId: settleChequeDeposit
      summary: Settle a cheque in clearing as cleared or returned (the outward clearing simulator)
      description: >-
        Module CASA. Permission casa:transact. P4-6. CLEARED credits the account (CHEQUE_DEPOSIT) against the outward clearing head
        (setting deposits.gl.outward-clearing, 1207); RETURNED, with a reason, credits nothing. Settled once.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChequeSettleInput' }
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChequeDeposit' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/dormancy:
    get:
      tags: [Deposits]
      operationId: listDormantAccounts
      summary: Accounts due for review, inoperative, or with a balance transferred as unclaimed
      description: >-
        Module CASA. Permission casa:view. P4-6. Bank rule sets only (applies is false at an NBFC). A savings or current account with
        no customer movement for the review months is listed for review; for the inoperative months (two years) the day-end makes it
        inoperative; for the unclaimed years (ten) the day-end transfers its balance to the unclaimed deposits head (setting
        deposits.gl.unclaimed, 2407) for the DEA Fund. A term deposit unclaimed ten years after maturity is transferred too.
      parameters:
        - { name: stage, in: query, required: false, schema: { type: string, enum: [REVIEW, INOPERATIVE, UNCLAIMED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DormancyList' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/reactivate:
    post:
      tags: [Deposits]
      operationId: proposeCasaReactivation
      summary: Propose reactivating an inoperative account, with the KYC record updated (maker-checker)
      description: >-
        Module CASA. Permission casa:open. P4-6. A checker approves it. A balance transferred as unclaimed is refunded to the account
        first (UNCLAIMED_REFUND); the account is operative again from the business date. No charge is levied for reactivation.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactivationInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/claim:
    post:
      tags: [Deposits]
      operationId: proposeUnclaimedClaim
      summary: Propose refunding a term deposit's unclaimed balance to the claimant (maker-checker)
      description: Module TD. Permission deposit:fund. P4-6. A checker approves it; the balance comes back to the deposit (UNCLAIMED_REFUND) to be paid out or closed.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactivationInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/register:
    get:
      tags: [Deposits]
      operationId: getDepositRegister
      summary: The register of deposits
      description: >-
        Module TD. Permission deposit:view. P4-6. Every term and recurring deposit funded and not closed, with its depositor and
        terms, the total, and where a deposit-taking NBFC stands against its cap.
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositRegister' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/net-owned-fund:
    get:
      tags: [Deposits]
      operationId: getNetOwnedFund
      summary: The net owned fund and the cap on public deposits
      description: >-
        Module TD. Permission deposit:view. P4-6. A deposit-taking NBFC holds public deposits to 1.5 times its net owned fund (rule
        TD_DEPOSITS_TO_NOF); applies is false for a bank. Outstanding is every term deposit funded and not closed, at its balance.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetOwnedFund' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeNetOwnedFund
      summary: Propose recording the net owned fund from an audited balance sheet (maker-checker)
      description: >-
        Module TD. Permission product:propose. P4-6. A checker approves it; the latest balance sheet date governs. A funding and a
        recurring deposit's instalment are refused (422) when they would take public deposits past the cap, and every new deposit
        while no net owned fund is recorded.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetOwnedFundInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/transfers:
    post:
      tags: [Deposits]
      operationId: proposeCasaTransfer
      summary: Propose a transfer between two savings or current accounts (maker-checker by amount)
      description: >-
        Module CASA. Permission casa:transact. The paying account must be in the caller's branch scope; the receiving account may
        be at any branch (inter-branch legs are posted). As the other transactions: at once below the threshold, the DEPOSIT_DEBIT
        limit, 422 with every reason (including a credit freeze on the receiving account).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositTransferInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/movements/{movementId}/reverse:
    post:
      tags: [Deposits]
      operationId: proposeMovementReversal
      summary: Propose the reversal of a posted movement, with a reason (maker-checker)
      description: >-
        Module CASA. Permission casa:transact. Always waits for a checker. The mirror lot is posted; a transfer is reversed on both
        sides. A freeze does not stop a reversal (a correction), but the balance may not fall below zero or below the liens. 422:
        no reason, a movement already reversed, a reversal, a movement that funded a term deposit (reverse the funding instead).
      parameters:
        - { name: movementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/charges:
    get:
      tags: [Deposits]
      operationId: listCasaCharges
      summary: The charges levied on a savings or current account, with their GST invoices (P4-4)
      description: Module CASA. Permission casa:view. Newest first, at most 500. A charge whose movement was reversed is CANCELLED, with a credit note.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositCharge' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeCasaCharge
      summary: Propose one of the product's service charges (maker-checker)
      description: >-
        Module CASA. Permission casa:transact. Always waits for a checker. The charge is the amount in the product's schedule with
        GST on top (CGST and SGST within the branch's state, IGST when the depositor's address is in another state), and gets a tax
        invoice. 422 with every reason: a code the product does not have, no reason, an account that is not ACTIVE, too little free
        balance (after liens; none when frozen for debits). To refund a charge, reverse its movement: it is then cancelled with a
        credit note.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositChargeInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/minimum-balance:
    get:
      tags: [Deposits]
      operationId: listCasaMinimumBalanceMonths
      summary: The month-ends evaluated against the product's minimum balance (P4-4)
      description: >-
        Module CASA. Permission casa:view. Newest first. The day-end compares each month's average daily closing balance with the
        product's minimum; a short month is notified, and a short month after a notified one is charged (a percentage of the
        shortfall, capped, never below zero).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MinimumBalanceMonth' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/closure-quote:
    get:
      tags: [Deposits]
      operationId: getCasaClosureQuote
      summary: What closing a savings or current account today would pay, and why it cannot be closed
      description: Module CASA. Permission casa:view. Interest to the day before, the closure charge of the product's schedule, the rest payable.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasaClosureQuote' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/close:
    post:
      tags: [Deposits]
      operationId: proposeCasaClosure
      summary: Propose closing a savings or current account (maker-checker)
      description: >-
        Module CASA. Permission casa:transact. Always waits for a checker. When applied: interest to the day before is credited, the
        closure charge taken (with GST), the rest paid to another account, in cash or by a bank transfer (with its UTR), and the account
        CLOSED. 422 with every reason: no reason, a freeze or lien in force, a deposit paying out to the account, a gateway transfer
        not yet paid, where the money goes not given or not possible.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CasaClosureInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/rules:
    get:
      tags: [Deposits]
      operationId: getTermDepositRules
      summary: The deposit rule set in force for this institution
      description: >-
        Module TD. Permission product:view, casa:view or deposit:view. The rules are dated rows chosen by the institution's type
        (BANK, or NBFC_DEPOSIT for an NBFC registered to accept public deposits), each with its source and whether the source
        text was verified. The same answer under /api/v1/casa/rules and /api/v1/deposits/rules.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositRuleSet' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/products:
    get:
      tags: [Deposits]
      operationId: listTermProducts
      summary: Term deposit products
      description: >-
        Module TD. Permission product:view or deposit:view. Ordered by code; withdrawn products included.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositProduct' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeTermProduct
      summary: Propose a new term deposit product, or the replacement of an existing one (maker-checker)
      description: >-
        Module TD. Permission product:propose. The whole product is proposed; an existing code is replaced on approval and
        becomes its next version (every version is kept). 422 with `problems`, every reason at once, when the product cannot be
        approved under the rule set in force: for a term deposit product that includes an amount or tenure it accepts that has no
        rate, a rate above the ceiling with every add-on, and a tenure outside the rule set's limits. The check is repeated when the
        request is approved. The family and type of a product never change; a withdrawn product is not changed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/products/check:
    post:
      tags: [Deposits]
      operationId: checkTermProduct
      summary: What stops a product as entered from being approved; nothing is stored
      description: >-
        Module TD. Permission product:propose. `problems` is empty when the product can be proposed. 422 when the input
        itself is malformed (a missing code, an amount with three decimals).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositProblems' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/products/{code}:
    get:
      tags: [Deposits]
      operationId: getTermProduct
      summary: One term deposit product
      description: >-
        Module TD. Permission product:view or deposit:view. 404 for a product of the other family.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositProduct' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/products/{code}/history:
    get:
      tags: [Deposits]
      operationId: getTermProductHistory
      summary: Every version of the product, newest first
      description: >-
        Module TD. Permission product:view.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositProductVersion' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/products/{code}/withdraw:
    post:
      tags: [Deposits]
      operationId: withdrawTermProduct
      summary: Propose the withdrawal of a product (maker-checker)
      description: >-
        Module TD. Permission product:propose. A withdrawn product takes no new account; its accounts go on as they are.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositProductWithdrawal' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/preview:
    post:
      tags: [Deposits]
      operationId: previewTermDeposit
      summary: The figures of a term deposit before it is booked; nothing is stored
      description: >-
        Module TD. Permission deposit:view or deposit:book. Rate with its parts (card rate, add-ons), maturity date and value,
        every interest credit and, for a product that deducts tax, the tax expected on each credit from this deposit's interest
        alone. The booking and (later) the day-end take the same figures from the same calculation. Interest starts when the
        deposit is funded; the preview takes the business date as that day. Without a customer the senior citizen add-on
        cannot be previewed. 422 with `problems` when the product or the rule set does not allow the deposit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermDepositInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDepositPreview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts:
    get:
      tags: [Deposits]
      operationId: listTermDeposits
      summary: Term deposits in the caller's branches, newest first
      description: >-
        Module TD. Permission deposit:view. At most 500.
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid }, description: 'Accounts this customer holds, as any holder' }
        - { name: status, in: query, schema: { type: string, enum: [BOOKED, ACTIVE, MATURED, CLOSED, CANCELLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositAccountSummary' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: bookTermDeposit
      summary: Propose the booking of a term deposit (maker-checker)
      description: >-
        Module TD. Permission deposit:book. On approval the deposit is BOOKED with a number from the term deposit series and
        its terms are frozen (rate with its parts, interest period, day count, rounding, tax and premature-withdrawal settings
        of the product version); it waits for its funds, and interest starts on the funding date. 422 with `problems` as for a
        savings account, and also when the amount or tenure is outside the product or the rule set, an add-on is not the
        product's or the depositor is not entitled to it, the payout account is not an active savings or current account of
        the depositor, or the product does not allow renewal. Where the rule set needs the depositor's consent for a renewal
        (deposit-taking NBFC), a deposit is booked to be paid out. 409 on approval when the product no longer gives the rate
        that was shown when the deposit was proposed.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermDepositInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}:
    get:
      tags: [Deposits]
      operationId: getTermDeposit
      summary: One term deposit with its holders, nominees and frozen terms
      description: >-
        Module TD. Permission deposit:view. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositAccount' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/deposits/accounts/{id}/fund:
    post:
      tags: [Deposits]
      operationId: proposeTermDepositFunding
      summary: Propose funding a booked term deposit with its principal (maker-checker by amount)
      description: >-
        Module TD. Permission deposit:fund. From a savings or current account the depositor holds, in cash, or by a bank transfer
        (with its UTR). Interest starts on the business date it is applied; the maturity date follows. A deposit paid out to a bank
        account has that account recorded now. At once below the threshold, as money in and out. 422 with every reason: a deposit
        that is not BOOKED, a booking older than the funding window (tenant setting, 30 days to start with), an account the
        depositor does not hold, a balance that would fall below zero or the liens, a missing UTR, a missing or unneeded bank account.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermDepositFundingInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/instalments:
    get:
      tags: [Deposits]
      operationId: getRdInstalments
      summary: The instalments of a recurring deposit, paid and to pay
      description: Module TD. Permission deposit:view. 404 for a deposit that is not a recurring deposit, or outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RdInstalments' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeRdInstalment
      summary: Propose paying the next instalment of a recurring deposit (maker-checker)
      description: >-
        Module TD. Permission deposit:fund. P4-5. The next instalment in order, with its late charge (Rs per 100 per month or part
        of a month) when paid after its due date; the late charge goes to charge income. Posts at once below the tenant's threshold
        (2,00,000 on the demo rules) and waits for a checker from it. 422: a deposit booked and not funded (its first instalment is
        its funding), not active, at or past its maturity date, all instalments paid, a bank transfer without its UTR, an account
        not held by the depositor or without the money.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RdInstalmentInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/funding/reverse:
    post:
      tags: [Deposits]
      operationId: proposeTermDepositFundingReversal
      summary: Propose the reversal of a deposit's funding (maker-checker)
      description: >-
        Module TD. Permission deposit:fund. Always waits for a checker. The money goes back where it came from and the deposit is
        BOOKED again. 422: no reason, a deposit not funded, a lien in force, money moved on the deposit since.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/movements:
    get:
      tags: [Deposits]
      operationId: listTermDepositMovements
      summary: The movements of a term deposit, newest first
      description: Module TD. Permission deposit:view.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositMovement' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/interest:
    get:
      tags: [Deposits]
      operationId: getTermDepositInterest
      summary: Where the interest of a term deposit stands
      description: Module TD. Permission deposit:view. 404 outside the caller's branch scope.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositInterest' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/tax/declarations:
    get:
      tags: [Deposits]
      operationId: listTaxDeclarations
      summary: A depositor's Form 121 declarations, newest tax year first
      description: Module TD. Permission deposit:view.
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaxDeclaration' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeTaxDeclaration
      summary: Propose recording a depositor's Form 121 for a tax year
      description: >-
        Module TD. Permission deposit:tax. A checker approves it. From then no tax is deducted from the depositor's interest
        for that tax year. Refused for a non-individual, without a PAN on file, or when one is already in force.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxDeclarationInput' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/tax/declarations/{id}/revoke:
    post:
      tags: [Deposits]
      operationId: proposeTaxDeclarationRevoke
      summary: Propose revoking a Form 121 declaration, with a reason
      description: Module TD. Permission deposit:tax. A checker approves it; the next credit deducts the tax for the whole year so far.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/casa/accounts/{id}/statement.pdf:
    get:
      tags: [Documents]
      operationId: getCasaStatementPdf
      summary: Statement of a savings or current account as PDF
      description: |
        Module CASA. Permission `casa:view`; the account must be in the caller's branch scope (404 otherwise). P4-7.
        The holders (the first with the address), the opening balance, every movement with its reference and the running
        balance, the totals, the closing balance and any amount held under lien; the line on deposit insurance. Built from
        the movements and refused if they do not lead to the closing balance. At most two years. Audited
        (`DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default: the first day of the business date''s month, or the opening date' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default: the business date; cannot be later' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/statement.pdf:
    get:
      tags: [Documents]
      operationId: getDepositStatementPdf
      summary: Statement of a term or recurring deposit as PDF
      description: Module TD. Permission `deposit:view`. P4-7. As the savings statement, with the deposit's rate.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default: the first day of the business date''s month, or the booking date' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default: the business date; cannot be later' }
      responses:
        '200':
          description: 'The PDF, as a download'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/receipt.pdf:
    get:
      tags: [Documents]
      operationId: getDepositReceiptPdf
      summary: Receipt of a term or recurring deposit as PDF
      description: |
        Module TD. Permission `deposit:view`. P4-7. The depositor(s), the amount (a recurring deposit: the instalment) in
        figures and words, the rate and how interest is paid, the dates of deposit and maturity, the amount repayable on
        maturity in figures and words, what happens at maturity, any lien, and the authorised signatory's line. At a bank:
        the DICGC cover (tenant setting `deposits.dicgc.cover`, printed as "[not configured]" until set); at a
        deposit-taking NBFC: that the deposit is not insured. Audited.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: The deposit is not funded yet
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/tax/interest-certificate.pdf:
    get:
      tags: [Documents]
      operationId: getInterestCertificatePdf
      summary: Certificate of interest and tax deducted for a tax year as PDF
      description: |
        Module TD. Permission `deposit:view`. P4-7. The interest paid or credited (less any recovered on early closure)
        and the tax deducted at source on each of the depositor's accounts where they are the first holder, by account
        and by quarter, with the PAN masked and any Form 121 for the year. Only accounts in the caller's branches. The
        certificate of tax deducted (Form 16A) comes from TRACES and is not made here. Audited.
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: taxYear, in: query, schema: { type: integer }, description: 'The calendar year the tax year starts in (2026 for 2026-27). Default: the current one' }
      responses:
        '200':
          description: 'The PDF, as a download'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/tax/summary:
    get:
      tags: [Deposits]
      operationId: getDepositTaxSummary
      summary: A depositor's tax at source for a tax year
      description: Module TD. Permission deposit:view. The current tax year by default.
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: taxYear, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositTaxSummary' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/collection-orders:
    post:
      tags: [Deposits]
      operationId: createTermDepositCollectionOrder
      summary: Create a payment link for a booked term deposit
      description: >-
        Module TD. Permission deposit:fund. Needs an active collection provider. The payment of the principal funds the booked deposit; interest starts on the business date it is posted. One link waits at a time.
        A payment the account cannot take goes to the unmatched receipts queue.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositCollectionOrderInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Deposits]
      operationId: listTermDepositCollectionOrders
      summary: The payment links of a booked term deposit
      description: Module TD. Permission deposit:view.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/holds:
    get:
      tags: [Deposits]
      operationId: listTermDepositHolds
      summary: The liens of a term deposit, active first
      description: Module TD. Permission deposit:view.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositHold' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deposits]
      operationId: proposeTermDepositLien
      summary: Propose a lien on a funded term deposit (maker-checker)
      description: >-
        Module TD. Permission deposit:hold. Kind LIEN only (a term deposit takes no freeze). Always waits for a checker. 422: a
        deposit not funded, an amount above the available balance, no reason.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositHoldInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/closure-quote:
    get:
      tags: [Deposits]
      operationId: getTermDepositClosureQuote
      summary: What closing a term deposit today would pay (premature or at maturity), and why it cannot be closed
      description: >-
        Module TD. Permission deposit:view. Before maturity, the premature rule of the rule set: a deposit-taking NBFC repays
        nothing in the first three months except on death or, for an individual, an emergency or a critical illness; no interest
        from three to six months; after six months the rate for the period run less 2 points (the lowest rate less 3 when it has
        none); a bank the rate for the period run, not above the contracted rate, less the product's penalty. At or after maturity,
        interest for the days the proceeds waited (the contracted rate to the next working day when it matured on a holiday; then
        the overdue rate for a bank, nothing for an NBFC; rules unverified).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reason, in: query, schema: { type: string, enum: [DEPOSITOR_REQUEST, DEATH, EMERGENCY_EXPENSE, CRITICAL_ILLNESS] }, description: Why it is closed before maturity. Default DEPOSITOR_REQUEST }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDepositClosureQuote' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/close:
    post:
      tags: [Deposits]
      operationId: proposeTermDepositClosure
      summary: Propose closing a term deposit before maturity, or paying a matured one (maker-checker)
      description: >-
        Module TD. Permission deposit:fund. Always waits for a checker. When applied: interest above what the rule allows is recovered
        (or what is due beyond what was credited is credited, with tax at source), overdue interest credited, the whole balance paid
        to a savings or current account of the depositor (any account on death), in cash, by a bank transfer with its UTR, or through
        the payment gateway to the bank account recorded on the deposit, and the deposit CLOSED. 422 with every reason from the
        quote, and a closure for death, an emergency or illness without a note of what supports it.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermDepositClosureInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/maturity-instruction:
    post:
      tags: [Deposits]
      operationId: proposeMaturityInstruction
      summary: Propose a new maturity instruction for a funded deposit (maker-checker)
      description: >-
        Module TD. Permission deposit:fund. Always waits for a checker. PAY_OUT, RENEW_PRINCIPAL or RENEW_WITH_INTEREST, before the
        maturity date. On a deposit-taking NBFC a renewal needs the depositor's express consent (Directions para 17): the reference
        of their signed request and the date it was received; an instruction given at booking is not that consent. 422: the same
        instruction, a deposit not funded or at maturity, a product that does not renew, consent missing or dated outside booking
        and today.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaturityInstructionInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/accounts/{id}/renew:
    post:
      tags: [Deposits]
      operationId: proposeTermDepositRenewal
      summary: Propose renewing a matured deposit (maker-checker)
      description: >-
        Module TD. Permission deposit:fund. For a MATURED deposit (one the day-end could not pay or renew). Overdue interest is
        credited, then a new deposit is booked on the product's terms today (same product, tenure, holders, nominees and payout),
        funded with the whole balance or the principal (the rest paid out). An NBFC needs the depositor's consent with the request.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermDepositRenewalInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/maturities:
    get:
      tags: [Deposits]
      operationId: listDepositMaturities
      summary: Deposits maturing between two dates, and every matured deposit waiting to be paid
      description: >-
        Module TD. Permission deposit:view. In the caller's branches. Default from the business date for 30 days. With the expected
        amount, the instruction, the consent on file, the notice sent and why a matured deposit waits.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DepositMaturity' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deposits/holds/{holdId}/release:
    post:
      tags: [Deposits]
      operationId: releaseTermDepositLien
      summary: Propose the release of a lien on a term deposit (maker-checker)
      description: Module TD. Permission deposit:hold. Always waits for a checker.
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 100 }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string }
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Accepted:
      description: Change recorded as an approval request; applied when a checker approves it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Approval' }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
      examples: ['100000.00']
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        problems:
          type: array
          description: Every reason for a refusal, when a check reports them all at once (deposit products, account opening, bookings)
          items: { type: string }
        errors:
          type: array
          description: Field-level problems (validation), when there are several
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Me:
      type: object
      required: [userId, displayName, tenant, businessDate, permissions, modules]
      properties:
        userId: { type: string }
        displayName: { type: string }
        tenant: { type: string }
        tenantName: { type: string }
        homeBranch: { type: string }
        allBranches: { type: boolean, description: 'True when the user sees every branch (branch scope, US-020)' }
        branches:
          type: array
          description: Branches whose data the user can see
          items: { type: string }
        businessDate: { type: string, format: date }
        permissions:
          type: array
          items: { type: string, examples: ['customer:create', 'approval:approve'] }
        roles:
          type: array
          description: Realm roles (MAKER, CHECKER …); role amount limits apply by role
          items: { type: string }
        modules:
          type: array
          items: { type: string, examples: ['LENDING', 'GL'] }
    BusinessDay:
      type: object
      required: [businessDate, status]
      properties:
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, EOD_RUNNING, EOD_FAILED, CLOSED] }
    Branch:
      type: object
      required: [code, name, stateCode]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        name: { type: string }
        ifsc: { type: [string, 'null'] }
        stateCode: { type: string, description: 'GST state code, e.g. 32' }
        parentCode: { type: [string, 'null'] }
        headOffice: { type: boolean }
        status: { type: string, enum: [ACTIVE, CLOSED] }
    Holiday:
      type: object
      required: [day, reason]
      properties:
        branchCode: { type: [string, 'null'], description: null = all branches }
        day: { type: string, format: date }
        reason: { type: string }
    TaxRate:
      type: object
      required: [code, taxType, ratePercent, effectiveFrom]
      properties:
        code: { type: string, examples: ['GST18'] }
        taxType: { type: string, enum: [GST, TDS] }
        ratePercent: { type: string, examples: ['18.00'] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    EnumValue:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    EnumValueInput:
      type: object
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{1,40}$' }
        label: { type: string }
        sortOrder: { type: integer, default: 0 }
        active: { type: boolean, default: true }
    EnumerationType:
      type: object
      properties:
        type: { type: string }
        valueCount: { type: integer }
        activeCount: { type: integer }
    SystemProperty:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: [string, 'null'] }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PropertyChange:
      type: object
      required: [value]
      properties:
        value: { type: string }
        description: { type: string }
    BranchSet:
      type: object
      required: [code, name, branches]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string }
        branches:
          type: array
          minItems: 1
          items: { type: string }
    Staff:
      type: object
      required: [username, displayName, homeBranch]
      properties:
        userId: { type: string, readOnly: true, description: Derived by the server }
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{2,80}$', description: Keycloak username }
        displayName: { type: string }
        homeBranch: { type: string }
        allBranches: { type: boolean, default: false }
        branches:
          type: array
          description: Branches granted in addition to the home branch
          items: { type: string }
        branchSets:
          type: array
          description: Branch sets granted (all their member branches)
          items: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, EXITED], default: ACTIVE }
    State:
      type: object
      properties:
        code: { type: string, examples: ['KL'] }
        name: { type: string }
        gstStateCode: { type: string, examples: ['32'] }
        unionTerritory: { type: boolean }
    PincodePlace:
      type: object
      properties:
        pincode: { type: string }
        city: { type: string }
        district: { type: string }
        stateCode: { type: string }
        stateName: { type: string }
        gstStateCode: { type: string }
    VoucherUploadResult:
      type: object
      properties:
        vouchers: { type: integer }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
    Approval:
      type: object
      required: [id, entityType, action, status, maker, madeAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, examples: [CUSTOMER, BRANCH, BRANCH_SET, STAFF, GL_HEAD, VOUCHER, TAX_RATE, HOLIDAY, TERRITORY, ENUMERATION, SYSTEM_PROPERTY, EOD_SCHEDULE, LOAN_PRODUCT, LOAN_DISBURSEMENT, LOAN_WAIVER, LOAN_REVERSAL, LOAN_AMENDMENT, LOAN_RESTRUCTURE] }
        entityId: { type: [string, 'null'] }
        action: { type: string, examples: [CREATE, UPDATE, REVERSE] }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        maker: { type: string }
        madeAt: { type: string, format: date-time }
        checker: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        ageHours: { type: number, description: SLA ageing }
        checkersRequired: { type: integer, description: 'Distinct checkers needed (0-3), from the approval rules' }
        approvalsSoFar: { type: integer, description: Approvals already recorded while PENDING }
        appliedRef: { type: [string, 'null'], description: 'What the approval produced (customer id, voucher number …)' }
        current: { type: [object, 'null'], description: State before the change (null for CREATE) }
        proposed: { type: object, description: Proposed state }
    Decision:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    CustomerInput:
      type: object
      required: [customerType, firstName, homeBranch, dateOfBirth, mobile]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        customerType: { type: string, enum: [INDIVIDUAL, NON_INDIVIDUAL] }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [FEMALE, MALE, OTHER] }
        pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$' }
        mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
        email: { type: string, format: email }
        homeBranch: { type: string }
        address:
          type: object
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            stateCode: { type: string }
            pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        overrideDedupe: { type: boolean, description: Proceed despite possible duplicates (requires approval with reason) }
        overrideReason: { type: string }
        externalRef: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$', description: 'The id of the customer in the LOS; repeating it returns the existing customer' }
    CustomerSummary:
      type: object
      required: [id, customerNo, displayName, status]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        id: { type: string, format: uuid }
        customerNo: { type: string }
        displayName: { type: string }
        customerType: { type: string }
        dateOfBirth: { type: string, format: date }
        panMasked: { type: [string, 'null'], examples: ['XXXXX1234X'] }
        mobileMasked: { type: [string, 'null'], examples: ['XXXXXX0001'] }
        homeBranch: { type: string }
        kycStatus: { type: string }
        status: { type: string }
    DedupeMatch:
      type: object
      required: [customerNo, displayName, rule]
      properties:
        customerNo: { type: string }
        displayName: { type: string }
        rule: { type: string, enum: [PAN, MOBILE, NAME_DOB] }
        strength: { type: string, enum: [EXACT, STRONG, POSSIBLE] }
    LimitTxnType:
      type: string
      enum: [LOAN_DISBURSEMENT, LOAN_REPAYMENT, LOAN_WAIVER, VOUCHER, LOAN_PRECLOSURE, FEE_WAIVER, DEPOSIT_CREDIT, DEPOSIT_DEBIT]
    AmountLimitInput:
      type: object
      required: [roleName, txnType, perTransactionMax, effectiveFrom]
      properties:
        roleName: { type: string, description: 'A realm role as it appears in the access token, e.g. MAKER', pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{1,63}$' }
        txnType: { $ref: '#/components/schemas/LimitTxnType' }
        perTransactionMax: { type: [number, string] }
        perDayMax: { type: [number, string, 'null'], description: 'Cumulative per business day; null = no day limit' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    AmountLimit:
      type: object
      required: [id, roleName, txnType, perTransactionMax, effectiveFrom, inForce]
      properties:
        id: { type: string, format: uuid }
        roleName: { type: string }
        txnType: { $ref: '#/components/schemas/LimitTxnType' }
        perTransactionMax: { $ref: '#/components/schemas/Money' }
        perDayMax: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        inForce: { type: boolean, description: In force on the current business date }
    RelationshipInput:
      type: object
      required: [relatedCustomerId, relationType]
      properties:
        relatedCustomerId: { type: string, format: uuid }
        relationType: { type: string, enum: [CO_APPLICANT, GUARANTOR, NOMINEE, AUTHORISED_SIGNATORY] }
        loanId: { type: [string, 'null'], format: uuid, description: 'Nominee only: the account the nomination applies to' }
        sharePercent: { type: [number, string, 'null'], description: 'Nominee only; the shares of a set total 100' }
    CustomerRelationship:
      type: object
      required: [id, direction, relationType, relatedCustomerId, relatedCustomerNo, status]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [OUTGOING, INCOMING] }
        relationType: { type: string, enum: [CO_APPLICANT, GUARANTOR, NOMINEE, AUTHORISED_SIGNATORY] }
        relatedCustomerId: { type: string, format: uuid }
        relatedCustomerNo: { type: string }
        relatedCustomerName: { type: [string, 'null'], description: 'null when the other customer is outside the branch scope of the caller' }
        loanId: { type: [string, 'null'], format: uuid }
        sharePercent: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, ENDED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    CustomerExposure:
      type: object
      required: [customerId, asBorrower, asCoApplicant, asGuarantor]
      properties:
        customerId: { type: string, format: uuid }
        exposureLimit: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        asBorrower: { $ref: '#/components/schemas/Money' }
        asCoApplicant: { $ref: '#/components/schemas/Money' }
        asGuarantor: { $ref: '#/components/schemas/Money' }
        loansAsBorrower: { type: integer }
        loansAsCoApplicant: { type: integer }
        loansAsGuarantor: { type: integer }
        available: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ], description: 'Room left under the limit; null when no limit is set' }
    LoanParty:
      type: object
      required: [customerId, customerNo, role]
      properties:
        customerId: { type: string, format: uuid }
        customerNo: { type: string }
        customerName: { type: string }
        role: { type: string, enum: [BORROWER, CO_APPLICANT, GUARANTOR] }
        customerStatus: { type: string }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
        releasedOn: { type: [string, 'null'], format: date, description: 'Business date from which the party no longer stands behind the loan' }
        releasedBy: { type: [string, 'null'] }
        releaseReason: { type: [string, 'null'] }
    ConsentInput:
      type: object
      required: [purpose, lawfulBasis, noticeVersion, channel]
      properties:
        purpose: { type: string, description: 'A value of the enumeration `consent-purpose`', examples: ['LOAN_PROCESSING', 'CREDIT_BUREAU_REPORTING', 'MARKETING', 'KYC_VERIFICATION', 'ACCOUNT_AGGREGATOR'] }
        lawfulBasis: { type: string, enum: [CONSENT, LEGITIMATE_USE], description: 'DPDP Act 2023: consent (s.6) or a legitimate use (s.7)' }
        noticeVersion: { type: string, description: Version of the privacy notice shown to the customer }
        channel: { type: string, enum: [BRANCH, WEB, MOBILE_APP, API, PAPER, CALL_CENTRE] }
        evidenceRef: { type: string, description: 'Proof that it was given (OTP or e-sign transaction, form scan); required for CONSENT' }
        grantedAt: { type: string, format: date-time, description: 'Defaults to now; never in the future' }
        expiresAt: { type: [string, 'null'], format: date-time }
    Consent:
      type: object
      required: [id, customerId, purpose, lawfulBasis, noticeVersion, channel, grantedAt, status, retainedForLegalObligation]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        purpose: { type: string }
        lawfulBasis: { type: string, enum: [CONSENT, LEGITIMATE_USE] }
        noticeVersion: { type: string }
        channel: { type: string }
        evidenceRef: { type: [string, 'null'] }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRED, WITHDRAWN] }
        withdrawnAt: { type: [string, 'null'], format: date-time }
        withdrawalReason: { type: [string, 'null'] }
        withdrawnBy: { type: [string, 'null'] }
        retainedForLegalObligation: { type: boolean, description: 'Withdrawn, but the data is kept and used as far as law requires while a loan exists' }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    KycDocument:
      type: object
      required: [id, customerId, docType, status, contentType, sizeBytes, sha256, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        docType: { type: string }
        numberMasked: { type: [string, 'null'], examples: ['XXXXXX234F', 'XXXX XXXX 0000'] }
        issueDate: { type: [string, 'null'], format: date }
        expiryDate: { type: [string, 'null'], format: date }
        expired: { type: boolean }
        status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        statusReason: { type: [string, 'null'] }
        verifiedBy: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        maskingConfirmed: { type: boolean }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer }
        sha256: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        customerKycStatus: { type: string, description: 'KYC status of the customer after this change (not in list responses)' }
    GlHead:
      type: object
      required: [code, name, category, posting]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
        parentCode: { type: [string, 'null'] }
        posting: { type: boolean, description: Only posting (leaf) heads accept entries }
        status: { type: string, enum: [ACTIVE, FROZEN, CLOSED] }
    VoucherLine:
      type: object
      required: [branch, glCode, side, amount]
      properties:
        branch: { type: string }
        glCode: { type: string }
        account: { type: string, description: Defaults to glCode }
        side: { type: string, enum: [DR, CR] }
        amount: { $ref: '#/components/schemas/Money' }
        narration: { type: string }
    VoucherInput:
      type: object
      required: [voucherType, valueDate, description, lines]
      properties:
        voucherType: { type: string, enum: [CONTRA, RECEIPT, PAYMENT, JOURNAL] }
        valueDate: { type: string, format: date }
        reference: { type: string }
        description: { type: string }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/VoucherLine' }
    Voucher:
      allOf:
        - $ref: '#/components/schemas/VoucherInput'
        - type: object
          required: [id, voucherNo, status, amount]
          properties:
            id: { type: string, format: uuid }
            voucherNo: { type: string }
            status: { type: string, enum: [POSTED, REVERSED] }
            amount: { $ref: '#/components/schemas/Money' }
            lotId: { type: string, format: uuid }
            reversalLotId: { type: [string, 'null'], format: uuid }
            businessDate: { type: string, format: date }
    TrialBalanceRow:
      type: object
      required: [glCode, glName, category, debit, credit, net]
      properties:
        glCode: { type: string }
        glName: { type: string }
        category: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    LedgerEntry:
      type: object
      properties:
        lotId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        branch: { type: string }
        glCode: { type: string }
        account: { type: string }
        side: { type: string, enum: [DR, CR] }
        amount: { $ref: '#/components/schemas/Money' }
        narration: { type: string }
        lotType: { type: string }
    StatementRow:
      type: object
      required: [section, glCode, glName, amount]
      properties:
        section: { type: string, examples: [INCOME, EXPENSE, ASSET, LIABILITY, EQUITY, NET_PROFIT] }
        glCode: { type: string }
        glName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    EodStep:
      type: object
      properties:
        stepNo: { type: integer }
        name: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, COMPLETED_WITH_EXCEPTIONS, FAILED, SKIPPED] }
        processed: { type: integer }
        failed: { type: integer }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    EodException:
      type: object
      properties:
        step: { type: string }
        accountNo: { type: string }
        error: { type: string }
        resolved: { type: boolean }
    EodRun:
      type: object
      required: [id, businessDate, status]
      properties:
        id: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [RUNNING, COMPLETED, COMPLETED_WITH_EXCEPTIONS, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        nextBusinessDate: { type: [string, 'null'], format: date }
        steps: { type: array, items: { $ref: '#/components/schemas/EodStep' } }
        exceptions: { type: array, items: { $ref: '#/components/schemas/EodException' } }
        warnings:
          type: array
          description: Recorded by the pre-check step; they never fail the run
          items: { $ref: '#/components/schemas/EodWarning' }
    EodWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [PENDING_APPROVALS] }
        message: { type: string }
        count: { type: [integer, 'null'] }
    EodPendingApprovals:
      type: object
      required: [total, byType, blocking]
      properties:
        total: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [entityType, count]
            properties:
              entityType: { type: string }
              count: { type: integer }
        blocking: { type: boolean, description: 'True when eod.block-on-pending-approvals is set and approvals are pending: the start is refused' }
        message: { type: [string, 'null'], examples: ['3 approvals are pending: 2 vouchers, 1 disbursement — they stay pending and will apply on the business date on which they are approved'] }
    EodSchedule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [MANUAL, SCHEDULED] }
        cron: { type: [string, 'null'], examples: ['0 30 23 * * *'] }
        alertEmails: { type: array, items: { type: string, format: email } }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        detail: { type: [object, 'null'] }
    TenantInput:
      type: object
      required: [code, legalName, entityType, deploymentTier, edition]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{2,30}$' }
        legalName: { type: string }
        entityType: { type: string, enum: [NBFC, BANK, SFB, COOP_BANK, HFC, MFI] }
        deploymentTier: { type: string, enum: [POOLED, DEDICATED, STANDALONE] }
        edition: { type: string, enum: [STARTER, GROWTH, ENTERPRISE] }
        starterKit: { type: string, enum: [NBFC, BANK], default: NBFC }
        headOffice:
          type: object
          required: [code, name, stateCode]
          properties:
            code: { type: string }
            name: { type: string }
            stateCode: { type: string }
        firstBusinessDate: { type: string, format: date }
        adminUsers:
          type: array
          description: Keycloak usernames of the first tenant admins; they get all-branch staff profiles
          items: { type: string, pattern: '^[A-Za-z0-9._@-]{2,80}$' }
        kmsKeyArn: { type: string, description: Tenant CMK (Terraform modules/tenant output) }
        dbSecretArn: { type: string, description: Secrets Manager ARN of the tenant DB credentials (never the credentials) }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legalName: { type: string }
        entityType: { type: string }
        deploymentTier: { type: string }
        edition: { type: string }
        status: { type: string }
        depositTaking: { type: boolean, description: An NBFC recorded as registered by RBI to accept public deposits }
        depositRegistrationRef: { type: [string, 'null'] }
        modules: { type: array, items: { type: string } }
    DepositRegistration:
      type: object
      required: [depositTaking]
      properties:
        depositTaking: { type: boolean }
        registrationRef: { type: [string, 'null'], maxLength: 100, description: 'The RBI certificate of registration; required when depositTaking is true' }
    MigrationResult:
      type: object
      properties:
        tenant: { type: string }
        currentVersion: { type: [string, 'null'] }
        pending: { type: array, items: { type: string } }
        status: { type: string, enum: [UP_TO_DATE, PENDING, MIGRATED, FAILED] }
        error: { type: [string, 'null'] }
    LoanStatus:
      type: string
      enum: [SANCTIONED, ACTIVE, FROZEN, CLOSED, CANCELLED, WRITTEN_OFF]
    AssetClass:
      type: string
      enum: [STANDARD, SMA0, SMA1, SMA2, SUBSTANDARD, DOUBTFUL1, DOUBTFUL2, DOUBTFUL3, LOSS]
    AmountBody:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    FeeRule:
      type: object
      required: [code, name, event, calcType]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string }
        event:
          type: string
          enum: [DISBURSEMENT, EVERY_DISBURSEMENT, PRECLOSURE, PART_PREPAYMENT, BOUNCE, LATE_PAYMENT, CANCELLATION, ADHOC]
          description: >-
            DISBURSEMENT: once, on the first disbursement, on the sanctioned amount. EVERY_DISBURSEMENT: on each
            tranche, on that tranche's amount. Only these two may be deducted from the payout.
        calcType: { type: string, enum: [FIXED, PERCENT, SLAB] }
        amount: { type: [number, string, 'null'] }
        percent: { type: [number, string, 'null'] }
        slabs:
          type: array
          items:
            type: object
            properties:
              from: { type: [number, string] }
              to: { type: [number, string] }
              fee: { type: [number, string] }
        minAmount: { type: [number, string, 'null'] }
        maxAmount: { type: [number, string, 'null'] }
        gstRate: { type: [number, string, 'null'], default: 18 }
        taxTreatment: { type: string, enum: [EXCLUSIVE, INCLUSIVE] }
        deductFromDisbursal: { type: boolean }
    RepaymentMethod:
      type: string
      enum: [EQUATED, STEP_EQUATED, FIXED_PRINCIPAL, BULLET_TOTAL_INTEREST, BULLET_PERIODIC_INTEREST, STRUCTURED, TRANCHE_BULLET]
      description: >-
        EQUATED: equal instalments. STEP_EQUATED: instalments that step up or down by stepPercent every stepEvery
        instalments. FIXED_PRINCIPAL: equal principal plus interest on the balance. BULLET_TOTAL_INTEREST: principal
        and all interest at maturity. BULLET_PERIODIC_INTEREST: interest every period, principal at maturity.
        STRUCTURED: principal as assigned to each date on the loan (scheduleRows), with the interest accrued.
        TRANCHE_BULLET: disbursed in tranches, each repaid as a bullet on its own maturity date (the first at the
        loan's tenor, later ones as given at disbursement); interest every period on the total outstanding.
    RepaymentFrequency:
      type: string
      enum: [DAILY, WEEKLY, FORTNIGHTLY, MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
      default: MONTHLY
    LoanProductTemplate:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [RETAIL, BUSINESS, GOLD, MICRO, CONSUMER, HOUSING, AGRI] }
        product: { type: object, additionalProperties: true, description: 'LoanProduct without code, status and version' }
    PrincipalRow:
      type: object
      required: [dueDate, principal]
      properties:
        dueDate: { type: string, format: date }
        principal: { type: [number, string], description: Principal falling due on the date; zero for an interest-only date }
    ProductPreviewRequest:
      type: object
      required: [product]
      properties:
        product: { type: object, additionalProperties: true, description: 'A draft LoanProduct; code, status and version are not needed' }
        amount: { type: [number, string, 'null'], description: 'Default: the product minimum' }
        tenorMonths: { type: [integer, 'null'], description: 'Periods of the product frequency; default: the product minimum' }
        rate: { type: [number, string, 'null'], description: 'Default: the product minimum rate, or benchmark + spread, or the interest table' }
        disbursalDate: { type: [string, 'null'], format: date }
        firstDueDate: { type: [string, 'null'], format: date }
        moratoriumMonths: { type: [integer, 'null'] }
        balloon: { type: [number, string, 'null'] }
        instalment: { type: [number, string, 'null'] }
        maturityAmount: { type: [number, string, 'null'] }
        scheduleRows: { type: [array, 'null'], items: { $ref: '#/components/schemas/PrincipalRow' } }
    LoanTranches:
      type: object
      properties:
        sanctionedAmount: { $ref: '#/components/schemas/Money' }
        disbursedAmount: { $ref: '#/components/schemas/Money' }
        undrawnAmount: { $ref: '#/components/schemas/Money' }
        multipleDisbursements: { type: boolean }
        preEmi: { type: boolean }
        tranches:
          type: array
          items:
            type: object
            properties:
              trancheNo: { type: integer }
              txnId: { type: string, format: uuid }
              businessDate: { type: string, format: date }
              amount: { $ref: '#/components/schemas/Money' }
              feesDeducted: { $ref: '#/components/schemas/Money' }
              interestDeducted: { $ref: '#/components/schemas/Money' }
              netDisbursed: { $ref: '#/components/schemas/Money' }
              maturityDate: { type: [string, 'null'], format: date, description: 'TRANCHE_BULLET: when the tranche is repaid' }
              createdBy: { type: string }
    ChargeBreakup:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        fee: { type: string }
        cgst: { type: string }
        sgst: { type: string }
        igst: { type: string }
        total: { type: string }
    DisbursementSimulation:
      type: object
      properties:
        asOf: { type: string, format: date }
        trancheNo: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        deductedFees: { type: array, items: { $ref: '#/components/schemas/ChargeBreakup' } }
        chargedFees: { type: array, items: { $ref: '#/components/schemas/ChargeBreakup' }, description: Fees charged to the account instead of deducted }
        interestDeducted: { $ref: '#/components/schemas/Money' }
        netDisbursal: { $ref: '#/components/schemas/Money' }
        disbursedAfter: { $ref: '#/components/schemas/Money' }
        undrawnAfter: { $ref: '#/components/schemas/Money' }
        fullyDrawn: { type: boolean }
        preEmi: { type: boolean, description: Interest-only instalments continue after this disbursement }
        instalmentAfter: { $ref: '#/components/schemas/Money' }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
    TransactionSimulationRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [REPAYMENT, PREPAYMENT, PRECLOSURE] }
        amount: { type: [number, string, 'null'], description: 'REPAYMENT and PREPAYMENT' }
        mode: { type: [string, 'null'], enum: [REDUCE_EMI, REDUCE_TENURE, null], description: 'PREPAYMENT; default: the product setting' }
        onDate: { type: [string, 'null'], format: date, description: 'Today (default) or up to 366 days ahead' }
    TransactionSimulation:
      type: object
      description: Fields depend on type.
      properties:
        type: { type: string }
        asOf: { type: string, format: date }
        onDate: { type: string, format: date }
        amount: { type: string }
        duesBefore: { type: string, description: REPAYMENT }
        allocations:
          type: array
          description: 'REPAYMENT: what the receipt is appropriated to, in order'
          items:
            type: object
            properties:
              ref: { type: string, description: 'D<n> = instalment n; otherwise a charge id' }
              component: { type: string, enum: [INTEREST, PRINCIPAL, PENAL, FEE] }
              amount: { type: string }
        principal: { type: string }
        interest: { type: string }
        fees: { type: string }
        penal: { type: string }
        advance: { type: string, description: 'REPAYMENT: excess kept as an advance' }
        duesAfter: { type: string }
        principalOutstandingAfter: { type: string }
        dpdAfter: { type: integer }
        assetClassAfter: { type: string }
        statusAfter: { type: string }
        mode: { type: string, description: PREPAYMENT }
        feeCharged: { type: string, description: PREPAYMENT }
        instalmentBefore: { type: string }
        instalmentAfter: { type: string }
        remainingBefore: { type: integer }
        remainingAfter: { type: integer }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' }, description: 'PREPAYMENT: the schedule after it' }
        overdueDues: { type: string, description: PRECLOSURE }
        accruedInterest: { type: string, description: PRECLOSURE }
        charges: { type: string, description: PRECLOSURE }
        foreclosureFee: { type: string, description: PRECLOSURE }
        advanceAdjusted: { type: string, description: PRECLOSURE }
        total: { type: string, description: 'PRECLOSURE: amount to close the loan on the date' }
    SanctionChangeRequest:
      type: object
      description: Give either newAmount or cancelUndrawn; reason is required when proposing.
      properties:
        newAmount: { type: [number, string, 'null'] }
        cancelUndrawn: { type: [boolean, 'null'], description: Bring the sanctioned amount down to the amount disbursed }
        reason: { type: string }
    SanctionChangePreview:
      type: object
      properties:
        asOf: { type: string, format: date }
        sanctionedBefore: { type: string }
        sanctionedAfter: { type: string }
        disbursed: { type: string }
        undrawnAfter: { type: string }
        topUp: { type: boolean }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
        note: { type: string }
    NpaOverrideRequest:
      type: object
      required: [assetClass, until, reason]
      properties:
        assetClass: { type: string, enum: [SUBSTANDARD, DOUBTFUL1, DOUBTFUL2, DOUBTFUL3, LOSS] }
        until: { type: string, format: date, description: Expiry of the override (inclusive); after the business date }
        reason: { type: string }
    LoanProduct:
      type: object
      required: [code, name, repaymentMethod, minAmount, maxAmount, minTenorMonths, maxTenorMonths, minRate, maxRate]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,12}$' }
        name: { type: string }
        repaymentMethod: { $ref: '#/components/schemas/RepaymentMethod' }
        frequency: { $ref: '#/components/schemas/RepaymentFrequency' }
        interestBasis:
          type: string
          enum: [DAILY_REDUCING, PERIODIC_REDUCING, FLAT]
          default: DAILY_REDUCING
          description: >-
            DAILY_REDUCING: simple interest per annum on the balance for the actual days, by the day count.
            PERIODIC_REDUCING: balance x rate / periods per year for every full period. FLAT (EQUATED only):
            interest = amount x rate x tenor, in equal instalments; the account accrues at the equivalent reducing
            rate, and the KFS shows that rate and the APR.
        bpiMode:
          type: string
          enum: [NONE, ADD_TO_FIRST_INSTALMENT, SEPARATE_DEMAND, DEDUCT_AT_DISBURSAL]
          default: NONE
          description: >-
            Broken-period interest, for the days between disbursal and the start of the first regular period when
            the first due date is later than one period: absorbed by the first instalment's split (NONE), added to
            the first instalment, demanded on its own, or deducted from the payout.
        stepPercent: { type: [number, string, 'null'], description: 'STEP_EQUATED: change of the instalment at each step, e.g. 10 (step-up) or -10 (step-down); above -50, at most 100' }
        stepEvery: { type: [integer, 'null'], minimum: 1, description: 'STEP_EQUATED: instalments between steps' }
        principalEvery: { type: integer, minimum: 1, default: 1, description: 'FIXED_PRINCIPAL: principal falls due every n-th instalment, interest every instalment' }
        multipleDisbursements: { type: boolean, default: false, description: 'The loan may be disbursed in tranches (EQUATED, FIXED_PRINCIPAL and bullet products on DAILY_REDUCING)' }
        preEmi: { type: boolean, default: false, description: 'With multipleDisbursements on an EQUATED product: interest only on the amount drawn until the final tranche, then EMIs for the full tenor. Otherwise EMIs on the amount drawn, recomputed on each tranche.' }
        topUpAllowed: { type: boolean, default: false, description: 'The sanctioned amount of a live account may be raised (same methods as multipleDisbursements)' }
        benchmarkCode: { type: [string, 'null'], description: 'Floating products: rate = benchmark + spread when the application gives no rate. Needs spread, resetFrequencyMonths and rateType FLOATING.' }
        spread: { type: [number, string, 'null'], description: 'Over the benchmark. Leave empty to take it from a SPREAD interest table (floating rate slab) by amount and tenor.' }
        rateSteps:
          type: array
          items:
            type: object
            required: [fromMonth, ratePercent]
            properties:
              fromMonth: { type: integer, minimum: 1 }
              ratePercent: { type: [number, string] }
          description: >-
            Elapsed-tenure rate table: the rate from month fromMonth of the loan, the first step from month 1. Monthly
            EQUATED products on DAILY_REDUCING, rateType FIXED, disbursed at once; every step within the rate band.
            The KFS and schedule show every step; the day-end applies each one (EMI changes, tenure kept).
        resetFrequencyMonths: { type: [integer, 'null'], minimum: 1, maximum: 60, description: 'Floating products: the day-end resets the rate to benchmark + spread every so many months from disbursal' }
        resetOption:
          type: string
          enum: [KEEP_EMI_CHANGE_TENURE, KEEP_TENURE_CHANGE_EMI]
          description: >-
            Floating products: what a reset changes unless the borrower chose otherwise (the lender's board policy, RBI
            18-Aug-2023; absent = KEEP_TENURE_CHANGE_EMI, product owner decision 10-Oct-2026). Keeping the EMI falls back to a higher EMI when the longer tenure would pass maxTenorMonths
            or amortise negatively. Only monthly EMI loans can keep the EMI; on other methods the instalments follow
            the rate.
        minAmount: { type: [number, string] }
        maxAmount: { type: [number, string] }
        minTenorMonths: { type: integer, description: 'Counted in periods of the frequency (months for MONTHLY)' }
        maxTenorMonths: { type: integer, description: 'Counted in periods of the frequency (months for MONTHLY)' }
        minRate: { type: [number, string] }
        maxRate: { type: [number, string] }
        interestTableCode: { type: [string, 'null'], description: 'Rate slabs by amount and tenor. With a benchmark it must be a SPREAD table, whose rows are spreads over the benchmark (floating rate slab).' }
        rateType: { type: string, enum: [FIXED, FLOATING] }
        dayCount: { type: string, enum: [ACTUAL_365, ACTUAL_360, ACTUAL_ACTUAL, THIRTY_360, THIRTY_E_360, ACTUAL_366, ACTUAL_364, ACTUAL_336, ACTUAL_372] }
        rounding: { type: string, enum: [RUPEE_HALF_UP, RUPEE_DOWN, RUPEE_UP, PAISE_HALF_UP, PAISE_HALF_EVEN] }
        penalChargeRate: { type: [number, string, 'null'] }
        maxMoratoriumMonths: { type: integer }
        coolingOffDays: { type: integer }
        secured: { type: boolean }
        appropriationSequence: { type: array, items: { type: string, enum: [INTEREST, PRINCIPAL, PENAL, FEE] } }
        appropriationMode: { type: string, enum: [BY_DEMAND, BY_COMPONENT] }
        prepaymentMode: { type: string, enum: [REDUCE_EMI, REDUCE_TENURE] }
        status: { type: string, enum: [DRAFT, ACTIVE, WITHDRAWN] }
        fees: { type: array, items: { $ref: '#/components/schemas/FeeRule' } }
        version: { type: integer, readOnly: true }
    LoanApplication:
      type: object
      required: [productCode, customerId, amount, tenorMonths]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        productCode: { type: string }
        customerId: { type: string, format: uuid }
        branch: { type: string, description: Defaults to the customer's home branch }
        amount: { type: [number, string] }
        tenorMonths: { type: integer, description: 'Instalment periods of the product frequency (months for a monthly product)' }
        rate: { type: [number, string, 'null'], description: 'Omit to use, in this order, the instalment or maturityAmount given, the product benchmark + spread, or its interest table. For a FLAT product this is the flat rate.' }
        instalment: { type: [number, string, 'null'], description: 'EQUATED: the agreed instalment; the rate follows from it (rate basis "tenure, amount and instalment"). Not together with rate.' }
