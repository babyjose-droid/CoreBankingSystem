openapi: 3.1.0
info:
  title: CoreBanking API
  version: 1.0.0-phase1
  description: |
    Staff and integration API for CoreBanking. Every request is tenant-scoped: the tenant comes from the
    verified access token (`tenant` claim), never from the URL or body.

    Conventions
    - Money is a decimal **string** (e.g. "100000.00"). Never a JSON number.
    - Dates are ISO `YYYY-MM-DD` business dates; timestamps are RFC 3339 UTC.
    - Changes to master data and money go through maker-checker: the call returns **202** with an
      approval request; the change is applied when a different user approves it.
    - Errors use RFC 9457 `application/problem+json`.
    - `Idempotency-Key` header is honoured on all POSTs that create things.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local dev
security:
  - bearer: []
tags:
  - name: Session
  - name: Platform
  - name: Approvals
  - name: Customers
  - name: Ledger
  - name: EOD
  - name: Audit
  - name: Lending
  - name: Deposits
  - name: Documents
  - name: Reporting
  - name: Integrations
  - name: Jobs
  - name: Control plane
paths:
  /api/v1/me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Current user, tenant, business date, permissions and enabled modules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/business-day:
    get:
      tags: [Platform]
      operationId: getBusinessDay
      summary: Get business day
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDay' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/branches:
    get:
      tags: [Platform]
      operationId: listBranches
      summary: List branches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeBranch
      summary: Propose a new branch or a change to an existing one (maker-checker)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branch' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/holidays:
    get:
      tags: [Platform]
      operationId: listHolidays
      summary: List holidays
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Holiday' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeHolidays
      summary: Propose one or more holidays (maker-checker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Holiday' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/tax-rates:
    get:
      tags: [Platform]
      operationId: listTaxRates
      summary: List tax rates
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxRate' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeTaxRate
      summary: Propose tax rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRate' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/amount-limits:
    get:
      tags: [Platform]
      operationId: listAmountLimits
      summary: Role amount limits per transaction type (permission limit:view)
      description: |
        What each role may put through in one transaction and in one business day (US-021). The most permissive of
        a user's roles applies. A role without a limit for a transaction type is not limited, unless the tenant
        property `limits.default-deny` is `true`. Makers above their limit get 403; an approval above the checker's
        limit is refused with 403, so a checker with a higher limit must approve.
      parameters:
        - { name: roleName, in: query, schema: { type: string } }
        - { name: txnType, in: query, schema: { $ref: '#/components/schemas/LimitTxnType' } }
        - { name: currentOnly, in: query, description: Only limits in force on the business date, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Limits, newest period first within a role and transaction type
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AmountLimit' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeAmountLimit
      summary: Propose a role amount limit (maker-checker, permission limit:propose)
      description: The new limit takes over from its effective date; the limit then in force ends the day before.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountLimitInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/enumerations/{type}:
    get:
      tags: [Platform]
      operationId: getEnumeration
      summary: Get enumeration
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnumValue' }
        default: { $ref: '#/components/responses/Problem' }

    post:
      tags: [Platform]
      operationId: proposeEnumeration
      summary: Add or change values of one enumeration type (maker-checker; values are deactivated, never deleted)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,40}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items: { $ref: '#/components/schemas/EnumValueInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/enumerations:
    get:
      tags: [Platform]
      operationId: listEnumerationTypes
      summary: Enumeration types with value counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnumerationType' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/system-properties:
    get:
      tags: [Platform]
      operationId: listSystemProperties
      summary: System properties (master:view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SystemProperty' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/system-properties/{key}:
    put:
      tags: [Platform]
      operationId: proposeSystemProperty
      summary: Propose a system-property value (maker-checker); keys ending in -gl must name an active posting GL head
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_.-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyChange' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/branch-sets:
    get:
      tags: [Platform]
      operationId: listBranchSets
      summary: Branch sets (groups of branches used for reporting and staff scope)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BranchSet' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeBranchSet
      summary: Create or replace a branch set (maker-checker)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchSet' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/staff:
    get:
      tags: [Platform]
      operationId: listStaff
      summary: Staff profiles with home branch and branch scope (staff:view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeStaff
      summary: Create or replace a staff profile and its branch scope (maker-checker). A maker can grant only branches they see.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Staff' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/holidays/upload:
    post:
      tags: [Platform]
      operationId: uploadHolidays
      summary: 'Holiday file (CSV columns: day, reason, optional branchCode; up to 366 rows) as one approval'
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 5000000 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '413': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/states:
    get:
      tags: [Platform]
      operationId: listStates
      summary: States and union territories with GST state codes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/State' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/pincodes/{pincode}:
    get:
      tags: [Platform]
      operationId: lookupPincode
      summary: Cities, district and state served by a pincode
      parameters:
        - { name: pincode, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PincodePlace' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/territory/upload:
    post:
      tags: [Platform]
      operationId: uploadTerritory
      summary: 'Territory file (CSV columns: state, district, city, pincode; up to 20,000 rows) as one approval; loaded all or nothing'
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 5000000 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '413': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approvals
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
        - { name: entityType, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/{id}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get approval
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Approval with current vs proposed state for the checker's diff view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      operationId: approve
      summary: Approve
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Approved and applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/{id}/reject:
    post:
      tags: [Approvals]
      operationId: reject
      summary: Reject
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/bulk-approve:
    post:
      tags: [Approvals]
      operationId: bulkApprove
      summary: Bulk approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
                note: { type: string }
      responses:
        '200':
          description: Per-item result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    ok: { type: boolean }
                    error: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: searchCustomers
      summary: Search customers
      parameters:
        - { name: q, in: query, description: 'Customer number, exact PAN or exact mobile', schema: { type: string } }
        - { name: externalRef, in: query, description: 'The id of the customer in the LOS (create-or-get): returns that customer or an empty list', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Masked customer summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerSummary' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer (maker-checker). Returns the existing customer when PAN already exists (idempotent create).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Customer with this PAN already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSummary' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/dedupe-check:
    post:
      tags: [Customers]
      operationId: dedupeCheck
      summary: Dedupe check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Possible duplicates with the matching rule
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DedupeMatch' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get customer
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Masked customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSummary' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/customers/{id}/relationships:
    get:
      tags: [Customers]
      operationId: listCustomerRelationships
      summary: Relationships of a customer (permission customer:view)
      description: |
        Co-applicants, guarantors, nominees and authorised signatories the customer has (`OUTGOING`) and the customers
        they are related to in turn (`INCOMING`). The other party's name is shown only inside the caller's branch scope.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerRelationship' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Customers]
      operationId: proposeCustomerRelationships
      summary: Propose relationships (maker-checker, permission customer:create)
      description: |
        The related party must be an ACTIVE customer. Nominees are sent as the complete set for an account (`loanId`)
        or for the customer: their shares must total 100, and on approval the set replaces the current nominees.
        An authorised signatory is an individual acting for a non-individual customer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relationships]
              properties:
                relationships:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: '#/components/schemas/RelationshipInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/exposure:
    get:
      tags: [Customers]
      operationId: getCustomerExposure
      summary: Exposure as borrower, co-applicant and guarantor, with the limit (permission customer:view)
      description: |
        A loan counts at its sanctioned amount until it is disbursed and at its principal outstanding afterwards.
        The exposure limit applies to the borrower's own loans only; exposure as guarantor or co-applicant is shown
        for information, and a borrower's NPA does not downgrade a guarantor's own accounts.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerExposure' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/exposure-limit:
    post:
      tags: [Customers]
      operationId: proposeCustomerExposureLimit
      summary: Set, change or remove the exposure limit (maker-checker, permission limit:propose)
      description: |
        The limit is checked by the database when a loan is booked and again when it is disbursed (409 when it would
        be exceeded). Loans already booked are not affected.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                exposureLimit: { type: [number, string, 'null'], description: 'null removes the limit' }
                reason: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/consents:
    get:
      tags: [Customers]
      operationId: listCustomerConsents
      summary: Consent and purpose records (DPDP Act 2023; permission consent:view)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Every record, newest first; withdrawn and expired records stay in the list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Customers]
      operationId: recordCustomerConsent
      summary: Record a consent or a legitimate-use record (permission consent:record)
      description: One record can be in force per customer and purpose; 409 when one already is.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/consents/{consentId}/withdraw:
    post:
      tags: [Customers]
      operationId: withdrawCustomerConsent
      summary: Record the withdrawal of a consent (permission consent:record)
      description: |
        Takes effect at once; the grant is kept. When the purpose is needed to service a loan the customer is party
        to, the withdrawal is recorded with `retainedForLegalObligation: true`: the consent is gone, the data is kept
        and used only as far as law requires. A legitimate-use record cannot be withdrawn (409).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The record after withdrawal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/kyc-documents:
    get:
      tags: [Customers]
      operationId: listKycDocuments
      summary: KYC document metadata (permission customer:view)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Newest first. Document numbers are masked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Customers]
      operationId: uploadKycDocument
      summary: Upload a KYC document (permission kyc:upload)
      description: |
        The file is the request body (no multipart): PDF, JPEG or PNG up to 5 MB, and its leading bytes must match
        the `Content-Type`. The document number travels in the `X-Document-Number` header and is never stored: only
        its last four characters and a keyed hash are kept. For `AADHAAR_MASKED` send only the last four digits; a
        full Aadhaar number is refused (422) for every document type.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: docType
          in: query
          required: true
          description: A value of the enumeration `kyc-document-type`; `address-proof` and `ADDRESS_PROOF` are the same
          schema: { type: string, examples: ['PAN', 'AADHAAR_MASKED', 'ADDRESS_PROOF', 'PHOTO'] }
        - { name: issueDate, in: query, schema: { type: string, format: date } }
        - { name: expiryDate, in: query, schema: { type: string, format: date } }
        - name: X-Document-Number
          in: header
          description: The document number as printed; for Aadhaar only its last four digits
          schema: { type: string, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary, maxLength: 5242880 }
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 5242880 }
          image/png:
            schema: { type: string, format: binary, maxLength: 5242880 }
      responses:
        '201':
          description: Stored as PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/kyc-documents/{docId}/content:
    get:
      tags: [Customers]
      operationId: downloadKycDocument
      summary: Download a KYC document (permission kyc:view-document; every download is audited)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/DocId' }
      responses:
        '200':
          description: 'The file, as an attachment and never cached (Cache-Control no-store)'
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="kyc-pan-0b0e.pdf"'] }
            Cache-Control:
              schema: { type: string, examples: ['no-store'] }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/kyc-documents/{docId}/verify:
    post:
      tags: [Customers]
      operationId: verifyKycDocument
      summary: Verify a KYC document (permission kyc:verify; not by the uploader)
      description: |
        The customer's `kycStatus` becomes VERIFIED when every required document (tenant property
        `kyc.required-documents`, default `pan,address-proof,photo`) is verified and unexpired. For Aadhaar the
        verifier must confirm that the copy shows only the last four digits (`maskingConfirmed`).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/DocId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maskingConfirmed: { type: boolean, description: Required and true for AADHAAR_MASKED }
                note: { type: string }
      responses:
        '200':
          description: The document after verification, with the customer's KYC status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/customers/{id}/kyc-documents/{docId}/reject:
    post:
      tags: [Customers]
      operationId: rejectKycDocument
      summary: Reject a KYC document with a reason (permission kyc:verify; not by the uploader)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/DocId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The document after rejection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/gl/heads:
