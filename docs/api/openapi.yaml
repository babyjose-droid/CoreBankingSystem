              schema:
                type: object
                required: [intact]
                properties:
                  intact: { type: boolean }
                  firstBrokenId: { type: [integer, 'null'], format: int64 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/loan-products:
    get:
      tags: [Lending]
      operationId: listLoanProducts
      summary: Loan products with fee rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanProduct' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeLoanProduct
      summary: Create or change a product (maker-checker; approval bumps the version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanProduct' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-products/{code}:
    get:
      tags: [Lending]
      operationId: getLoanProduct
      summary: One loan product
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanProduct' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/interest-tables:
    get:
      tags: [Lending]
      operationId: listInterestTables
      summary: Interest-rate slab tables with their rows and the products that use them
      description: Permission product:view.
      responses:
        '200':
          description: Ordered by code; rows by amount band, then tenor band
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InterestTable' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeInterestTable
      summary: Propose a new interest table, or the replacement of an existing one's rows (maker-checker)
      description: >-
        Permission product:propose. The whole table is proposed: an existing code is replaced on approval. 422 when bands
        overlap (amount and tenor bands include both ends), a rate is out of range (0 to 60 percent; spreads 0 to 30), a
        band is malformed, or a table in use by a product would change to or from SPREAD. Approving a product that
        attaches a SPREAD table to a product without a benchmark (or a benchmark product to a non-SPREAD table) is also
        422. Loans already booked keep their rate; a replaced SPREAD table applies from the loan's next reset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterestTableInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/benchmarks:
    get:
      tags: [Lending]
      operationId: listBenchmarks
      summary: Benchmarks of floating-rate products, each with its rate history and the rate in force on the business date
      description: Permission benchmark:view.
      responses:
        '200':
          description: Ordered by code; rates newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Benchmark' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeBenchmark
      summary: Propose a new benchmark (maker-checker)
      description: Permission benchmark:propose. 409 when the code exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BenchmarkInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/benchmarks/{code}/rates:
    post:
      tags: [Lending]
      operationId: proposeBenchmarkRate
      summary: Propose a rate of the benchmark from an effective date (maker-checker)
      description: >-
        Permission benchmark:propose. The history is append-only: the effective date must be later than every rate on
        record (409 otherwise), and a wrong rate is corrected by a later one. An approved rate is used for new bookings
        from its effective date. A running loan follows it at its next reset date: the day-end sets the rate to the
        benchmark rate in force on that date plus the loan's spread (history kind RATE_RESET).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BenchmarkRateInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/rate-resets/upcoming:
    get:
      tags: [Lending]
      operationId: listRateResetsUpcoming
      summary: Floating-rate loans whose next reset falls within the next n days, with the estimated new EMI
      description: >-
        Permission loan:view; the caller's branches. The projected rate is the benchmark rate recorded for the reset
        date (the latest one on record if none is recorded yet) plus the loan's spread; the day-end applies it on the
        reset date even outside the product band (D-14), which projectedOutsideBand shows. estimatedEmi and
        estimatedInstalmentsLeft apply that rate to the loan as it is today with the option the reset would use. A
        frozen account's reset is held (held = true, the reset date may be past) until it is unfrozen. Also as
        report RATE_RESETS_DUE (without the estimate).
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 0, maximum: 366, default: 30 } }
      responses:
        '200':
          description: By reset date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RateResetDue' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/rate-resets:
    get:
      tags: [Lending]
      operationId: listRateResetsApplied
      summary: Rate resets and elapsed-tenure steps applied at day-end in a period
      description: >-
        Permission loan:view; the caller's branches. A reset undone by a reversal is left out (the replayed day-end
        records it again). Also as report RATE_RESETS_APPLIED.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default: first day of the business month' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default: the business date' }
        - { name: outsideBandOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: By effective date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RateResetApplied' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/rate-reset-preference:
    post:
      tags: [Lending]
      operationId: proposeRateResetPreference
      summary: Propose the borrower's choice of what a floating-rate reset changes (RBI 18-Aug-2023; maker-checker)
      description: >-
        Permission loan:amend. Maker-checker (entity LOAN_RESET_PREFERENCE); audited when applied
        (RATE_RESET_PREFERENCE). It changes no figure until the next reset. option null returns the loan to the
        product's default. At the reset a longer tenure is still refused beyond the product's maximum tenure, for negative
        amortisation and for a borrower in arrears; the EMI is then raised instead and the history says why. A
        combination of EMI and tenure, or a switch to a fixed rate, is an amendment (RATE_CHANGE with CHANGE_BOTH,
        SWITCH_TO_FIXED). 409 when the loan is not on a floating rate.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                option: { type: [string, 'null'], enum: [KEEP_EMI_CHANGE_TENURE, KEEP_TENURE_CHANGE_EMI, null] }
                reason: { type: string, description: How the borrower gave the instruction }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-product-templates:
    get:
      tags: [Lending]
      operationId: listLoanProductTemplates
      summary: Product templates - starting points for the product wizard (US-038)
      description: >-
        Seeded examples (personal EMI, business EMI and step-up, gold bullet, weekly micro-loan, flat-rate consumer
        loan, floating home loan in tranches, seasonal structured loan). `product` has the shape of LoanProduct
        without code, status and version; the figures are illustrative and nothing here is a live product.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanProductTemplate' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-products/preview:
    post:
      tags: [Lending]
      operationId: previewLoanProduct
      summary: Simulate an account on a draft product - schedule, fees, net disbursal, APR (US-044; nothing is stored)
      description: >-
        The product need not be saved or approved, and needs no code. The sample loan defaults to the product's
        smallest amount, shortest tenor and lowest rate. GST is shown as an intra-state supply. For a STRUCTURED
        product without `scheduleRows`, equal principal on each period date is shown as an example
        (`sampleSchedule: true`). The engine is the one that books loans, so a product the engine would refuse is
        refused here (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPreviewRequest' }
      responses:
        '200':
          description: KFS figures of the sample loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanKfs' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/preview:
    post:
      tags: [Lending]
      operationId: previewLoan
      summary: Schedule, fees, net disbursal and APR from the same engine that posts (KFS figures)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanApplication' }
      responses:
        '200':
          description: KFS figures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanKfs' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements:
    get:
      tags: [Lending]
      operationId: listCoLendingArrangements
      summary: Co-lending arrangements in which this lender originates (RBI Co-Lending Arrangements Directions, 2025)
      description: 'Permission: loan:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CoLendingArrangement' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeCoLendingArrangement
      summary: Propose a new arrangement or a change to one (maker-checker); a change applies to loans sanctioned after it
      description: |
        Permission: product:propose. Each lender keeps at least 10% of every loan, the default loss guarantee is at
        most 5%, the servicing fee is below the partner's rate. Products disbursed in tranches or at a floating rate
        are not co-lent yet. The partner of an arrangement never changes.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingArrangementInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}:
    get:
      tags: [Lending]
      operationId: getCoLendingArrangement
      summary: An arrangement with its loans by status and the partner's principal booked
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoLendingArrangement' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/status:
    post:
      tags: [Lending]
      operationId: proposeCoLendingArrangementStatus
      summary: Suspend, reactivate or close an arrangement (maker-checker); it closes only with no loan sanctioned or offered
      description: 'Permission: product:propose.'
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingStatusInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/offers:
    get:
      tags: [Lending]
      operationId: listCoLendingOffers
      summary: Loans disbursed under the arrangement and awaiting the partner (open 15 calendar days from disbursement)
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CoLendingOffer' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/offers.csv:
    get:
      tags: [Lending]
      operationId: downloadCoLendingOffers
      summary: The open offers as the file sent to the partner (no personal data beyond the customer number)
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: 'The file, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/decisions:
    post:
      tags: [Lending]
      operationId: proposeCoLendingDecisions
      summary: Record the partner's decisions on offered loans (maker-checker)
      description: |
        Permission: loan:disburse. On approval, each acceptance made by the 15th day books the partner's share of the
        principal then outstanding (Dr escrow, Cr partner's share); an offer past its 15th day, or no longer offered,
        is skipped and stays with the originator.
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingDecisionsInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/simulate-partner:
    post:
      tags: [Lending]
      operationId: simulateCoLendingPartner
      summary: 'Simulator: the partner accepts every open offer (proposed as decisions, maker-checker)'
      description: 'Permission: loan:disburse. For testing without a partner.'
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/unsettled:
    get:
      tags: [Lending]
      operationId: getCoLendingUnsettled
      summary: What is due to the partner and not yet settled, by loan, from the daily splits so far
      description: |
        Permission: loan:view. Each day-end splits what the borrower paid on a loan whose share the partner holds:
        principal repaid by share, interest received in the ratio share x rate, fees (without GST) and penal charges
        received as the arrangement shares them, less the servicing fee accrued daily on the partner's principal. A
        receipt reversed is taken back by the next split (a negative line).
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoLendingUnsettled' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/settlements:
    get:
      tags: [Lending]
      operationId: listCoLendingSettlements
      summary: Settlements with the partner, newest first
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CoLendingSettlement' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeCoLendingSettlement
      summary: Pay the partner what is due, through the escrow account (maker-checker)
      description: |
        Permission: loan:disburse. Settles every split not yet settled (409 when nothing is due, or a settlement of the
        arrangement already waits for a checker). On approval: Dr due to the partner on each loan / Cr escrow, and a
        statement for the partner.
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/settlements/{id}:
    get:
      tags: [Lending]
      operationId: getCoLendingSettlement
      summary: A settlement with what it paid for each loan
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoLendingSettlement' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/settlements/{id}/statement.csv:
    get:
      tags: [Lending]
      operationId: downloadCoLendingStatement
      summary: The settlement statement for the partner (one line per loan and the total)
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: 'The file, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/classification.csv:
    get:
      tags: [Lending]
      operationId: downloadCoLendingClassification
      summary: This lender's classification of the loans whose share the partner holds, for the partner (Directions para 33)
      description: 'Permission: loan:view. One line per live loan: days past due, asset class, NPA date, principal and the partner''s principal. No personal data.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: 'The file, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/partner-classification:
    post:
      tags: [Lending]
      operationId: proposeCoLendingPartnerClassification
      summary: Record the partner's classification of borrowers whose loans it shares (maker-checker)
      description: |
        Permission: loan:classify. Classification is at borrower level across both lenders (para 33). On approval, an NPA
        at the partner holds the loan at that class here by an asset-class override for a year (so the day-end does not
        classify it back from its own days past due); the borrower's other loans follow at day-end. An SMA or standard
        report is recorded.
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingPartnerClassInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/dlg:
    get:
      tags: [Lending]
      operationId: getCoLendingDlg
      summary: 'The default loss guarantee of an arrangement (cap, covers, invocations and the loans in default)'
      description: 'Permission: loan:view.'
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoLendingDlg' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/dlg/covers:
    post:
      tags: [Lending]
      operationId: proposeCoLendingDlgCover
      summary: Lodge a default loss guarantee cover with the partner (maker-checker)
      description: |
        Permission: loan:disburse. Cash, a fixed deposit with a scheduled commercial bank under lien, or a bank guarantee
        (Digital Lending Directions). All covers together are at most the arrangement's percentage (5% at most) of the
        partner's share funded; a cover lasts at least as long as the longest loan it covers. Cash: Dr DLG deposits / Cr
        bank; the other forms are not on the books until invoked.
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingDlgCoverInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/dlg/covers/{id}/release:
    post:
      tags: [Lending]
      operationId: releaseCoLendingDlgCover
      summary: Release a cover (maker-checker); cash not invoked comes back to the bank
      description: 'Permission: loan:disburse.'
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/arrangements/{code}/dlg/invocations:
    post:
      tags: [Lending]
      operationId: proposeCoLendingDlgInvocation
      summary: Record the partner's invocation of the guarantee for a loan in default (maker-checker)
      description: |
        Permission: loan:disburse. The partner invokes within 120 days overdue (a later invocation is recorded and flagged).
        At most what the cover has left and the partner's principal outstanding on the loan. Dr DLG paid / Cr DLG
        deposits (cash) or bank (a guarantee paid, a fixed deposit realised). Not set off against the loan.
      parameters: [ { $ref: '#/components/parameters/Code' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingDlgInvocationInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/co-lending/dlg/invocations/{id}/recoveries:
    post:
      tags: [Lending]
      operationId: proposeCoLendingDlgRecovery
      summary: Record a recovery the partner shares back on a loan whose guarantee was invoked (maker-checker)
      description: 'Permission: loan:disburse. At most what was invoked and not yet recovered. Dr bank / Cr recoveries under DLG.'
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoLendingDlgRecoveryInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans:
    get:
      tags: [Lending]
      operationId: searchLoans
      summary: Search loans by number, customer, name or LOS reference
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LoanStatus' } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanSummary' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: createLoan
      summary: Book a loan as SANCTIONED (idempotent on externalRef); money moves at disbursement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanApplication' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}:
    get:
      tags: [Lending]
      operationId: getLoan
      summary: Loan with balances, DPD and asset class
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/schedule:
    get:
      tags: [Lending]
      operationId: getLoanSchedule
      summary: Demands raised, charges and the future schedule
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanSchedule' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/transactions:
    get:
      tags: [Lending]
      operationId: getLoanTransactions
      summary: Financial transactions (newest first); day-end entries only on request
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: dayEnd, in: query, description: 'Also list the day-end entries (type EOD: interest accrual, demands raised, penal charges)', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanTxn' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/parties:
    get:
      tags: [Lending]
      operationId: listLoanParties
      summary: Borrower, co-applicants and guarantors of the loan
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The borrower first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanParty' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/kfs:
    get:
      tags: [Lending]
      operationId: getLoanKfs
      summary: Key Fact Statement as generated at booking
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanKfs' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/kfs-acceptance:
    post:
      tags: [Lending]
      operationId: acceptLoanKfs
      summary: Record the borrower's KFS acceptance (required before disbursement)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, examples: [OTP, ESIGN, BRANCH] }
                evidenceRef: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/disbursement:
    post:
      tags: [Lending]
      operationId: disburseLoan
      summary: Staff users get a 202 approval; LOS clients with loan:stp are disbursed immediately (200)
      description: >-
        `amount` is what to disburse now; omitted, it is everything not yet drawn. A part of the sanctioned amount
        can be drawn only on a product with `multipleDisbursements`; further tranches use this same endpoint while
        the loan is ACTIVE with an undrawn amount. Interest accrues only on what is drawn. DISBURSEMENT fees are
        charged once, on the first tranche, on the sanctioned amount; EVERY_DISBURSEMENT fees on each tranche's
        amount; broken-period interest in mode DEDUCT_AT_DISBURSAL is taken from the first tranche. The schedule is
        rebuilt on each tranche: with `preEmi` the instalments are interest-only until the loan is fully drawn (or
        the undrawn amount is cancelled) and the EMIs then run for the full tenor; otherwise the instalments are
        recomputed on the amount drawn over the instalments left. No tranche is paid while the account has unpaid
        dues or is NPA (409). A tranche cannot be reversed. On a TRANCHE_BULLET loan each later tranche needs its own
        `maturityDate`, within the product's tenor limits counted from today; the first tranche matures at the loan's
        tenor.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: [number, string], description: 'Amount of this disbursement; default: all that is undrawn' }
                maturityDate: { type: [string, 'null'], format: date, description: 'TRANCHE_BULLET, a later tranche only (required there): the date its principal falls due as a bullet' }
                beneficiaryName: { type: string }
                beneficiaryAccount: { type: string }
                ifsc: { type: string }
                mode: { type: string, examples: [IMPS, NEFT, CASH] }
      responses:
        '200':
          description: Disbursed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/tranches:
    get:
      tags: [Lending]
      operationId: listLoanTranches
      summary: Disbursements made so far and the amount still undrawn (US-050)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanTranches' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/simulations/disbursement:
    post:
      tags: [Lending]
      operationId: simulateLoanDisbursement
      summary: What a disbursement would do today - fees, interest deducted, net payout, schedule (nothing changes)
      description: >-
        For a SANCTIONED loan the first disbursement, for an ACTIVE loan the next tranche. Computed by the code that
        posts the disbursement; nothing is posted or stored. The same refusals apply (409 / 422).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: [number, string, 'null'], description: 'Default: all that is undrawn' }
                maturityDate: { type: [string, 'null'], format: date, description: 'TRANCHE_BULLET, a later tranche only (required there)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisbursementSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/simulations/transaction:
    post:
      tags: [Lending]
      operationId: simulateLoanTransaction
      summary: What a receipt, part-prepayment or pre-closure would do on a date (nothing changes)
      description: >-
        `onDate` is today or up to 366 days ahead: the day-ends until then (demands, accrual, penal charges,
        classification) are run on a copy first. The figures come from the engine code that posts the transaction;
        nothing is posted or stored. Restructure options are simulated by `/restructure/simulation`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionSimulationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/sanction-change/preview:
    post:
      tags: [Lending]
      operationId: previewLoanSanctionChange
      summary: Before/after of a change of the sanctioned amount (nothing changes)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionChangePreview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/sanction-change:
    post:
      tags: [Lending]
      operationId: proposeLoanSanctionChange
      summary: Propose a top-up, a reduction or the cancellation of the undrawn amount (maker-checker, entity LOAN_SANCTION_CHANGE)
      description: >-
        **Reduction** may only take away undrawn amount (never below what is disbursed); `cancelUndrawn` brings the
        sanctioned amount down to the amount disbursed, which starts the EMIs of a pre-EMI loan. **Top-up** in the
        same account needs a product with `topUpAllowed`, an amount within the product maximum and the customer's
        exposure limit, and a STANDARD account with no unpaid dues that is not under post-restructuring monitoring
        (409 otherwise: new money to a borrower in arrears would be evergreening). No money moves on approval: the
        extra amount is then paid out through `/disbursement`. One checker. Recorded in the amendment history
        (kind SANCTION_CHANGE); it cannot be reversed. Needs `loan:amend`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionChangeRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/npa-override:
    post:
      tags: [Lending]
      operationId: proposeLoanNpaOverride
      summary: Manual NPA mark - downgrade the account to an NPA class or hold it there (maker-checker, two checkers)
      description: >-
        Entity LOAN_NPA_OVERRIDE, action OVERRIDE. The override sets the worst class the account may be upgraded to
        until `until`: it can downgrade the account or hold it at its present NPA class, never upgrade it (409).
        A downgrade from a performing class moves unrealised interest to suspense. While it holds, day-end
        classification can make the class worse but not better; after it expires the normal rules apply. LOSS is
        permanent. Recorded in the amendment history (kind NPA_OVERRIDE); it cannot be reversed. Needs `loan:classify`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NpaOverrideRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/parties/{partyId}/release:
    post:
      tags: [Lending]
      operationId: proposeLoanPartyRelease
      summary: Release a co-applicant or guarantor from the loan (maker-checker)
      description: >-
        Entity LOAN_PARTY_RELEASE. `partyId` is the party's customerId. One checker (action RELEASE); two when the loan is
        in an SMA or NPA class (action RELEASE_STRESSED). The release takes effect on the business date of the
        approval: the party then drops out of the customer's exposure as co-applicant or guarantor and of joint
        reporting, and the row is kept with `releasedOn`, `releasedBy` and `releaseReason`. 422 for the borrower; 409
        when the party is already released, a release is already pending, or the loan is closed or written off.
        Needs `loan:amend`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/npa-override/release:
    post:
      tags: [Lending]
      operationId: proposeLoanNpaRelease
      summary: Un-mark - end a manual NPA override before its expiry (maker-checker, two checkers)
      description: >-
        Entity LOAN_NPA_OVERRIDE, action RELEASE. Refused (409) while the account has unpaid dues, when proposed
        and again when approved: an NPA is upgraded only when all arrears are cleared (RBI IRACP norms). Nothing is
        posted; the next day-end classifies the account by the normal rules. A LOSS classification cannot be
        released. Needs `loan:classify`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/repayments:
    post:
      tags: [Lending]
      operationId: repayLoan
      summary: Receipt appropriated per product sequence; any excess is kept as an advance
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                valueDate: { type: string, format: date }
                mode: { type: string, examples: [CASH, NACH, UPI, NEFT] }
                reference: { type: string }
      responses:
        '202':
          description: >-
            End of day has started (cut-off). The repayment of a straight-through client (`loan:stp`) is accepted and will
            be booked and valued on the next business date. Send it without `valueDate`. A staff posting gets 409 instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceiptAccepted' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/prepayments:
    post:
      tags: [Lending]
      operationId: prepayLoan
      summary: Part-prepayment; the schedule is rebuilt (reduce EMI or reduce tenure)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                mode: { type: string, enum: [REDUCE_EMI, REDUCE_TENURE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/preclosure-quote:
    get:
      tags: [Lending]
      operationId: getPreclosureQuote
      summary: Pre-closure amount today (the posting uses the same figures)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreclosureQuote' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/preclosure:
    post:
      tags: [Lending]
      operationId: precloseLoan
      summary: Close the loan; amount must equal the quote total
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/cancellation-quote:
    get:
      tags: [Lending]
      operationId: getCancellationQuote
      summary: Amount to exit within the cooling-off period
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { $ref: '#/components/schemas/Money' }
                  asOf: { type: string, format: date }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/cancellation:
    post:
      tags: [Lending]
      operationId: cancelLoan
      summary: Cooling-off exit (principal + interest for days used; disclosed fees retained)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges:
    post:
      tags: [Lending]
      operationId: chargeLoanFee
      summary: Charge a product fee (with GST) to the loan
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeCode]
              properties:
                feeCode: { type: string }
                base: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges/{chargeId}/waiver:
    post:
      tags: [Lending]
      operationId: waiveLoanCharge
      summary: Propose a waiver of an unpaid charge (maker-checker)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: chargeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                reason: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/transactions/{txnId}/reverse:
    post:
      tags: [Lending]
      operationId: reverseLoanTransaction
      summary: Propose reversal of a transaction and every later one; days since are replayed (maker-checker)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/amendments/preview:
    post:
      tags: [Lending]
      operationId: previewLoanAmendment
      summary: Before/after figures and the new schedule for a rate, tenure, EMI, due-day or maturity-date change (nothing changes)
      description: >-
        Same engine as the posting. Rate resets follow RBI's 18-Aug-2023 circular on floating-rate EMI loans: the
        borrower keeps the EMI and changes the tenure, keeps the tenure and changes the EMI, or changes both. A
        tenure extension may not pass the product's maximum tenure and the EMI must cover the monthly interest.
        Extending the tenure or lowering the EMI of a borrower in arrears is refused (409): that is a restructure.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmendmentPreview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/amendments:
    get:
      tags: [Lending]
      operationId: listLoanAmendments
      summary: Amendment and restructure history (newest first)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanAmendment' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeLoanAmendment
      summary: Propose an amendment (maker-checker, entity LOAN_AMENDMENT); applied on approval
      description: >-
        The approval re-runs the engine on the loan as it is then. If the figures differ from those proposed (the
        loan changed in between), the current figures are applied and both are kept in the history. Amendments move
        no money and can be reversed like any other loan transaction.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/restructure/simulation:
    post:
      tags: [Lending]
      operationId: simulateLoanRestructure
      summary: Compare up to three restructuring options (schedule, EMI, tenure, interest, NPV at the contract rate)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              properties:
                options:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { $ref: '#/components/schemas/RestructureTerms' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestructureSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/restructure:
    post:
      tags: [Lending]
      operationId: proposeLoanRestructure
      summary: Propose a restructure (maker-checker with two checkers, entity LOAN_RESTRUCTURE)
      description: >-
        RBI Prudential Framework for Resolution of Stressed Assets (7-Jun-2019): a standard account is downgraded
        to sub-standard; an NPA keeps its class. The account can be upgraded only after the specified period (at
        least one year from the first payment under the new schedule and 10% of the principal repaid) with no
        default in that period and no arrears. A restructure cannot be reversed.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestructureTerms' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/freeze:
    post:
      tags: [Lending]
      operationId: freezeLoan
      summary: Block transactions (accrual continues)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/unfreeze:
    post:
      tags: [Lending]
      operationId: unfreezeLoan
      summary: Allow transactions again
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/kfs.pdf:
    get:
      tags: [Documents]
      operationId: getLoanKfsPdf
      summary: Key Facts Statement as PDF
      description: |
        The KFS stored at booking, laid out as in RBI's circular "Key Facts Statement (KFS) for Loans & Advances"
        (15-Apr-2024): Part 1 (interest rate and fees/charges), Part 2 (other qualitative information), the
        illustration of the APR computation and the repayment schedule. The APR is the one computed by the product
        at booking. Grievance officer and clause references come from the system properties `lender.*`; one that
        is not set prints as "[not configured]".
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/statement.pdf:
    get:
      tags: [Documents]
      operationId: getLoanStatementPdf
      summary: Statement of account as PDF
      description: |
        Opening and closing balance, every transaction with its principal / interest / charges split and the
        running outstanding, and the overdue summary with days past due. Built from the ledger entries on the
        loan account; day-end interest accruals between two transactions are shown as one line per month.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default: the disbursement date' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default: the business date; cannot be later' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: The loan has not been disbursed yet
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/schedule.pdf:
    get:
      tags: [Documents]
      operationId: getLoanSchedulePdf
      summary: Repayment schedule as PDF
      description: |
        Instalments fallen due with what was paid against each, and the instalments to come.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/noc.pdf:
    get:
      tags: [Documents]
      operationId: getLoanNocPdf
      summary: No-objection (closure) letter as PDF
      description: |
        Issued only for a loan whose status is CLOSED.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: The loan is not closed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges/{chargeId}/invoice.pdf:
    get:
      tags: [Documents]
      operationId: getFeeInvoicePdf
      summary: GST tax invoice for a fee as PDF
      description: |
        Supplier and recipient state, SAC 9971, taxable value, CGST + SGST (intra-state) or IGST (inter-state), and
        the invoice number from the GST_INVOICE number series. The invoice of a reversed fee is returned marked
        CANCELLED.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: chargeId
          in: path
          required: true
          schema: { type: string, pattern: '^[CD][0-9]{1,6}$' }
          description: The charge id shown on the loan (C1, C2 …), or D1, D2 … for the fees deducted from the disbursement
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: 'A penal charge (P…): penal charges carry no GST, so there is no invoice'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports:
    get:
      tags: [Reporting]
      operationId: listReports
      summary: Report catalogue
      description: |
        The reports the caller may run: those whose permission they hold (`report:run`; `bureau:export` for the
        credit bureau file).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportDefinition' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/{code}/runs:
    post:
      tags: [Reporting]
      operationId: runReport
      summary: Run a report now and store its file
      description: |
        Runs synchronously (for now), writes the rows as CSV (cells that start with `=`, `+`, `-` or `@` are
        neutralised) and stores the file; fetch it with the download call. The rows are limited to the caller's
        branch scope. A run that fails is returned with status `FAILED` and its error.

        `BUREAU_CONSUMER` produces the UCRF-style consumer bureau file instead of CSV. It needs `bureau:export`
        and all-branch access, and is the only report that contains unmasked personal data. Its layout has **not**
        been certified by any bureau: validate it against each bureau's format specification before submitting.

        Every run is written to the audit log (`REPORT_RUN`, or `BUREAU_EXPORT`).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,40}$' } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRunRequest' }
      responses:
        '201':
          description: The run (COMPLETED or FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRun' }
        '409':
          description: The bureau member code is not configured (system property `bureau.member-code`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/runs:
    get:
      tags: [Reporting]
      operationId: listReportRuns
      summary: Report runs, newest first
      description: The caller's own runs; every user's runs with `report:admin`. The file itself is never part of this list.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportRun' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/runs/{id}/download:
    get:
      tags: [Reporting]
      operationId: downloadReportRun
      summary: The file of a completed run
      description: |
        Only for the user who ran the report, or a user with `report:admin`, and only while they hold the report's
        own permission (so `report:admin` alone never opens a bureau file). Every download is written to the audit
        log (`REPORT_DOWNLOAD`, or `BUREAU_DOWNLOAD`).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: part
          in: query
          schema: { type: string, enum: [rejections] }
          description: '`rejections`: the accounts left out of a bureau file, with the reason (CSV, no personal data)'
      responses:
        '200':
          description: 'The file, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            text/csv:
              schema: { type: string }
            text/plain:
              schema: { type: string, description: The UCRF-style bureau file (pipe-delimited) }
        '409':
          description: The run did not complete, or the stored file no longer matches its record
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/dashboard:
    get:
      tags: [Reporting]
      operationId: getDashboard
      summary: Dashboard figures for the caller's branches
      description: Permission `dashboard:view`. Every figure is limited to the caller's branch scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/integrations/providers/catalogue:
    get:
      tags: [Integrations]
      operationId: listProviderCatalogue
      summary: Providers the product knows, their settings and secret names, and whether each is verified and enabled
      description: 'Permission: integration:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integrations/providers:
    get:
      tags: [Integrations]
      operationId: listProviderConfigs
      summary: Provider configuration per kind; secrets appear only as set + last four characters
      description: 'Permission: integration:view.'
      parameters:
        - { name: history, in: query, description: 'Include superseded versions', schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Integrations]
      operationId: proposeProviderConfig
      summary: Propose a provider configuration (maker-checker)
      description: 'Permission: integration:admin. Secrets are encrypted in the approval request and never shown to the checker. A secret left out keeps its current value.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderConfigInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integrations/providers/{kind}/deactivate:
    post:
      tags: [Integrations]
      operationId: proposeProviderDeactivation
      summary: Propose to deactivate the provider of a kind (maker-checker)
      description: 'Permission: integration:admin.'
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integrations/simulator/callbacks:
    post:
      tags: [Integrations]
      operationId: simulateProviderCallback
      summary: Test and demo only - play a callback of the SIMULATOR provider through the real verification path
      description: 'Permission: integration:simulate.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatedCallback' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integrations/simulator/payouts/{id}/outcome:
    post:
      tags: [Integrations]
      operationId: simulatePayoutOutcome
      summary: Test and demo only - report a payout as FAILED, or RETURNED after it was credited
      description: >-
        Permission: integration:simulate; only while SIMULATOR is the active payout provider with a webhookSecret.
        Plays a signed callback for the payout and processes it at once, so the normal failure path follows: a loan
        disbursed through the API is reversed, a staff-approved loan gets a reversal proposed for a checker (tenant
        property payout.failure-action: PROPOSE or PARK). 409 when the payout's status does not allow it (FAILED from
        INITIATED or SENT; RETURNED from SENT or SUCCESS).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatedPayoutOutcome' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /hooks/v1/{tenant}/{kind}/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveProviderCallback
