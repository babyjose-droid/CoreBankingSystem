      operationId: listApiClients
      summary: OAuth2 API clients of the tenant
      description: 'Permission: apiclient:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Integrations]
      operationId: proposeApiClient
      summary: Propose an API client (maker-checker; two checkers when a money-moving scope is included)
      description: 'Permission: apiclient:admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiClientInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/api-clients/scopes:
    get:
      tags: [Integrations]
      operationId: listApiClientScopes
      summary: The scopes an API client may hold and which need two checkers
      description: 'Permission: apiclient:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/api-clients/{clientId}:
    get:
      tags: [Integrations]
      operationId: getApiClient
      summary: An API client
      description: 'Permission: apiclient:view.'
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/api-clients/{clientId}/scopes:
    put:
      tags: [Integrations]
      operationId: proposeApiClientScopes
      summary: Propose a scope change (maker-checker)
      description: 'Permission: apiclient:admin.'
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiClientScopes' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/api-clients/{clientId}/actions:
    post:
      tags: [Integrations]
      operationId: proposeApiClientAction
      summary: Propose ROTATE_SECRET, DISABLE or ENABLE (maker-checker)
      description: 'Permission: apiclient:admin.'
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/api-clients/{clientId}/secret:
    post:
      tags: [Integrations]
      operationId: collectApiClientSecret
      summary: Collect the client secret - once, by the user who proposed the client or the rotation
      description: 'Permission: apiclient:admin. The secret is generated at the identity provider at this moment and is not stored by CoreBanking.'
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/message-templates:
    get:
      tags: [Integrations]
      operationId: listMessageTemplates
      summary: SMS and e-mail templates
      description: 'Permission: message:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Integrations]
      operationId: proposeMessageTemplate
      summary: Propose a template (maker-checker)
      description: 'Permission: message:admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageTemplateInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/message-templates/variables:
    get:
      tags: [Integrations]
      operationId: listMessageTemplateVariables
      summary: Template codes (events) and the placeholders each may use
      description: 'Permission: message:view.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/messages:
    get:
      tags: [Integrations]
      operationId: listMessages
      summary: The delivery log - recipient masked, never the text
      description: 'Permission: message:view.'
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: loanId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: 'QUEUED, SENT, FAILED or SUPPRESSED', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationRecord' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/customers/{id}/message-opt-outs:
    post:
      tags: [Integrations]
      operationId: setMessageOptOut
      summary: Record or lift a customer opt-out of a channel
      description: 'Permission: message:admin.'
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageOptOut' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /platform/v1/tenants:
    get:
      tags: [Control plane]
      operationId: listTenants
      summary: List tenants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Control plane]
      operationId: provisionTenant
      summary: Provision a tenant (database, migrations, starter kit, first admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '201':
          description: Provisioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/tenants/{code}/modules:
    put:
      tags: [Control plane]
      operationId: setTenantModules
      summary: Set tenant modules
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/migrations:
    post:
      tags: [Control plane]
      operationId: migrateAllTenants
      summary: Migrate all tenants
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Per-tenant result; one failure does not stop the others
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MigrationResult' }
        default: { $ref: '#/components/responses/Problem' }
  # ---- P2-7 platform completion ----
  /api/v1/custom-fields:
    get:
      tags: [Platform]
      operationId: listCustomFields
      summary: Custom field definitions for customers, loan accounts and loan products
      description: Permission `custom-field:view`.
      parameters:
        - { name: entity, in: query, schema: { type: string, enum: [CUSTOMER, LOAN_ACCOUNT, LOAN_PRODUCT] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomField' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Platform]
      operationId: proposeCustomField
      summary: Propose a custom field or a change to one (maker-checker)
      description: >-
        Permission `custom-field:propose`. The type and the personal-data flag of an existing field cannot change; a field
        is deactivated, never deleted. A field flagged `pii` must be TEXT: its values are stored encrypted and returned masked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loan-products/{code}/custom:
    get:
      tags: [Lending]
      operationId: getLoanProductCustom
      summary: Custom field values of a loan product
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanProductCustom' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Lending]
      operationId: proposeLoanProductCustom
      summary: Propose the custom field values of a loan product (maker-checker)
      description: Permission `product:propose`. The body holds the complete set of values.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom: { $ref: '#/components/schemas/CustomValues' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/deferred-receipts:
    get:
      tags: [Lending]
      operationId: listLoanDeferredReceipts
      summary: Receipts of the loan accepted during end of day
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts:
    get:
      tags: [Lending]
      operationId: listDeferredReceipts
      summary: Receipts accepted during end of day, in the caller's branch scope
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPLIED, FAILED, CANCELLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts/{id}/retry:
    post:
      tags: [Lending]
      operationId: retryDeferredReceipt
      summary: Queue a failed receipt again
      description: Permission `loan:admin`. Use it once the cause of the failure (for example a frozen loan) is fixed.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/deferred-receipts/{id}/cancel:
    post:
      tags: [Lending]
      operationId: cancelDeferredReceipt
      summary: Set a failed receipt aside (refunded or handled outside)
      description: Permission `loan:admin`. The note says what was done with the money.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceipt' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sessions:
    get:
      tags: [Session]
      operationId: listSessions
      summary: The caller's login sessions, or another user's with session:admin
      parameters:
        - { name: user, in: query, description: User name; needs `session:admin`, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoginSession' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{id}:
    delete:
      tags: [Session]
      operationId: terminateSession
      summary: End a login session
      description: >-
        Without `user` the session must be one of the caller's own; with `user` (`session:admin`) one of that user's.
        Every termination is audited. An access token already issued stays valid until it expires.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        '204': { description: Ended }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Job catalogue with schedules, next fire time and last run
      description: Permission `job:view`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/runs:
    get:
      tags: [Jobs]
      operationId: listJobRuns
      summary: Job runs, newest first
      parameters:
        - { name: job, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{code}:
    put:
      tags: [Jobs]
      operationId: proposeJobSchedule
      summary: Propose a job's schedule, on/off switch and parameters (maker-checker)
      description: >-
        Permission `job:schedule`. The schedule is a six-field cron (second minute hour day-of-month month day-of-week)
        in India Standard Time. For a report job the maker needs the report's permission; the scheduled runs use the
        maker's branch scope and belong to the maker.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobScheduleInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{code}/run:
    post:
      tags: [Jobs]
      operationId: runJob
      summary: Run a job now
      description: Permission `job:run`. Answers when the job has finished. 409 when the job is already running.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/dashboard/trend:
    get:
      tags: [Reporting]
      operationId: getDashboardTrend
      summary: Whole-book figures per business date (all-branch users)
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 366 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DashboardTrendPoint' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access:
    get:
      tags: [Platform]
      operationId: listSupportAccess
      summary: Support access requests and grants of this tenant
      description: Permission `support-access:approve`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, APPROVED, REJECTED, REVOKED, EXPIRED, LAPSED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/approve:
    post:
      tags: [Platform]
      operationId: approveSupportAccess
      summary: Approve a support access request; it expires after the requested duration
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/reject:
    post:
      tags: [Platform]
      operationId: rejectSupportAccess
      summary: Reject a support access request (a note is required)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/support-access/{id}/revoke:
    post:
      tags: [Platform]
      operationId: revokeSupportAccess
      summary: Revoke a support access grant at once
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Note' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage:
    get:
      tags: [Control plane]
      operationId: listUsage
      summary: Daily usage per tenant (active loans and customers, API calls, storage, staff users)
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageDay' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/monthly:
    get:
      tags: [Control plane]
      operationId: listMonthlyUsage
      summary: Monthly usage per tenant for billing
      parameters:
        - { name: month, in: query, description: YYYY-MM; the previous month when left out, schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageMonth' }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/monthly.csv:
    get:
      tags: [Control plane]
      operationId: exportMonthlyUsage
      summary: Monthly usage per tenant as CSV
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/usage/snapshot:
    post:
      tags: [Control plane]
      operationId: snapshotUsage
      summary: Take the usage snapshot now for one tenant or for all
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: One entry per tenant
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Problem' }
  /platform/v1/support-access:
    get:
      tags: [Control plane]
      operationId: listSupportRequests
      summary: The engineer's own support access requests (all of them for an operator)
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Control plane]
      operationId: requestSupportAccess
      summary: Ask for time-boxed, read-only access to a tenant
      description: >-
        Permission `platform:support` (platform realm). Nothing is granted by this call: the tenant's admin approves in
        the tenant API. While a grant is in force the engineer may call that tenant's GET endpoints on the support list
        with the headers `X-Support-Tenant` and `X-Support-Grant`; responses have personal values masked and every call
        is written to the tenant's audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportAccessRequest' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAccess' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 100 }
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Accepted:
      description: Change recorded as an approval request; applied when a checker approves it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Approval' }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
      examples: ['100000.00']
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Field-level problems (validation), when there are several
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Me:
      type: object
      required: [userId, displayName, tenant, businessDate, permissions, modules]
      properties:
        userId: { type: string }
        displayName: { type: string }
        tenant: { type: string }
        tenantName: { type: string }
        homeBranch: { type: string }
        allBranches: { type: boolean, description: 'True when the user sees every branch (branch scope, US-020)' }
        branches:
          type: array
          description: Branches whose data the user can see
          items: { type: string }
        businessDate: { type: string, format: date }
        permissions:
          type: array
          items: { type: string, examples: ['customer:create', 'approval:approve'] }
        roles:
          type: array
          description: Realm roles (MAKER, CHECKER …); role amount limits apply by role
          items: { type: string }
        modules:
          type: array
          items: { type: string, examples: ['LENDING', 'GL'] }
    BusinessDay:
      type: object
      required: [businessDate, status]
      properties:
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, EOD_RUNNING, EOD_FAILED, CLOSED] }
    Branch:
      type: object
      required: [code, name, stateCode]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        name: { type: string }
        ifsc: { type: [string, 'null'] }
        stateCode: { type: string, description: 'GST state code, e.g. 32' }
        parentCode: { type: [string, 'null'] }
        headOffice: { type: boolean }
        status: { type: string, enum: [ACTIVE, CLOSED] }
    Holiday:
      type: object
      required: [day, reason]
      properties:
        branchCode: { type: [string, 'null'], description: null = all branches }
        day: { type: string, format: date }
        reason: { type: string }
    TaxRate:
      type: object
      required: [code, taxType, ratePercent, effectiveFrom]
      properties:
        code: { type: string, examples: ['GST18'] }
        taxType: { type: string, enum: [GST, TDS] }
        ratePercent: { type: string, examples: ['18.00'] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    EnumValue:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    EnumValueInput:
      type: object
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{1,40}$' }
        label: { type: string }
        sortOrder: { type: integer, default: 0 }
        active: { type: boolean, default: true }
    EnumerationType:
      type: object
      properties:
        type: { type: string }
        valueCount: { type: integer }
        activeCount: { type: integer }
    SystemProperty:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: [string, 'null'] }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PropertyChange:
      type: object
      required: [value]
      properties:
        value: { type: string }
        description: { type: string }
    BranchSet:
      type: object
      required: [code, name, branches]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string }
        branches:
          type: array
          minItems: 1
          items: { type: string }
    Staff:
      type: object
      required: [username, displayName, homeBranch]
      properties:
        userId: { type: string, readOnly: true, description: Derived by the server }
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{2,80}$', description: Keycloak username }
        displayName: { type: string }
        homeBranch: { type: string }
        allBranches: { type: boolean, default: false }
        branches:
          type: array
          description: Branches granted in addition to the home branch
          items: { type: string }
        branchSets:
          type: array
          description: Branch sets granted (all their member branches)
          items: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, EXITED], default: ACTIVE }
    State:
      type: object
      properties:
        code: { type: string, examples: ['KL'] }
        name: { type: string }
        gstStateCode: { type: string, examples: ['32'] }
        unionTerritory: { type: boolean }
    PincodePlace:
      type: object
      properties:
        pincode: { type: string }
        city: { type: string }
        district: { type: string }
        stateCode: { type: string }
        stateName: { type: string }
        gstStateCode: { type: string }
    VoucherUploadResult:
      type: object
      properties:
        vouchers: { type: integer }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
    Approval:
      type: object
      required: [id, entityType, action, status, maker, madeAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, examples: [CUSTOMER, BRANCH, BRANCH_SET, STAFF, GL_HEAD, VOUCHER, TAX_RATE, HOLIDAY, TERRITORY, ENUMERATION, SYSTEM_PROPERTY, EOD_SCHEDULE, LOAN_PRODUCT, LOAN_DISBURSEMENT, LOAN_WAIVER, LOAN_REVERSAL, LOAN_AMENDMENT, LOAN_RESTRUCTURE] }
        entityId: { type: [string, 'null'] }
        action: { type: string, examples: [CREATE, UPDATE, REVERSE] }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        maker: { type: string }
        madeAt: { type: string, format: date-time }
        checker: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        ageHours: { type: number, description: SLA ageing }
        checkersRequired: { type: integer, description: 'Distinct checkers needed (0-3), from the approval rules' }
        approvalsSoFar: { type: integer, description: Approvals already recorded while PENDING }
        appliedRef: { type: [string, 'null'], description: 'What the approval produced (customer id, voucher number …)' }
        current: { type: [object, 'null'], description: State before the change (null for CREATE) }
        proposed: { type: object, description: Proposed state }
    Decision:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    CustomerInput:
      type: object
      required: [customerType, firstName, homeBranch, dateOfBirth, mobile]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        customerType: { type: string, enum: [INDIVIDUAL, NON_INDIVIDUAL] }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [FEMALE, MALE, OTHER] }
        pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$' }
        mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
        email: { type: string, format: email }
        homeBranch: { type: string }
        address:
          type: object
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            stateCode: { type: string }
            pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        overrideDedupe: { type: boolean, description: Proceed despite possible duplicates (requires approval with reason) }
        overrideReason: { type: string }
        externalRef: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$', description: 'The id of the customer in the LOS; repeating it returns the existing customer' }
    CustomerSummary:
      type: object
      required: [id, customerNo, displayName, status]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        id: { type: string, format: uuid }
        customerNo: { type: string }
        displayName: { type: string }
        customerType: { type: string }
        dateOfBirth: { type: string, format: date }
        panMasked: { type: [string, 'null'], examples: ['XXXXX1234X'] }
        mobileMasked: { type: [string, 'null'], examples: ['XXXXXX0001'] }
        homeBranch: { type: string }
        kycStatus: { type: string }
        status: { type: string }
    DedupeMatch:
      type: object
      required: [customerNo, displayName, rule]
      properties:
        customerNo: { type: string }
        displayName: { type: string }
        rule: { type: string, enum: [PAN, MOBILE, NAME_DOB] }
        strength: { type: string, enum: [EXACT, STRONG, POSSIBLE] }
    LimitTxnType:
      type: string
      enum: [LOAN_DISBURSEMENT, LOAN_REPAYMENT, LOAN_WAIVER, VOUCHER, LOAN_PRECLOSURE, FEE_WAIVER]
    AmountLimitInput:
      type: object
      required: [roleName, txnType, perTransactionMax, effectiveFrom]
      properties:
        roleName: { type: string, description: 'A realm role as it appears in the access token, e.g. MAKER', pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{1,63}$' }
        txnType: { $ref: '#/components/schemas/LimitTxnType' }
        perTransactionMax: { type: [number, string] }
        perDayMax: { type: [number, string, 'null'], description: 'Cumulative per business day; null = no day limit' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    AmountLimit:
      type: object
      required: [id, roleName, txnType, perTransactionMax, effectiveFrom, inForce]
      properties:
        id: { type: string, format: uuid }
        roleName: { type: string }
        txnType: { $ref: '#/components/schemas/LimitTxnType' }
        perTransactionMax: { $ref: '#/components/schemas/Money' }
        perDayMax: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        inForce: { type: boolean, description: In force on the current business date }
    RelationshipInput:
      type: object
      required: [relatedCustomerId, relationType]
      properties:
        relatedCustomerId: { type: string, format: uuid }
        relationType: { type: string, enum: [CO_APPLICANT, GUARANTOR, NOMINEE, AUTHORISED_SIGNATORY] }
        loanId: { type: [string, 'null'], format: uuid, description: 'Nominee only: the account the nomination applies to' }
        sharePercent: { type: [number, string, 'null'], description: 'Nominee only; the shares of a set total 100' }
    CustomerRelationship:
      type: object
      required: [id, direction, relationType, relatedCustomerId, relatedCustomerNo, status]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [OUTGOING, INCOMING] }
        relationType: { type: string, enum: [CO_APPLICANT, GUARANTOR, NOMINEE, AUTHORISED_SIGNATORY] }
        relatedCustomerId: { type: string, format: uuid }
        relatedCustomerNo: { type: string }
        relatedCustomerName: { type: [string, 'null'], description: 'null when the other customer is outside the branch scope of the caller' }
        loanId: { type: [string, 'null'], format: uuid }
        sharePercent: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, ENDED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    CustomerExposure:
      type: object
      required: [customerId, asBorrower, asCoApplicant, asGuarantor]
      properties:
        customerId: { type: string, format: uuid }
        exposureLimit: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        asBorrower: { $ref: '#/components/schemas/Money' }
        asCoApplicant: { $ref: '#/components/schemas/Money' }
        asGuarantor: { $ref: '#/components/schemas/Money' }
        loansAsBorrower: { type: integer }
        loansAsCoApplicant: { type: integer }
        loansAsGuarantor: { type: integer }
        available: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ], description: 'Room left under the limit; null when no limit is set' }
    LoanParty:
      type: object
      required: [customerId, customerNo, role]
      properties:
        customerId: { type: string, format: uuid }
        customerNo: { type: string }
        customerName: { type: string }
        role: { type: string, enum: [BORROWER, CO_APPLICANT, GUARANTOR] }
        customerStatus: { type: string }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    ConsentInput:
      type: object
      required: [purpose, lawfulBasis, noticeVersion, channel]
      properties:
        purpose: { type: string, description: 'A value of the enumeration `consent-purpose`', examples: ['LOAN_PROCESSING', 'CREDIT_BUREAU_REPORTING', 'MARKETING', 'KYC_VERIFICATION', 'ACCOUNT_AGGREGATOR'] }
        lawfulBasis: { type: string, enum: [CONSENT, LEGITIMATE_USE], description: 'DPDP Act 2023: consent (s.6) or a legitimate use (s.7)' }
        noticeVersion: { type: string, description: Version of the privacy notice shown to the customer }
        channel: { type: string, enum: [BRANCH, WEB, MOBILE_APP, API, PAPER, CALL_CENTRE] }
        evidenceRef: { type: string, description: 'Proof that it was given (OTP or e-sign transaction, form scan); required for CONSENT' }
        grantedAt: { type: string, format: date-time, description: 'Defaults to now; never in the future' }
        expiresAt: { type: [string, 'null'], format: date-time }
    Consent:
      type: object
      required: [id, customerId, purpose, lawfulBasis, noticeVersion, channel, grantedAt, status, retainedForLegalObligation]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        purpose: { type: string }
        lawfulBasis: { type: string, enum: [CONSENT, LEGITIMATE_USE] }
        noticeVersion: { type: string }
        channel: { type: string }
        evidenceRef: { type: [string, 'null'] }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRED, WITHDRAWN] }
        withdrawnAt: { type: [string, 'null'], format: date-time }
        withdrawalReason: { type: [string, 'null'] }
        withdrawnBy: { type: [string, 'null'] }
        retainedForLegalObligation: { type: boolean, description: 'Withdrawn, but the data is kept and used as far as law requires while a loan exists' }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    KycDocument:
      type: object
      required: [id, customerId, docType, status, contentType, sizeBytes, sha256, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        docType: { type: string }
        numberMasked: { type: [string, 'null'], examples: ['XXXXXX234F', 'XXXX XXXX 0000'] }
        issueDate: { type: [string, 'null'], format: date }
        expiryDate: { type: [string, 'null'], format: date }
        expired: { type: boolean }
        status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        statusReason: { type: [string, 'null'] }
        verifiedBy: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        maskingConfirmed: { type: boolean }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer }
        sha256: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        customerKycStatus: { type: string, description: 'KYC status of the customer after this change (not in list responses)' }
    GlHead:
      type: object
      required: [code, name, category, posting]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
        parentCode: { type: [string, 'null'] }
        posting: { type: boolean, description: Only posting (leaf) heads accept entries }
        status: { type: string, enum: [ACTIVE, FROZEN, CLOSED] }
    VoucherLine:
      type: object
      required: [branch, glCode, side, amount]
      properties:
        branch: { type: string }
        glCode: { type: string }
        account: { type: string, description: Defaults to glCode }
        side: { type: string, enum: [DR, CR] }
        amount: { $ref: '#/components/schemas/Money' }
        narration: { type: string }
    VoucherInput:
      type: object
      required: [voucherType, valueDate, description, lines]
      properties:
        voucherType: { type: string, enum: [CONTRA, RECEIPT, PAYMENT, JOURNAL] }
        valueDate: { type: string, format: date }
        reference: { type: string }
        description: { type: string }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/VoucherLine' }
    Voucher:
      allOf:
        - $ref: '#/components/schemas/VoucherInput'
        - type: object
          required: [id, voucherNo, status, amount]
          properties:
            id: { type: string, format: uuid }
            voucherNo: { type: string }
            status: { type: string, enum: [POSTED, REVERSED] }
            amount: { $ref: '#/components/schemas/Money' }
            lotId: { type: string, format: uuid }
            reversalLotId: { type: [string, 'null'], format: uuid }
            businessDate: { type: string, format: date }
    TrialBalanceRow:
      type: object
      required: [glCode, glName, category, debit, credit, net]
      properties:
        glCode: { type: string }
        glName: { type: string }
        category: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    LedgerEntry:
      type: object
      properties:
        lotId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        branch: { type: string }
        glCode: { type: string }
        account: { type: string }
        side: { type: string, enum: [DR, CR] }
        amount: { $ref: '#/components/schemas/Money' }
        narration: { type: string }
        lotType: { type: string }
    StatementRow:
      type: object
      required: [section, glCode, glName, amount]
      properties:
        section: { type: string, examples: [INCOME, EXPENSE, ASSET, LIABILITY, EQUITY, NET_PROFIT] }
        glCode: { type: string }
        glName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    EodStep:
      type: object
      properties:
        stepNo: { type: integer }
        name: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, COMPLETED_WITH_EXCEPTIONS, FAILED, SKIPPED] }
        processed: { type: integer }
        failed: { type: integer }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    EodException:
      type: object
      properties:
        step: { type: string }
        accountNo: { type: string }
        error: { type: string }
        resolved: { type: boolean }
    EodRun:
      type: object
      required: [id, businessDate, status]
      properties:
        id: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [RUNNING, COMPLETED, COMPLETED_WITH_EXCEPTIONS, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        nextBusinessDate: { type: [string, 'null'], format: date }
        steps: { type: array, items: { $ref: '#/components/schemas/EodStep' } }
        exceptions: { type: array, items: { $ref: '#/components/schemas/EodException' } }
        warnings:
          type: array
          description: Recorded by the pre-check step; they never fail the run
          items: { $ref: '#/components/schemas/EodWarning' }
    EodWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [PENDING_APPROVALS] }
        message: { type: string }
        count: { type: [integer, 'null'] }
    EodPendingApprovals:
      type: object
      required: [total, byType, blocking]
      properties:
        total: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [entityType, count]
            properties:
              entityType: { type: string }
              count: { type: integer }
        blocking: { type: boolean, description: 'True when eod.block-on-pending-approvals is set and approvals are pending: the start is refused' }
        message: { type: [string, 'null'], examples: ['3 approvals are pending: 2 vouchers, 1 disbursement — they stay pending and will apply on the business date on which they are approved'] }
    EodSchedule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [MANUAL, SCHEDULED] }
        cron: { type: [string, 'null'], examples: ['0 30 23 * * *'] }
        alertEmails: { type: array, items: { type: string, format: email } }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        detail: { type: [object, 'null'] }
    TenantInput:
      type: object
      required: [code, legalName, entityType, deploymentTier, edition]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9-]{2,30}$' }
        legalName: { type: string }
        entityType: { type: string, enum: [NBFC, BANK, SFB, COOP_BANK, HFC, MFI] }
        deploymentTier: { type: string, enum: [POOLED, DEDICATED, STANDALONE] }
        edition: { type: string, enum: [STARTER, GROWTH, ENTERPRISE] }
        starterKit: { type: string, enum: [NBFC, BANK], default: NBFC }
        headOffice:
          type: object
          required: [code, name, stateCode]
          properties:
            code: { type: string }
            name: { type: string }
            stateCode: { type: string }
        firstBusinessDate: { type: string, format: date }
        adminUsers:
          type: array
          description: Keycloak usernames of the first tenant admins; they get all-branch staff profiles
          items: { type: string, pattern: '^[A-Za-z0-9._@-]{2,80}$' }
        kmsKeyArn: { type: string, description: Tenant CMK (Terraform modules/tenant output) }
        dbSecretArn: { type: string, description: Secrets Manager ARN of the tenant DB credentials (never the credentials) }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legalName: { type: string }
        entityType: { type: string }
        deploymentTier: { type: string }
        edition: { type: string }
        status: { type: string }
        modules: { type: array, items: { type: string } }
    MigrationResult:
      type: object
      properties:
        tenant: { type: string }
        currentVersion: { type: [string, 'null'] }
        pending: { type: array, items: { type: string } }
        status: { type: string, enum: [UP_TO_DATE, PENDING, MIGRATED, FAILED] }
        error: { type: [string, 'null'] }
    LoanStatus:
      type: string
      enum: [SANCTIONED, ACTIVE, FROZEN, CLOSED, CANCELLED, WRITTEN_OFF]
    AssetClass:
      type: string
      enum: [STANDARD, SMA0, SMA1, SMA2, SUBSTANDARD, DOUBTFUL1, DOUBTFUL2, DOUBTFUL3, LOSS]
    AmountBody:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    FeeRule:
      type: object
      required: [code, name, event, calcType]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string }
        event:
          type: string
          enum: [DISBURSEMENT, EVERY_DISBURSEMENT, PRECLOSURE, PART_PREPAYMENT, BOUNCE, LATE_PAYMENT, CANCELLATION, ADHOC]
          description: >-
            DISBURSEMENT: once, on the first disbursement, on the sanctioned amount. EVERY_DISBURSEMENT: on each
            tranche, on that tranche's amount. Only these two may be deducted from the payout.
        calcType: { type: string, enum: [FIXED, PERCENT, SLAB] }
        amount: { type: [number, string, 'null'] }
        percent: { type: [number, string, 'null'] }
        slabs:
          type: array
          items:
            type: object
            properties:
              from: { type: [number, string] }
              to: { type: [number, string] }
              fee: { type: [number, string] }
        minAmount: { type: [number, string, 'null'] }
        maxAmount: { type: [number, string, 'null'] }
        gstRate: { type: [number, string, 'null'], default: 18 }
        taxTreatment: { type: string, enum: [EXCLUSIVE, INCLUSIVE] }
        deductFromDisbursal: { type: boolean }
    RepaymentMethod:
      type: string
      enum: [EQUATED, STEP_EQUATED, FIXED_PRINCIPAL, BULLET_TOTAL_INTEREST, BULLET_PERIODIC_INTEREST, STRUCTURED]
      description: >-
        EQUATED: equal instalments. STEP_EQUATED: instalments that step up or down by stepPercent every stepEvery
        instalments. FIXED_PRINCIPAL: equal principal plus interest on the balance. BULLET_TOTAL_INTEREST: principal
        and all interest at maturity. BULLET_PERIODIC_INTEREST: interest every period, principal at maturity.
        STRUCTURED: principal as assigned to each date on the loan (scheduleRows), with the interest accrued.
    RepaymentFrequency:
      type: string
      enum: [DAILY, WEEKLY, FORTNIGHTLY, MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
      default: MONTHLY
    LoanProductTemplate:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [RETAIL, BUSINESS, GOLD, MICRO, CONSUMER, HOUSING, AGRI] }
        product: { type: object, additionalProperties: true, description: 'LoanProduct without code, status and version' }
    PrincipalRow:
      type: object
      required: [dueDate, principal]
      properties:
        dueDate: { type: string, format: date }
        principal: { type: [number, string], description: Principal falling due on the date; zero for an interest-only date }
    ProductPreviewRequest:
      type: object
      required: [product]
      properties:
        product: { type: object, additionalProperties: true, description: 'A draft LoanProduct; code, status and version are not needed' }
        amount: { type: [number, string, 'null'], description: 'Default: the product minimum' }
        tenorMonths: { type: [integer, 'null'], description: 'Periods of the product frequency; default: the product minimum' }
        rate: { type: [number, string, 'null'], description: 'Default: the product minimum rate, or benchmark + spread, or the interest table' }
        disbursalDate: { type: [string, 'null'], format: date }
        firstDueDate: { type: [string, 'null'], format: date }
        moratoriumMonths: { type: [integer, 'null'] }
        balloon: { type: [number, string, 'null'] }
        instalment: { type: [number, string, 'null'] }
        maturityAmount: { type: [number, string, 'null'] }
        scheduleRows: { type: [array, 'null'], items: { $ref: '#/components/schemas/PrincipalRow' } }
    LoanTranches:
      type: object
      properties:
        sanctionedAmount: { $ref: '#/components/schemas/Money' }
        disbursedAmount: { $ref: '#/components/schemas/Money' }
        undrawnAmount: { $ref: '#/components/schemas/Money' }
        multipleDisbursements: { type: boolean }
        preEmi: { type: boolean }
        tranches:
          type: array
          items:
            type: object
            properties:
              trancheNo: { type: integer }
              txnId: { type: string, format: uuid }
              businessDate: { type: string, format: date }
              amount: { $ref: '#/components/schemas/Money' }
              feesDeducted: { $ref: '#/components/schemas/Money' }
              interestDeducted: { $ref: '#/components/schemas/Money' }
              netDisbursed: { $ref: '#/components/schemas/Money' }
              createdBy: { type: string }
    ChargeBreakup:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        fee: { type: string }
        cgst: { type: string }
        sgst: { type: string }
        igst: { type: string }
        total: { type: string }
    DisbursementSimulation:
      type: object
      properties:
        asOf: { type: string, format: date }
        trancheNo: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        deductedFees: { type: array, items: { $ref: '#/components/schemas/ChargeBreakup' } }
        chargedFees: { type: array, items: { $ref: '#/components/schemas/ChargeBreakup' }, description: Fees charged to the account instead of deducted }
        interestDeducted: { $ref: '#/components/schemas/Money' }
        netDisbursal: { $ref: '#/components/schemas/Money' }
        disbursedAfter: { $ref: '#/components/schemas/Money' }
        undrawnAfter: { $ref: '#/components/schemas/Money' }
        fullyDrawn: { type: boolean }
        preEmi: { type: boolean, description: Interest-only instalments continue after this disbursement }
        instalmentAfter: { $ref: '#/components/schemas/Money' }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
    TransactionSimulationRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [REPAYMENT, PREPAYMENT, PRECLOSURE] }
        amount: { type: [number, string, 'null'], description: 'REPAYMENT and PREPAYMENT' }
        mode: { type: [string, 'null'], enum: [REDUCE_EMI, REDUCE_TENURE, null], description: 'PREPAYMENT; default: the product setting' }
        onDate: { type: [string, 'null'], format: date, description: 'Today (default) or up to 366 days ahead' }
    TransactionSimulation:
      type: object
      description: Fields depend on type.
      properties:
        type: { type: string }
        asOf: { type: string, format: date }
        onDate: { type: string, format: date }
        amount: { type: string }
        duesBefore: { type: string, description: REPAYMENT }
        allocations:
          type: array
          description: 'REPAYMENT: what the receipt is appropriated to, in order'
          items:
            type: object
            properties:
              ref: { type: string, description: 'D<n> = instalment n; otherwise a charge id' }
              component: { type: string, enum: [INTEREST, PRINCIPAL, PENAL, FEE] }
              amount: { type: string }
        principal: { type: string }
        interest: { type: string }
        fees: { type: string }
        penal: { type: string }
        advance: { type: string, description: 'REPAYMENT: excess kept as an advance' }
        duesAfter: { type: string }
        principalOutstandingAfter: { type: string }
        dpdAfter: { type: integer }
        assetClassAfter: { type: string }
        statusAfter: { type: string }
        mode: { type: string, description: PREPAYMENT }
        feeCharged: { type: string, description: PREPAYMENT }
        instalmentBefore: { type: string }
        instalmentAfter: { type: string }
        remainingBefore: { type: integer }
        remainingAfter: { type: integer }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' }, description: 'PREPAYMENT: the schedule after it' }
        overdueDues: { type: string, description: PRECLOSURE }
        accruedInterest: { type: string, description: PRECLOSURE }
        charges: { type: string, description: PRECLOSURE }
        foreclosureFee: { type: string, description: PRECLOSURE }
        advanceAdjusted: { type: string, description: PRECLOSURE }
        total: { type: string, description: 'PRECLOSURE: amount to close the loan on the date' }
    SanctionChangeRequest:
      type: object
      description: Give either newAmount or cancelUndrawn; reason is required when proposing.
      properties:
        newAmount: { type: [number, string, 'null'] }
        cancelUndrawn: { type: [boolean, 'null'], description: Bring the sanctioned amount down to the amount disbursed }
        reason: { type: string }
    SanctionChangePreview:
      type: object
      properties:
        asOf: { type: string, format: date }
        sanctionedBefore: { type: string }
        sanctionedAfter: { type: string }
        disbursed: { type: string }
        undrawnAfter: { type: string }
        topUp: { type: boolean }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
        note: { type: string }
    NpaOverrideRequest:
      type: object
      required: [assetClass, until, reason]
      properties:
        assetClass: { type: string, enum: [SUBSTANDARD, DOUBTFUL1, DOUBTFUL2, DOUBTFUL3, LOSS] }
        until: { type: string, format: date, description: Expiry of the override (inclusive); after the business date }
        reason: { type: string }
    LoanProduct:
      type: object
      required: [code, name, repaymentMethod, minAmount, maxAmount, minTenorMonths, maxTenorMonths, minRate, maxRate]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,12}$' }
        name: { type: string }
        repaymentMethod: { $ref: '#/components/schemas/RepaymentMethod' }
        frequency: { $ref: '#/components/schemas/RepaymentFrequency' }
        interestBasis:
          type: string
          enum: [DAILY_REDUCING, PERIODIC_REDUCING, FLAT]
          default: DAILY_REDUCING
          description: >-
            DAILY_REDUCING: simple interest per annum on the balance for the actual days, by the day count.
            PERIODIC_REDUCING: balance x rate / periods per year for every full period. FLAT (EQUATED only):
            interest = amount x rate x tenor, in equal instalments; the account accrues at the equivalent reducing
            rate, and the KFS shows that rate and the APR.
        bpiMode:
          type: string
          enum: [NONE, ADD_TO_FIRST_INSTALMENT, SEPARATE_DEMAND, DEDUCT_AT_DISBURSAL]
          default: NONE
          description: >-
            Broken-period interest, for the days between disbursal and the start of the first regular period when
            the first due date is later than one period: absorbed by the first instalment's split (NONE), added to
            the first instalment, demanded on its own, or deducted from the payout.
        stepPercent: { type: [number, string, 'null'], description: 'STEP_EQUATED: change of the instalment at each step, e.g. 10 (step-up) or -10 (step-down); above -50, at most 100' }
        stepEvery: { type: [integer, 'null'], minimum: 1, description: 'STEP_EQUATED: instalments between steps' }
        principalEvery: { type: integer, minimum: 1, default: 1, description: 'FIXED_PRINCIPAL: principal falls due every n-th instalment, interest every instalment' }
        multipleDisbursements: { type: boolean, default: false, description: 'The loan may be disbursed in tranches (EQUATED, FIXED_PRINCIPAL and bullet products on DAILY_REDUCING)' }
        preEmi: { type: boolean, default: false, description: 'With multipleDisbursements on an EQUATED product: interest only on the amount drawn until the final tranche, then EMIs for the full tenor. Otherwise EMIs on the amount drawn, recomputed on each tranche.' }
        topUpAllowed: { type: boolean, default: false, description: 'The sanctioned amount of a live account may be raised (same methods as multipleDisbursements)' }
        benchmarkCode: { type: [string, 'null'], description: 'Floating products: rate = benchmark + spread when the application gives no rate. Needs spread, resetFrequencyMonths and rateType FLOATING.' }
        spread: { type: [number, string, 'null'] }
        resetFrequencyMonths: { type: [integer, 'null'], minimum: 1, maximum: 60 }
        minAmount: { type: [number, string] }
        maxAmount: { type: [number, string] }
        minTenorMonths: { type: integer, description: 'Counted in periods of the frequency (months for MONTHLY)' }
        maxTenorMonths: { type: integer, description: 'Counted in periods of the frequency (months for MONTHLY)' }
        minRate: { type: [number, string] }
        maxRate: { type: [number, string] }
        interestTableCode: { type: [string, 'null'] }
        rateType: { type: string, enum: [FIXED, FLOATING] }
        dayCount: { type: string, enum: [ACTUAL_365, ACTUAL_360, ACTUAL_ACTUAL, THIRTY_360, THIRTY_E_360, ACTUAL_366, ACTUAL_364, ACTUAL_336, ACTUAL_372] }
        rounding: { type: string, enum: [RUPEE_HALF_UP, RUPEE_DOWN, RUPEE_UP, PAISE_HALF_UP, PAISE_HALF_EVEN] }
        penalChargeRate: { type: [number, string, 'null'] }
        maxMoratoriumMonths: { type: integer }
        coolingOffDays: { type: integer }
        secured: { type: boolean }
        appropriationSequence: { type: array, items: { type: string, enum: [INTEREST, PRINCIPAL, PENAL, FEE] } }
        appropriationMode: { type: string, enum: [BY_DEMAND, BY_COMPONENT] }
        prepaymentMode: { type: string, enum: [REDUCE_EMI, REDUCE_TENURE] }
        status: { type: string, enum: [DRAFT, ACTIVE, WITHDRAWN] }
        fees: { type: array, items: { $ref: '#/components/schemas/FeeRule' } }
        version: { type: integer, readOnly: true }
    LoanApplication:
      type: object
      required: [productCode, customerId, amount, tenorMonths]
      properties:
        custom: { $ref: '#/components/schemas/CustomValues' }
        productCode: { type: string }
        customerId: { type: string, format: uuid }
        branch: { type: string, description: Defaults to the customer's home branch }
        amount: { type: [number, string] }
        tenorMonths: { type: integer, description: 'Instalment periods of the product frequency (months for a monthly product)' }
        rate: { type: [number, string, 'null'], description: 'Omit to use, in this order, the instalment or maturityAmount given, the product benchmark + spread, or its interest table. For a FLAT product this is the flat rate.' }
        instalment: { type: [number, string, 'null'], description: 'EQUATED: the agreed instalment; the rate follows from it (rate basis "tenure, amount and instalment"). Not together with rate.' }
        maturityAmount: { type: [number, string, 'null'], description: 'BULLET_TOTAL_INTEREST: the amount repayable at maturity; the simple annual rate follows from it. Not together with rate.' }
        scheduleRows: { type: [array, 'null'], items: { $ref: '#/components/schemas/PrincipalRow' }, description: 'STRUCTURED: principal by date, ascending, adding up to the amount; tenorMonths = number of rows' }
        disbursalDate: { type: string, format: date }
        firstDueDate: { type: string, format: date }
        moratoriumMonths: { type: integer }
        balloon: { type: [number, string, 'null'] }
        securedPortion: { type: [number, string, 'null'] }
        externalRef: { type: string, description: 'LOS application id; repeating it returns the existing loan' }
        parties:
          type: array
          maxItems: 10
          description: |
            Co-applicants and guarantors (the borrower is `customerId`). Each must be an ACTIVE customer, named once,
            and never the borrower.
          items:
            type: object
            required: [customerId, role]
            properties:
              customerId: { type: string, format: uuid }
              role: { type: string, enum: [CO_APPLICANT, GUARANTOR] }
    ScheduleRow:
      type: object
      properties:
        instalmentNo: { type: integer }
        dueDate: { type: string, format: date }
        days: { type: integer }
        openingBalance: { $ref: '#/components/schemas/Money' }
        interest: { $ref: '#/components/schemas/Money' }
        principal: { $ref: '#/components/schemas/Money' }
        instalment: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }
    LoanKfs:
      type: object
      properties:
        productCode: { type: string }
        productName: { type: string }
        productVersion: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        tenorMonths: { type: integer }
        frequency: { type: string }
        repaymentMethod: { type: string }
        rateType: { type: string }
        interestBasis: { type: string }
        interestRate: { type: string, description: The rate as quoted (the flat rate of a flat-rate loan) }
        effectiveRate: { type: string, description: 'Annual rate on the reducing balance that the account accrues at; differs from interestRate for a flat rate or a given instalment' }
        rateExplanation: { type: string }
        emi: { type: [string, 'null'], description: 'Regular instalment of an equated loan (the first step of a step loan)' }
        bpiMode: { type: string }
        brokenPeriodInterest: { type: string }
        interestDeductedAtDisbursal: { type: string }
        aprBasis: { type: string, enum: [NOMINAL_PERIODIC_IRR, XIRR], description: 'Evenly spaced instalments: periodic IRR x periods per year. Bullet, structured or separately collected broken-period interest: XIRR on the dated flows.' }
        draft: { type: boolean, description: Product preview only }
        sampleSchedule: { type: boolean, description: 'Product preview only: the schedule rows were made up as an example' }
        instalments: { type: integer }
        totalInterest: { $ref: '#/components/schemas/Money' }
        fees:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              fee: { type: string }
              cgst: { type: string }
              sgst: { type: string }
              igst: { type: string }
              total: { type: string }
        netDisbursal: { $ref: '#/components/schemas/Money' }
        totalRepayable: { $ref: '#/components/schemas/Money' }
        apr: { type: string, description: 'Annual percentage rate: IRR of the actual cash flows (amount less fees ex-GST and interest deducted upfront, then every instalment). For a flat-rate loan this is the true reducing-balance cost.' }
        penalChargeRate: { type: [string, 'null'] }
        penalChargeNote: { type: string }
        coolingOffDays: { type: integer }
        placeOfSupply: { type: [string, 'null'] }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
    Benchmark:
      type: object
      required: [code, name, source, external, rates]
      properties:
        code: { type: string, examples: ['REPO'] }
        name: { type: string }
        source: { type: string, description: 'Who publishes it: RBI, FBIL, the lender''s own ALCO' }
        external: { type: boolean, description: An external benchmark in RBI's sense }
        currentRate: { type: [string, 'null'], description: 'Rate in force on the business date; null when none is recorded yet' }
        currentFrom: { type: [string, 'null'], format: date }
        rates:
          type: array
          description: Newest first; may include a rate that takes effect after the business date
          items: { $ref: '#/components/schemas/BenchmarkRate' }
    BenchmarkRate:
      type: object
      required: [effectiveFrom, rate]
      properties:
        effectiveFrom: { type: string, format: date }
        rate: { type: string, examples: ['6.5000'] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        approvalId: { type: [string, 'null'], format: uuid }
    BenchmarkInput:
      type: object
      required: [code, name, source]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string, maxLength: 100 }
        source: { type: string, maxLength: 100 }
        external: { type: boolean, default: true }
    BenchmarkRateInput:
      type: object
      required: [rate, effectiveFrom]
      properties:
        rate: { type: [number, string], description: 'Percent per annum, 0 to 100, at most four decimals' }
        effectiveFrom: { type: string, format: date }
    LoanSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        loanNo: { type: string }
        customerName: { type: string }
        customerNo: { type: string }
        productCode: { type: string }
        status: { $ref: '#/components/schemas/LoanStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        principalOutstanding: { $ref: '#/components/schemas/Money' }
        overdueAmount: { $ref: '#/components/schemas/Money' }
        dpd: { type: integer, description: 'Days past due as of the last completed day-end (docs/lending-day-end.md); a receipt during the day can lower it, never raise it. 0 for a closed or cancelled loan' }
        assetClass:
          allOf: [ { $ref: '#/components/schemas/AssetClass' } ]
          description: 'As of the last completed day-end. A closed or cancelled loan is STANDARD unless it was an NPA at closure, which is kept'
        nextDueDate: { type: [string, 'null'], format: date }
        branch: { type: string }
        currentRate: { type: string, description: 'Rate now charged (Loan.rate is the rate as sanctioned)' }
        currentEmi: { type: [string, 'null'], description: 'Instalment now payable, after any rate change, restructuring or part-prepayment (Loan.emi is the EMI as sanctioned); null when the loan has no equated instalment' }
    Loan:
      allOf:
        - $ref: '#/components/schemas/LoanSummary'
        - type: object
          properties:
            custom: { $ref: '#/components/schemas/CustomValues' }
            customerId: { type: string, format: uuid }
            productVersion: { type: integer }
            rate: { type: string, description: 'Rate as sanctioned; see currentRate' }
            tenorMonths: { type: integer }
            repaymentMethod: { type: string }
            emi: { type: [string, 'null'], description: 'EMI as sanctioned; see currentEmi' }
            apr: { type: [string, 'null'] }
            openDate: { type: string, format: date }
            disbursedOn: { type: [string, 'null'], format: date }
            netDisbursed: { type: [string, 'null'] }
            npaSince: { type: [string, 'null'], format: date }
            provisionHeld: { type: string }
            kfsAcceptedAt: { type: [string, 'null'], format: date-time }
            externalRef: { type: [string, 'null'] }
            closedOn: { type: [string, 'null'], format: date }
            restructuredOn: { type: [string, 'null'], format: date }
            restructureCount: { type: integer }
            upgradeNotBefore: { type: [string, 'null'], format: date, description: 'Restructured and under monitoring: earliest end of the specified period' }
            frequency: { $ref: '#/components/schemas/RepaymentFrequency' }
            disbursedAmount: { type: string }
            undrawnAmount: { type: string, description: Sanctioned amount not yet disbursed }
            multipleDisbursements: { type: boolean }
            preEmi: { type: boolean }
            topUpAllowed: { type: boolean }
            overrideClass: { type: [string, 'null'], description: 'Manual NPA override: the class the account is held at or below' }
            overrideUntil: { type: [string, 'null'], format: date }
            benchmarkCode: { type: [string, 'null'] }
            spread: { type: [string, 'null'] }
            nextRateReset: { type: [string, 'null'], format: date }
    LoanSchedule:
      type: object
      properties:
        demands:
          type: array
          items:
            type: object
            properties:
              instalmentNo: { type: integer }
              dueDate: { type: string, format: date }
              principalDue: { type: string }
              interestDue: { type: string }
              principalPaid: { type: string }
              interestPaid: { type: string }
              principalRescheduled: { type: string, description: Unpaid principal moved into the restructured schedule }
              interestCapitalised: { type: string, description: Unpaid interest capitalised on restructuring }
        charges:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
              kind: { type: string, enum: [FEE, PENAL] }
              date: { type: string, format: date }
              amount: { type: string }
              paid: { type: string }
              waived: { type: string }
              unpaid: { type: string }
        future: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
        accruedInterest: { type: string }
        advance: { type: string }
    LoanTxn:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string, description: 'EOD (a day-end entry) is listed only with dayEnd=true', examples: [DISBURSEMENT, REPAYMENT, PREPAYMENT, PRECLOSURE, CANCELLATION, FEE_CHARGE, WAIVER, REVERSAL, FREEZE, AMENDMENT, RESTRUCTURE, EOD] }
        valueDate: { type: string, format: date }
        businessDate: { type: string, format: date }
        amount: { type: [string, 'null'] }
        summary: { type: string }
        reversedBy: { type: [string, 'null'], format: uuid }
        reverses: { type: [string, 'null'], format: uuid }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    AmendmentRequest:
      type: object
      required: [kind]
      description: Fields used depend on kind; reason is required when proposing.
      properties:
        kind: { type: string, enum: [RATE_CHANGE, TENURE_CHANGE, EMI_CHANGE, DUE_DAY_CHANGE, MATURITY_CHANGE] }
        newMaturityDate: { type: [string, 'null'], format: date, description: 'MATURITY_CHANGE: the last instalment falls due in this month, on the loan''s due day; the EMI is recomputed' }
        newRatePercent: { type: [number, string], description: 'RATE_CHANGE: new annual rate, within the product band' }
        rateOption:
          type: string
          enum: [KEEP_EMI_CHANGE_TENURE, KEEP_TENURE_CHANGE_EMI, CHANGE_BOTH]
          description: 'RATE_CHANGE: the borrower''s choice (RBI 18-Aug-2023)'
        remainingInstalments: { type: integer, minimum: 1, maximum: 480, description: 'TENURE_CHANGE, or CHANGE_BOTH: instalments still to be demanded' }
        newEmi: { type: [number, string], description: 'EMI_CHANGE, or CHANGE_BOTH instead of remainingInstalments' }
        newDueDay: { type: integer, minimum: 1, maximum: 31, description: 'DUE_DAY_CHANGE: day of month; 31 = month end' }
        reason: { type: string }
    AmendmentFigures:
      type: object
      properties:
        rateBefore: { type: string }
        rateAfter: { type: string }
        emiBefore: { $ref: '#/components/schemas/Money' }
        emiAfter: { $ref: '#/components/schemas/Money' }
        remainingBefore: { type: integer }
        remainingAfter: { type: integer }
        nextDueBefore: { type: string, format: date }
        nextDueAfter: { type: string, format: date }
        maturityBefore: { type: string, format: date }
        maturityAfter: { type: string, format: date }
        interestBefore: { $ref: '#/components/schemas/Money' }
        interestAfter: { $ref: '#/components/schemas/Money' }
        brokenPeriodInterest: { $ref: '#/components/schemas/Money' }
    AmendmentPreview:
      allOf:
        - $ref: '#/components/schemas/AmendmentFigures'
        - type: object
          properties:
            asOf: { type: string, format: date }
            kind: { type: string }
            principal: { $ref: '#/components/schemas/Money' }
            accruedInterest: { type: string, description: 'Interest accrued since the last due date, carried into the next instalment' }
            schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
            currentSchedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
    RestructureTerms:
      type: object
      required: [remainingInstalments, overdueInterest]
      description: Overdue principal is always rescheduled. A separate funded-interest term loan (FITL) is not offered.
      properties:
        newRatePercent: { type: [number, string, 'null'], description: Omit to keep the current rate }
        remainingInstalments: { type: integer, minimum: 1, maximum: 480 }
        principalMoratoriumMonths: { type: integer, minimum: 0, default: 0 }
        overdueInterest: { type: string, enum: [CAPITALISE, KEEP_AS_ARREARS] }
        reason: { type: string, description: Required when proposing }
    RestructureOption:
      type: object
      properties:
        newRatePercent: { type: [string, 'null'] }
        remainingInstalments: { type: integer }
        principalMoratoriumMonths: { type: integer }
        overdueInterestTreatment: { type: string, enum: [CAPITALISE, KEEP_AS_ARREARS] }
        classBefore: { $ref: '#/components/schemas/AssetClass' }
        classAfter: { $ref: '#/components/schemas/AssetClass' }
        principalBefore: { $ref: '#/components/schemas/Money' }
        overduePrincipalRescheduled: { $ref: '#/components/schemas/Money' }
        overdueInterest: { $ref: '#/components/schemas/Money' }
        interestCapitalised: { $ref: '#/components/schemas/Money' }
        arrearsKept: { $ref: '#/components/schemas/Money' }
        principalAfter: { $ref: '#/components/schemas/Money' }
        rateBefore: { type: string }
        rateAfter: { type: string }
        emiBefore: { $ref: '#/components/schemas/Money' }
        emiAfter: { $ref: '#/components/schemas/Money' }
        remainingBefore: { type: integer }
        remainingAfter: { type: integer }
        maturityBefore: { type: string, format: date }
        maturityAfter: { type: string, format: date }
        interestBefore: { $ref: '#/components/schemas/Money' }
        interestAfter: { $ref: '#/components/schemas/Money' }
        npvBefore: { $ref: '#/components/schemas/Money' }
        npvAfter: { $ref: '#/components/schemas/Money' }
        npvLoss: { type: string, description: 'NPV before minus after at the contract rate (monthly periods): the lender''s sacrifice' }
        upgradeNotBefore: { type: string, format: date, description: Earliest end of the specified period }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleRow' } }
    RestructureSimulation:
      type: object
      properties:
        asOf: { type: string, format: date }
        current:
          type: object
          properties:
            rate: { type: string }
            emi: { $ref: '#/components/schemas/Money' }
            remainingInstalments: { type: integer }
            nextDueDate: { type: [string, 'null'], format: date }
            principalOutstanding: { $ref: '#/components/schemas/Money' }
            assetClass: { $ref: '#/components/schemas/AssetClass' }
            dpd: { type: integer }
        options: { type: array, items: { $ref: '#/components/schemas/RestructureOption' } }
    LoanAmendment:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        txnId: { type: string, format: uuid }
        kind: { type: string, enum: [RATE_CHANGE, TENURE_CHANGE, EMI_CHANGE, DUE_DAY_CHANGE, MATURITY_CHANGE, SANCTION_CHANGE, NPA_OVERRIDE, RESTRUCTURE] }
        parameters: { type: object, additionalProperties: true, description: The request as proposed }
        emiBefore: { type: string }
        emiAfter: { type: string }
        tenureBefore: { type: integer, description: Instalments still to be demanded }
        tenureAfter: { type: integer }
        rateBefore: { type: string }
        rateAfter: { type: string }
        maturityBefore: { type: [string, 'null'], format: date }
        maturityAfter: { type: string, format: date }
        interestBefore: { type: string }
        interestAfter: { type: string }
        proposedFigures: { type: [object, 'null'], additionalProperties: true, description: What the checker saw }
        appliedFigures: { type: object, additionalProperties: true, description: What was applied }
        differsFromProposal: { type: boolean }
        approvalId: { type: string, format: uuid }
        madeBy: { type: string }
        checkedBy: { type: string }
        businessDate: { type: string, format: date }
        reason: { type: [string, 'null'] }
        reversedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    PreclosureQuote:
      type: object
      properties:
        asOf: { type: string, format: date }
        principal: { type: string }
        overdueDues: { type: string }
        accruedInterest: { type: string }
        charges: { type: string }
        foreclosureFee: { type: string }
        advanceAdjusted: { type: string }
        total: { type: string }
    ReportDefinition:
      type: object
      required: [code, name, parameters, permission, outputFormat]
      properties:
        code: { type: string, examples: [LOAN_BOOK] }
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          additionalProperties: true
          description: 'JSON Schema of the run parameters: `{"type":"object","properties":{…},"required":[…]}`; dates are `format: date`'
        permission: { type: string, examples: ['report:run', 'bureau:export'] }
        outputFormat: { type: string, enum: [CSV, UCRF] }
        containsPersonalData: { type: boolean, description: Unmasked personal data (the bureau file) }
        allBranchesOnly: { type: boolean, description: Needs all-branch access }
        schedule: { type: [string, 'null'], description: 'Cron expression recorded for the scheduler, which is not built yet' }
    ReportRunRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: { type: string }
          examples: [ { from: '2026-09-01', to: '2026-09-30' } ]
    ReportRun:
      type: object
      required: [id, reportCode, requestedBy, requestedAt, businessDate, status]
      properties:
        id: { type: string, format: uuid }
        reportCode: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        businessDate: { type: string, format: date }
        parameters: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        rowCount: { type: [integer, 'null'], description: 'Data rows in the file (accounts, for the bureau file)' }
        rejectedCount: { type: integer, description: 'Accounts left out of a bureau file; listed by the download call with part=rejections' }
        fileName: { type: [string, 'null'] }
        contentType: { type: [string, 'null'] }
        bytes: { type: [integer, 'null'], format: int64 }
        error: { type: [string, 'null'] }
        finishedAt: { type: [string, 'null'], format: date-time }
    DpdBucket:
      type: object
      required: [bucket, loans, amount]
      properties:
        bucket: { type: string, enum: ['0', '1-30', '31-60', '61-90', '91-180', '181-365', '>365'] }
        loans: { type: integer }
        amount: { type: string, description: Principal outstanding }
    Dashboard:
      type: object
      description: Money is a decimal string. A percentage is null when it has no base (no advances, nothing due).
      required: [activeLoans, portfolioOutstanding, dpdBuckets, pendingApprovals]
      properties:
        businessDate: { type: [string, 'null'], format: date }
        activeLoans: { type: integer }
        portfolioOutstanding: { type: string, description: Principal outstanding of live loans (gross advances) }
        overdueAmount: { type: string }
        grossNpa: { type: string, description: Principal outstanding of non-performing loans }
        npaLoans: { type: integer }
        npaPercent: { type: [string, 'null'], description: 'Gross NPA / gross advances, in percent' }
        disbursedToday: { type: string }
        disbursedMtd: { type: string }
        disbursementsToday: { type: integer }
        disbursementsMtd: { type: integer }
        collectedToday: { type: string }
        collectedMtd: { type: string }
        demandMtd: { type: string, description: Instalments that fell due this month }
        collectedAgainstDemandMtd: { type: string }
        collectionEfficiencyMtd: { type: [string, 'null'], description: 'Collected against this month''s instalments / their amount, in percent' }
        dpdBuckets: { type: array, items: { $ref: '#/components/schemas/DpdBucket' } }
        pendingApprovals: { type: integer }
        lastEod:
          type: [object, 'null']
          properties:
            businessDate: { type: string, format: date }
            status: { type: string, enum: [RUNNING, COMPLETED, COMPLETED_WITH_EXCEPTIONS, FAILED] }
            finishedAt: { type: [string, 'null'], format: date-time }
        openEodExceptions: { type: integer, description: Shown to all-branch users; 0 for others }
    IntegrationRecord:
      type: object
      description: A record of the integration module. Money is a decimal string; account numbers appear only masked.
      additionalProperties: true
    ProviderConfigInput:
      type: object
      required: [kind, provider]
      properties:
        kind: { type: string, enum: [PAYOUT, COLLECTION, MANDATE, SMS, EMAIL] }
        provider: { type: string, examples: [SIMULATOR] }
        settings: { type: object, additionalProperties: { type: string } }
        secrets:
          type: object
          description: Write-only. Never returned by any API.
          additionalProperties: { type: string }
    SimulatedCallback:
      type: object
      required: [kind, reference, status]
      properties:
        kind: { type: string, enum: [payout, collection, mandate] }
        reference: { type: string, description: 'Payout reference, order reference or mandate reference' }
        status: { type: string, description: 'Payout - SUCCESS, FAILED, RETURNED; collection - PAID, FAILED; mandate - ACTIVE, REJECTED, CANCELLED' }
        amount: { $ref: '#/components/schemas/Money' }
        reasonCode: { type: string }
        reason: { type: string }
        eventId: { type: string, description: 'Repeat an id to test replay protection' }
    BeneficiaryInput:
      type: object
      required: [holderName, accountNumber, ifsc]
      properties:
        holderName: { type: string, maxLength: 100 }
        accountNumber: { type: string, pattern: '^[A-Za-z0-9]{6,35}$' }
        ifsc: { type: string, pattern: '^[A-Z]{4}0[A-Z0-9]{6}$' }
    CollectionOrderInput:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        methods: { type: array, items: { type: string, enum: [UPI, CARD, NETBANKING] } }
        returnUrl: { type: string, format: uri }
    PaymentResolution:
      type: object
      required: [note]
      properties:
        loanId: { type: string, format: uuid }
        refund: { type: boolean }
        note: { type: string }
    MandateInput:
      type: object
      required: [holderName, accountNumber, ifsc, maxAmount, startDate]
      properties:
        holderName: { type: string, maxLength: 100 }
        accountNumber: { type: string, pattern: '^[A-Za-z0-9]{6,35}$' }
        ifsc: { type: string, pattern: '^[A-Z]{4}0[A-Z0-9]{6}$' }
        accountType: { type: string, enum: [SB, CA, CC, OT], default: SB }
        maxAmount: { $ref: '#/components/schemas/Money' }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY, AS_PRESENTED], default: MONTHLY }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sponsorBankCode: { type: string }
        utilityCode: { type: string }
    MandateStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SUBMITTED, ACTIVE, REJECTED, SUSPENDED, CANCELLED, EXPIRED] }
        umrn: { type: string, pattern: '^[A-Z0-9]{20}$' }
        rejectCode: { type: string }
        rejectReason: { type: string }
    WebhookEndpointInput:
      type: object
      required: [name, url, eventTypes]
      properties:
        name: { type: string, maxLength: 80 }
        url: { type: string, format: uri, description: 'https, public DNS name, port 443 or 8443' }
        eventTypes:
          type: array
          items: { type: string, enum: [loan.disbursed, payment.received, payment.bounced, loan.closed, loan.npa, mandate.status, payout.status] }
    ActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string }
    ApiClientInput:
      type: object
      required: [clientId, name, scopes, homeBranch]
      properties:
        clientId: { type: string, description: 'Lower-case letters, digits and hyphens; stored with the prefix ext-' }
        name: { type: string, maxLength: 80 }
        scopes: { type: array, items: { type: string } }
        homeBranch: { type: string }
        allBranches: { type: boolean, default: false }
    ApiClientScopes:
      type: object
      required: [scopes]
      properties:
        scopes: { type: array, items: { type: string } }
    MessageTemplateInput:
      type: object
      required: [code, channel, body]
      properties:
        code: { type: string, enum: [LOAN_DISBURSED, PAYMENT_RECEIVED, PAYMENT_BOUNCED, DUE_REMINDER, NOC_ISSUED, RATE_RESET] }
        channel: { type: string, enum: [SMS, EMAIL] }
        language: { type: string, default: en }
        category: { type: string, enum: [TRANSACTIONAL, SERVICE, PROMOTIONAL], default: TRANSACTIONAL }
        subject: { type: string, description: 'E-mail only' }
        body: { type: string, description: 'Text with {{placeholders}}' }
        dltEntityId: { type: string, description: 'SMS - principal entity id on the DLT platform' }
        dltTemplateId: { type: string, description: 'SMS - registered content template id' }
        dltHeader: { type: string, description: 'SMS - registered header (sender id)' }
        status: { type: string, enum: [ACTIVE, RETIRED], default: ACTIVE }
    MessageOptOut:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [SMS, EMAIL] }
        optOut: { type: boolean, default: true }
        source: { type: string }
    # ---- P2-7 platform completion ----
    CustomValues:
      type: object
      description: >-
        The tenant's custom fields by key (see `GET /api/v1/custom-fields`). An unknown key, a value of the wrong type
        and a missing required field are refused with 422. Personal-data fields are returned masked.
      additionalProperties: true
    CustomFieldInput:
      type: object
      required: [entity, key, label, dataType]
      properties:
        entity: { type: string, enum: [CUSTOMER, LOAN_ACCOUNT, LOAN_PRODUCT] }
        key: { type: string, pattern: '^[a-z][A-Za-z0-9]{1,39}$' }
        label: { type: string, maxLength: 80 }
        dataType: { type: string, enum: [TEXT, NUMBER, DATE, BOOLEAN, ENUM] }
        enumType: { type: [string, 'null'], description: Enumeration type that lists the choices; ENUM only }
        widget: { type: [string, 'null'], enum: [TEXT, TEXTAREA, NUMBER, DATE, CHECKBOX, SELECT, RADIO, null] }
        required: { type: boolean, default: false }
        regex: { type: [string, 'null'], description: TEXT only; the whole value must match }
        min: { type: [number, 'null'], description: 'NUMBER: lowest value; TEXT: shortest length' }
        max: { type: [number, 'null'], description: 'NUMBER: highest value; TEXT: longest length' }
        pii: { type: boolean, default: false, description: 'Personal data; TEXT only; stored encrypted and returned masked' }
        active: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }
    CustomField:
      type: object
      properties:
        entity: { type: string }
        key: { type: string }
        label: { type: string }
        dataType: { type: string }
        enumType: { type: [string, 'null'] }
        widget: { type: string }
        required: { type: boolean }
        regex: { type: [string, 'null'] }
        min: { type: [string, 'null'] }
        max: { type: [string, 'null'] }
        pii: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    LoanProductCustom:
      type: object
      properties:
        productCode: { type: string }
        custom: { $ref: '#/components/schemas/CustomValues' }
    Note:
      type: object
      properties:
        note: { type: string }
    DeferredReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        loanId: { type: string, format: uuid }
        loanNo: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        mode: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string }
        cutoffBusinessDate: { type: string, format: date, description: The business date that was being closed }
        expectedPostingDate: { type: string, format: date }
        status: { type: string, enum: [PENDING, APPLIED, FAILED, CANCELLED] }
        postingDate: { type: [string, 'null'], format: date }
        valueDate: { type: [string, 'null'], format: date, description: Always the posting date }
        loanTxnId: { type: [string, 'null'], format: uuid }
        attempts: { type: integer }
        error: { type: [string, 'null'] }
        resolvedBy: { type: [string, 'null'] }
        resolutionNote: { type: [string, 'null'] }
    DeferredReceiptAccepted:
      type: object
      properties:
        status: { type: string, enum: [ACCEPTED_FOR_NEXT_BUSINESS_DATE] }
        receipt: { $ref: '#/components/schemas/DeferredReceipt' }
    LoginSession:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        ipAddress: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        lastAccessAt: { type: [string, 'null'], format: date-time }
        clients: { type: array, items: { type: string } }
        current: { type: boolean, description: The session this request's token belongs to }
    Job:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [REPORT, DASHBOARD_REFRESH, KYC_EXPIRY, CONSENT_EXPIRY, EXPORT_CLEANUP, USAGE_SNAPSHOT, DEFERRED_RECEIPTS] }
        schedule: { type: [string, 'null'], description: Six-field cron in IST }
        enabled: { type: boolean }
        parameters: { type: object, additionalProperties: true }
        builtIn: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        runnable: { type: boolean }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/JobRun'
            - type: 'null'
    JobRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobCode: { type: string }
        origin: { type: string, enum: [SCHEDULE, MANUAL] }
        scheduledFor: { type: [string, 'null'], format: date-time }
        requestedBy: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        processed: { type: integer }
        failed: { type: integer }
        error: { type: [string, 'null'] }
        artifact:
          type: [object, 'null']
          additionalProperties: true
          description: What the run produced. A scheduled report carries `reportRunId` and `delivery` (PENDING_PROVIDER until e-mail is built).
    JobScheduleInput:
      type: object
      properties:
        schedule: { type: [string, 'null'], examples: ['0 0 6 1 * *'] }
        enabled: { type: boolean }
        parameters:
          type: object
          additionalProperties: true
          description: >-
            Report jobs take `period` (BUSINESS_DATE, PREVIOUS_DAY, MONTH_TO_DATE, PREVIOUS_MONTH), `parameters` (the
            report's own, without dates) and `emailTo`. Other jobs take none.
    DashboardTrendPoint:
      type: object
      properties:
        businessDate: { type: string, format: date }
        activeLoans: { type: integer }
        portfolioOutstanding: { $ref: '#/components/schemas/Money' }
        overdueAmount: { $ref: '#/components/schemas/Money' }
        overdueLoans: { type: integer }
        grossNpa: { $ref: '#/components/schemas/Money' }
        npaLoans: { type: integer }
        disbursed: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
        pendingApprovals: { type: integer }
        refreshedAt: { type: string, format: date-time }
    SupportAccessRequest:
      type: object
      required: [tenant, reason, ticket]
      properties:
        tenant: { type: string }
        reason: { type: string, minLength: 10, maxLength: 500 }
        ticket: { type: string }
        durationMinutes: { type: integer, minimum: 15, maximum: 480, default: 60 }
        scope: { type: string, enum: [READ_ONLY], default: READ_ONLY }
    SupportAccess:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant: { type: string, description: Present in control-plane responses }
        engineer: { type: string }
        reason: { type: string }
        ticket: { type: string }
        scope: { type: string }
        durationMinutes: { type: integer }
        requestedAt: { type: string, format: date-time }
        status: { type: string, enum: [REQUESTED, APPROVED, REJECTED, REVOKED, EXPIRED, LAPSED, UNKNOWN] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokeReason: { type: [string, 'null'] }
    UsageDay:
      type: object
      properties:
        tenant: { type: string }
        day: { type: string, format: date }
        activeLoans: { type: [integer, 'null'] }
        activeCustomers: { type: [integer, 'null'] }
        staffUsers: { type: [integer, 'null'] }
        apiCalls: { type: integer }
        documentBytes: { type: [integer, 'null'] }
        databaseBytes: { type: [integer, 'null'] }
        storageBytes: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
    UsageMonth:
      type: object
      properties:
        tenant: { type: string }
        legalName: { type: string }
        edition: { type: string }
        month: { type: string }
        daysMeasured: { type: integer }
        peakActiveLoans: { type: [integer, 'null'] }
        closingActiveLoans: { type: [integer, 'null'] }
        peakActiveCustomers: { type: [integer, 'null'] }
        closingActiveCustomers: { type: [integer, 'null'] }
        peakStaffUsers: { type: [integer, 'null'] }
        apiCalls: { type: integer }
        peakStorageBytes: { type: [integer, 'null'] }
        closingStorageBytes: { type: [integer, 'null'] }
