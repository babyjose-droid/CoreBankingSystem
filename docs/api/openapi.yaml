        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/DocId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The document after rejection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Problem' }

