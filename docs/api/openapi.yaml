        schedule: { type: [string, 'null'], description: Six-field cron in IST }
        enabled: { type: boolean }
        parameters: { type: object, additionalProperties: true }
        builtIn: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        runnable: { type: boolean }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/JobRun'
            - type: 'null'
    JobRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobCode: { type: string }
        origin: { type: string, enum: [SCHEDULE, MANUAL] }
        scheduledFor: { type: [string, 'null'], format: date-time }
        requestedBy: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        processed: { type: integer }
        failed: { type: integer }
        error: { type: [string, 'null'] }
        artifact:
          type: [object, 'null']
          additionalProperties: true
          description: 'What the run produced. A scheduled report carries `reportRunId` and `delivery`: SENT (to `recipientsSent` internal recipients), NO_RECIPIENT, NOT_CONFIGURED (no mail relay), NO_INTERNAL_RECIPIENT (none on the tenant property mail.internal-domains), NOT_EMAILED (a credit-bureau file) or FAILED (`deliveryError`); `recipientsLeftOut` counts recipients outside the internal domains. Never addresses.'
    JobScheduleInput:
      type: object
      properties:
        schedule: { type: [string, 'null'], examples: ['0 0 6 1 * *'] }
        enabled: { type: boolean }
        parameters:
          type: object
          additionalProperties: true
          description: >-
            Report jobs take `period` (BUSINESS_DATE, PREVIOUS_DAY, MONTH_TO_DATE, PREVIOUS_MONTH), `parameters` (the
            report's own, without dates) and `emailTo` (a list of addresses). Every address must be on a domain of the tenant
            property `mail.internal-domains`, else 422 naming the domain (never the address). Other jobs take none.
    DashboardTrendPoint:
      type: object
