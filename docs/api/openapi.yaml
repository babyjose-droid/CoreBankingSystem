        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/simulations/disbursement:
    post:
      tags: [Lending]
      operationId: simulateLoanDisbursement
      summary: What a disbursement would do today - fees, interest deducted, net payout, schedule (nothing changes)
      description: >-
        For a SANCTIONED loan the first disbursement, for an ACTIVE loan the next tranche. Computed by the code that
        posts the disbursement; nothing is posted or stored. The same refusals apply (409 / 422).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: [number, string, 'null'], description: 'Default: all that is undrawn' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisbursementSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/simulations/transaction:
    post:
      tags: [Lending]
      operationId: simulateLoanTransaction
      summary: What a receipt, part-prepayment or pre-closure would do on a date (nothing changes)
      description: >-
        `onDate` is today or up to 366 days ahead: the day-ends until then (demands, accrual, penal charges,
        classification) are run on a copy first. The figures come from the engine code that posts the transaction;
        nothing is posted or stored. Restructure options are simulated by `/restructure/simulation`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionSimulationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/sanction-change/preview:
    post:
      tags: [Lending]
      operationId: previewLoanSanctionChange
      summary: Before/after of a change of the sanctioned amount (nothing changes)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionChangePreview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/sanction-change:
    post:
      tags: [Lending]
      operationId: proposeLoanSanctionChange
      summary: Propose a top-up, a reduction or the cancellation of the undrawn amount (maker-checker, entity LOAN_SANCTION_CHANGE)
      description: >-
        **Reduction** may only take away undrawn amount (never below what is disbursed); `cancelUndrawn` brings the
        sanctioned amount down to the amount disbursed, which starts the EMIs of a pre-EMI loan. **Top-up** in the
        same account needs a product with `topUpAllowed`, an amount within the product maximum and the customer's
        exposure limit, and a STANDARD account with no unpaid dues that is not under post-restructuring monitoring
        (409 otherwise: new money to a borrower in arrears would be evergreening). No money moves on approval: the
        extra amount is then paid out through `/disbursement`. One checker. Recorded in the amendment history
        (kind SANCTION_CHANGE); it cannot be reversed. Needs `loan:amend`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionChangeRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/npa-override:
    post:
      tags: [Lending]
      operationId: proposeLoanNpaOverride
      summary: Manual NPA mark - downgrade the account to an NPA class or hold it there (maker-checker, two checkers)
      description: >-
        Entity LOAN_NPA_OVERRIDE, action OVERRIDE. The override sets the worst class the account may be upgraded to
        until `until`: it can downgrade the account or hold it at its present NPA class, never upgrade it (409).
        A downgrade from a performing class moves unrealised interest to suspense. While it holds, day-end
        classification can make the class worse but not better; after it expires the normal rules apply. LOSS is
        permanent. Recorded in the amendment history (kind NPA_OVERRIDE); it cannot be reversed. Needs `loan:classify`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NpaOverrideRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/npa-override/release:
    post:
      tags: [Lending]
      operationId: proposeLoanNpaRelease
      summary: Un-mark - end a manual NPA override before its expiry (maker-checker, two checkers)
      description: >-
        Entity LOAN_NPA_OVERRIDE, action RELEASE. Refused (409) while the account has unpaid dues, when proposed
        and again when approved: an NPA is upgraded only when all arrears are cleared (RBI IRACP norms). Nothing is
        posted; the next day-end classifies the account by the normal rules. A LOSS classification cannot be
        released. Needs `loan:classify`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/repayments:
    post:
      tags: [Lending]
      operationId: repayLoan
      summary: Receipt appropriated per product sequence; any excess is kept as an advance
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                valueDate: { type: string, format: date }
                mode: { type: string, examples: [CASH, NACH, UPI, NEFT] }
                reference: { type: string }
      responses:
        '202':
          description: >-
            End of day has started (cut-off). The repayment of a straight-through client (`loan:stp`) is accepted and will
            be booked and valued on the next business date. Send it without `valueDate`. A staff posting gets 409 instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeferredReceiptAccepted' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/prepayments:
    post:
      tags: [Lending]
      operationId: prepayLoan
      summary: Part-prepayment; the schedule is rebuilt (reduce EMI or reduce tenure)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                mode: { type: string, enum: [REDUCE_EMI, REDUCE_TENURE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/preclosure-quote:
    get:
      tags: [Lending]
      operationId: getPreclosureQuote
      summary: Pre-closure amount today (the posting uses the same figures)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreclosureQuote' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/preclosure:
    post:
      tags: [Lending]
      operationId: precloseLoan
      summary: Close the loan; amount must equal the quote total
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/cancellation-quote:
    get:
      tags: [Lending]
      operationId: getCancellationQuote
      summary: Amount to exit within the cooling-off period
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { $ref: '#/components/schemas/Money' }
                  asOf: { type: string, format: date }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/cancellation:
    post:
      tags: [Lending]
      operationId: cancelLoan
      summary: Cooling-off exit (principal + interest for days used; disclosed fees retained)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges:
    post:
      tags: [Lending]
      operationId: chargeLoanFee
      summary: Charge a product fee (with GST) to the loan
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeCode]
              properties:
                feeCode: { type: string }
                base: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges/{chargeId}/waiver:
    post:
      tags: [Lending]
      operationId: waiveLoanCharge
      summary: Propose a waiver of an unpaid charge (maker-checker)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: chargeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                reason: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/transactions/{txnId}/reverse:
    post:
      tags: [Lending]
      operationId: reverseLoanTransaction
      summary: Propose reversal of a transaction and every later one; days since are replayed (maker-checker)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: txnId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/amendments/preview:
    post:
      tags: [Lending]
      operationId: previewLoanAmendment
      summary: Before/after figures and the new schedule for a rate, tenure, EMI, due-day or maturity-date change (nothing changes)
      description: >-
        Same engine as the posting. Rate resets follow RBI's 18-Aug-2023 circular on floating-rate EMI loans: the
        borrower keeps the EMI and changes the tenure, keeps the tenure and changes the EMI, or changes both. A
        tenure extension may not pass the product's maximum tenure and the EMI must cover the monthly interest.
        Extending the tenure or lowering the EMI of a borrower in arrears is refused (409): that is a restructure.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmendmentPreview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/amendments:
    get:
      tags: [Lending]
      operationId: listLoanAmendments
      summary: Amendment and restructure history (newest first)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoanAmendment' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Lending]
      operationId: proposeLoanAmendment
      summary: Propose an amendment (maker-checker, entity LOAN_AMENDMENT); applied on approval
      description: >-
        The approval re-runs the engine on the loan as it is then. If the figures differ from those proposed (the
        loan changed in between), the current figures are applied and both are kept in the history. Amendments move
        no money and can be reversed like any other loan transaction.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/restructure/simulation:
    post:
      tags: [Lending]
      operationId: simulateLoanRestructure
      summary: Compare up to three restructuring options (schedule, EMI, tenure, interest, NPV at the contract rate)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              properties:
                options:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { $ref: '#/components/schemas/RestructureTerms' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestructureSimulation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/restructure:
    post:
      tags: [Lending]
      operationId: proposeLoanRestructure
      summary: Propose a restructure (maker-checker with two checkers, entity LOAN_RESTRUCTURE)
      description: >-
        RBI Prudential Framework for Resolution of Stressed Assets (7-Jun-2019): a standard account is downgraded
        to sub-standard; an NPA keeps its class. The account can be upgraded only after the specified period (at
        least one year from the first payment under the new schedule and 10% of the principal repaid) with no
        default in that period and no arrears. A restructure cannot be reversed.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestructureTerms' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/freeze:
    post:
      tags: [Lending]
      operationId: freezeLoan
      summary: Block transactions (accrual continues)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/unfreeze:
    post:
      tags: [Lending]
      operationId: unfreezeLoan
      summary: Allow transactions again
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/kfs.pdf:
    get:
      tags: [Documents]
      operationId: getLoanKfsPdf
      summary: Key Facts Statement as PDF
      description: |
        The KFS stored at booking, laid out as in RBI's circular "Key Facts Statement (KFS) for Loans & Advances"
        (15-Apr-2024): Part 1 (interest rate and fees/charges), Part 2 (other qualitative information), the
        illustration of the APR computation and the repayment schedule. The APR is the one computed by the product
        at booking. Grievance officer and clause references come from the system properties `lender.*`; one that
        is not set prints as "[not configured]".
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/statement.pdf:
    get:
      tags: [Documents]
      operationId: getLoanStatementPdf
      summary: Statement of account as PDF
      description: |
        Opening and closing balance, every transaction with its principal / interest / charges split and the
        running outstanding, and the overdue summary with days past due. Built from the ledger entries on the
        loan account; day-end interest accruals between two transactions are shown as one line per month.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default: the disbursement date' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default: the business date; cannot be later' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: The loan has not been disbursed yet
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/schedule.pdf:
    get:
      tags: [Documents]
      operationId: getLoanSchedulePdf
      summary: Repayment schedule as PDF
      description: |
        Instalments fallen due with what was paid against each, and the instalments to come.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/documents/noc.pdf:
    get:
      tags: [Documents]
      operationId: getLoanNocPdf
      summary: No-objection (closure) letter as PDF
      description: |
        Issued only for a loan whose status is CLOSED.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: The loan is not closed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/loans/{id}/charges/{chargeId}/invoice.pdf:
    get:
      tags: [Documents]
      operationId: getFeeInvoicePdf
      summary: GST tax invoice for a fee as PDF
      description: |
        Supplier and recipient state, SAC 9971, taxable value, CGST + SGST (intra-state) or IGST (inter-state), and
        the invoice number from the GST_INVOICE number series. The invoice of a reversed fee is returned marked
        CANCELLED.
        Permission `loan:view`; the loan must be in the caller's branch scope (404 otherwise). Every generation is
        written to the audit log (action `DOCUMENT_GENERATED`), because the document holds personal data.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: chargeId
          in: path
          required: true
          schema: { type: string, pattern: '^[CD][0-9]{1,6}$' }
          description: The charge id shown on the loan (C1, C2 …), or D1, D2 … for the fees deducted from the disbursement
      responses:
        '200':
          description: 'The PDF, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '409':
          description: 'A penal charge (P…): penal charges carry no GST, so there is no invoice'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports:
    get:
      tags: [Reporting]
      operationId: listReports
      summary: Report catalogue
      description: |
        The reports the caller may run: those whose permission they hold (`report:run`; `bureau:export` for the
        credit bureau file).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportDefinition' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/{code}/runs:
    post:
      tags: [Reporting]
      operationId: runReport
      summary: Run a report now and store its file
      description: |
        Runs synchronously (for now), writes the rows as CSV (cells that start with `=`, `+`, `-` or `@` are
        neutralised) and stores the file; fetch it with the download call. The rows are limited to the caller's
        branch scope. A run that fails is returned with status `FAILED` and its error.

        `BUREAU_CONSUMER` produces the UCRF-style consumer bureau file instead of CSV. It needs `bureau:export`
        and all-branch access, and is the only report that contains unmasked personal data. Its layout has **not**
        been certified by any bureau: validate it against each bureau's format specification before submitting.

        Every run is written to the audit log (`REPORT_RUN`, or `BUREAU_EXPORT`).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,40}$' } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRunRequest' }
      responses:
        '201':
          description: The run (COMPLETED or FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRun' }
        '409':
          description: The bureau member code is not configured (system property `bureau.member-code`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/runs:
    get:
      tags: [Reporting]
      operationId: listReportRuns
      summary: Report runs, newest first
      description: The caller's own runs; every user's runs with `report:admin`. The file itself is never part of this list.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportRun' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/reports/runs/{id}/download:
    get:
      tags: [Reporting]
      operationId: downloadReportRun
      summary: The file of a completed run
      description: |
        Only for the user who ran the report, or a user with `report:admin`, and only while they hold the report's
        own permission (so `report:admin` alone never opens a bureau file). Every download is written to the audit
        log (`REPORT_DOWNLOAD`, or `BUREAU_DOWNLOAD`).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: part
          in: query
          schema: { type: string, enum: [rejections] }
          description: '`rejections`: the accounts left out of a bureau file, with the reason (CSV, no personal data)'
      responses:
        '200':
          description: 'The file, as a download (`Content-Disposition: attachment`, `Cache-Control: no-store`)'
          content:
            text/csv:
              schema: { type: string }
            text/plain:
              schema: { type: string, description: The UCRF-style bureau file (pipe-delimited) }
        '409':
          description: The run did not complete, or the stored file no longer matches its record
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
