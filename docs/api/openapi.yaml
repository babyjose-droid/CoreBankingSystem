              schema: { $ref: '#/components/schemas/VoucherUploadResult' }
        '413': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/gl/vouchers/{id}/reverse:
    post:
      tags: [Ledger]
