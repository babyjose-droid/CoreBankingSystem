  /api/v1/eod/runs:
    get:
      tags: [EOD]
      operationId: listEodRuns
      summary: List eod runs
      responses:
        '200':
          description: Most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EodRun' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [EOD]
      operationId: startEod
      summary: Start end-of-day for the current business date (single instance per tenant)
      description: >-
        Pending dated approvals (vouchers, disbursements, waivers, reversals, amendments, restructures …) do not stop
        the run: they stay pending, apply on the business date on which they are approved, and are listed in the run's
        warnings. With the system property eod.block-on-pending-approvals = true the start is refused with 409 naming
        the count instead.
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EodRun' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/eod/pending-approvals:
    get:
      tags: [EOD]
      operationId: getEodPendingApprovals
      summary: Dated approvals still pending, as the end-of-day start sees them
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EodPendingApprovals' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/eod/runs/{runId}:
    get:
      tags: [EOD]
      operationId: getEodRun
      summary: Get eod run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Run with steps and exceptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EodRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/eod/runs/{runId}/restart:
    post:
      tags: [EOD]
      operationId: restartEod
      summary: Restart eod
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '202':
          description: Restarted from the first incomplete step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EodRun' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/eod/schedule:
    get:
      tags: [EOD]
      operationId: getEodSchedule
      summary: Get eod schedule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EodSchedule' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [EOD]
      operationId: proposeEodSchedule
      summary: Propose eod schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EodSchedule' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Problem' }

