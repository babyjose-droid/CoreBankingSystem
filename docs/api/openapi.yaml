        reason: { type: [string, 'null'], enum: [DEPOSITOR_REQUEST, DEATH, EMERGENCY_EXPENSE, CRITICAL_ILLNESS, null], description: Before maturity. Default DEPOSITOR_REQUEST }
        payTo: { $ref: '#/components/schemas/DepositPayoutInput' }
        note: { type: [string, 'null'], maxLength: 500, description: 'Required for death, an emergency or illness: what supports it' }
    RenewalConsentInput:
      type: object
      required: [reference, receivedOn]
      properties:
        reference: { type: string, maxLength: 60, description: The depositor's signed request }
        receivedOn: { type: string, format: date }
    MaturityInstructionInput:
      type: object
      required: [maturityInstruction]
      properties:
        maturityInstruction: { type: string, enum: [PAY_OUT, RENEW_PRINCIPAL, RENEW_WITH_INTEREST] }
        consent: { oneOf: [ { $ref: '#/components/schemas/RenewalConsentInput' }, { type: 'null' } ], description: A deposit-taking NBFC's renewal only }
    TermDepositRenewalInput:
      type: object
      required: [instruction]
      properties:
        instruction: { type: string, enum: [RENEW_PRINCIPAL, RENEW_WITH_INTEREST] }
        consent: { oneOf: [ { $ref: '#/components/schemas/RenewalConsentInput' }, { type: 'null' } ] }
    DepositMaturity:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountNo: { type: string }
        status: { type: string, enum: [ACTIVE, MATURED] }
        branchCode: { type: string }
        customerNo: { type: string }
        customerName: { type: string }
        productCode: { type: string }
        principal: { type: string }
        ratePercent: { type: string }
        startDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        maturityInstruction: { type: string }
        payoutTo: { type: string }
        payoutAccountNo: { type: [string, 'null'] }
        payoutBankAccountMasked: { type: [string, 'null'] }
        balance: { type: string }
        expectedAmount: { type: string, description: The maturity value on the terms }
        noticeOn: { type: [string, 'null'], format: date }
        consentReference: { type: [string, 'null'] }
        waitingBecause: { type: [string, 'null'], description: 'A MATURED deposit: why the day-end could not pay or renew it' }
    TermDepositTerms:
      type: object
      description: The terms frozen at booking, with figures from the same calculation as the preview.
      properties:
        principal: { type: string }
        tenureMonths: { type: integer }
        tenureDays: { type: integer }
        bookedOn: { type: string, format: date }
        startDate: { type: [string, 'null'], format: date, description: The funding date; null until the deposit is funded }
        maturityDate: { type: [string, 'null'], format: date }
        ratePercent: { type: string }
        cardRatePercent: { type: string }
        cardFromAmount: { type: string }
        cardFromMonths: { type: integer }
        cardFromDays: { type: integer }
        addOns: { type: array, items: { $ref: '#/components/schemas/DepositAddOnGiven' } }
        interestPeriodMonths: { type: integer }
        cumulative: { type: boolean }
        recurring: { type: boolean, description: 'A recurring deposit (P4-5): principal is the monthly instalment; totalInterest and maturityValue assume every instalment is paid on time' }
        dayCount: { type: string }
        rounding: { type: string }
        tdsApplicable: { type: boolean }
        prematureAllowed: { type: boolean }
        prematurePenaltyPercent: { type: [string, 'null'] }
        prematureMinDays: { type: [integer, 'null'] }
        payoutTo: { type: string, enum: [CASA, BANK_ACCOUNT] }
        payoutAccountId: { type: [string, 'null'] }
        payoutAccountNo: { type: [string, 'null'] }
        maturityInstruction: { type: string, enum: [PAY_OUT, RENEW_PRINCIPAL, RENEW_WITH_INTEREST] }
        fundingSource: { type: [string, 'null'], enum: [ACCOUNT, CASH, BANK_TRANSFER, GATEWAY, null], description: GATEWAY - paid through a payment link (P4-2b) }
        fundingAccountNo: { type: [string, 'null'] }
        fundingReference: { type: [string, 'null'] }
        payoutBankAccountMasked: { type: [string, 'null'], description: Recorded at funding }
        payoutBankIfsc: { type: [string, 'null'] }
        funded: { type: boolean }
        figuresFrom: { type: string, format: date, description: 'The start date of the figures below: the funding date, or the business date while the deposit is not funded' }
        figuresMaturityDate: { type: string, format: date }
        totalInterest: { $ref: '#/components/schemas/Money' }
        maturityValue: { $ref: '#/components/schemas/Money' }
    ChequeBookInput:
      type: object
      properties:
        leaves: { type: [integer, 'null'], enum: [10, 25, 50, 100, null], description: Default 25 }
    ChequeStopInput:
      type: object
      required: [fromLeaf, reason]
      properties:
        fromLeaf: { type: integer }
        toLeaf: { type: [integer, 'null'], description: The last cheque of the run; none for one cheque. At most 100 }
        reason: { type: string, maxLength: 500 }
    ChequePresentmentInput:
      type: object
      required: [accountNo, leafNo, amount, chequeDate, payee, presentingBank]
      properties:
        accountNo: { type: string }
        leafNo: { type: integer }
        amount: { type: [number, string] }
        chequeDate: { type: string, format: date }
        payee: { type: string, maxLength: 200 }
        presentingBank: { type: string, maxLength: 100 }
    ChequePresentmentOutcome:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PAID, RETURNED] }
        returnReason: { oneOf: [ { $ref: '#/components/schemas/ChequeReturnReason' }, { type: 'null' } ] }
        returnReasonText: { type: [string, 'null'] }
        movementId: { type: [string, 'null'], format: uuid }
    ChequeReturnReason:
      type: string
      enum: [NO_SUCH_ACCOUNT, ACCOUNT_CLOSED, NOT_ISSUED, ALREADY_PAID, PAYMENT_STOPPED, POST_DATED, STALE, ACCOUNT_FROZEN, ACCOUNT_INOPERATIVE, AMOUNT_HELD, INSUFFICIENT_FUNDS]
    ChequeDepositInput:
      type: object
      required: [chequeNo, draweeIfsc, drawerName, amount, chequeDate]
      properties:
        chequeNo: { type: string, pattern: '^[0-9]{6}$' }
        draweeIfsc: { type: string, description: The IFSC of the bank the cheque is drawn on }
        drawerName: { type: string, maxLength: 200 }
        amount: { type: [number, string] }
        chequeDate: { type: string, format: date }
    ChequeSettleInput:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [CLEARED, RETURNED] }
        reason: { type: [string, 'null'], maxLength: 200, description: 'RETURNED only, and then required' }
    ChequeDeposit:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountNo: { type: string }
        chequeNo: { type: string }
        draweeIfsc: { type: string }
        drawerName: { type: string }
        amount: { type: string }
        chequeDate: { type: string, format: date }
        lodgedOn: { type: string, format: date }
        status: { type: string, enum: [IN_CLEARING, CLEARED, RETURNED] }
        settledOn: { type: [string, 'null'], format: date }
        returnReason: { type: [string, 'null'] }
    CasaCheques:
      type: object
      properties:
        chequeFacility: { type: boolean, description: "Whether the account's product has the cheque facility" }
        books:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              bookNo: { type: string }
              firstLeaf: { type: integer }
              lastLeaf: { type: integer }
              leaves: { type: integer }
              issuedOn: { type: string, format: date }
              issuedBy: { type: string }
              unused: { type: integer }
        leaves:
          type: array
          description: The leaves stopped or paid, newest first
          items:
            type: object
            properties:
              leafNo: { type: integer }
              status: { type: string, enum: [UNUSED, STOPPED, PAID] }
              stoppedOn: { type: [string, 'null'], format: date }
              stopReason: { type: [string, 'null'] }
              paidOn: { type: [string, 'null'], format: date }
        presented:
          type: array
          description: The latest 100 cheques presented on the account, paid or returned
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              leafNo: { type: integer }
              amount: { type: string }
              chequeDate: { type: string, format: date }
              payee: { type: string }
              presentingBank: { type: string }
              presentedOn: { type: string, format: date }
              status: { type: string, enum: [PAID, RETURNED] }
              returnReason: { type: [string, 'null'] }
              returnReasonText: { type: [string, 'null'] }
        paidIn: { type: array, items: { $ref: '#/components/schemas/ChequeDeposit' }, description: The latest 100 cheques paid in }
    ReactivationInput:
      type: object
      required: [kycReference, reason]
      properties:
        kycReference: { type: string, maxLength: 100, description: The KYC record updated for the reactivation or the claim }
        reason: { type: string, maxLength: 500 }
    DormancyList:
      type: object
      properties:
        asOf: { type: string, format: date }
        applies: { type: boolean }
        reviewMonths: { type: integer }
        inoperativeMonths: { type: integer }
        unclaimedYears: { type: integer }
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string, format: uuid }
              accountNo: { type: string }
              family: { type: string, enum: [CASA, TERM_DEPOSIT] }
              productCode: { type: string }
              branchCode: { type: string }
              customerNo: { type: string }
              customerName: { type: string }
              balance: { type: string }
              lastOperated: { type: string, format: date, description: 'The last customer movement; for a term deposit, its maturity' }
              stage: { type: string, enum: [REVIEW, INOPERATIVE, UNCLAIMED] }
              inoperativeSince: { type: [string, 'null'], format: date }
              inoperativeOn: { type: [string, 'null'], format: date }
              unclaimedOn: { type: [string, 'null'], format: date }
              unclaimedTransferredOn: { type: [string, 'null'], format: date }
              unclaimedAmount: { type: [string, 'null'] }
    NetOwnedFundInput:
      type: object
      required: [amount, asOf, reference]
      properties:
        amount: { type: [number, string] }
        asOf: { type: string, format: date, description: 'The date of the audited balance sheet; one per date, not after the business date' }
        reference: { type: string, maxLength: 200 }
    NetOwnedFund:
      type: object
      properties:
        applies: { type: boolean }
        multiple: { type: [string, 'null'] }
        netOwnedFund: { type: [string, 'null'], description: The latest recorded; null when none is }
        outstanding: { type: string }
        cap: { type: [string, 'null'] }
        headroom: { type: [string, 'null'] }
        usedPercent: { type: [string, 'null'] }
        history:
          type: array
          items:
            type: object
            properties:
              asOf: { type: string, format: date }
              amount: { type: string }
              reference: { type: string }
              recordedBy: { type: string }
    DepositRegister:
      type: object
      properties:
        asOf: { type: string, format: date }
        count: { type: integer }
        total: { type: string }
        netOwnedFund: { $ref: '#/components/schemas/NetOwnedFund' }
        deposits:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string, format: uuid }
              accountNo: { type: string }
              branchCode: { type: string }
              status: { type: string, enum: [ACTIVE, MATURED] }
              productCode: { type: string }
              productType: { type: string }
              customerNo: { type: string }
              depositorName: { type: string }
              holders: { type: integer }
              principal: { type: string }
              ratePercent: { type: string }
              tenureMonths: { type: integer }
              tenureDays: { type: integer }
              startDate: { type: [string, 'null'], format: date }
              maturityDate: { type: [string, 'null'], format: date }
              maturityInstruction: { type: string }
              balance: { type: string }
              nominee: { type: boolean }
              lien: { type: boolean }
