{{- /*
Tenant database credentials (US-001). One ExternalSecret collects, for every hosted tenant, the three variables
TenancyConfig reads (COREBANKING_TENANT_<CODE>_URL / _USER / _PASSWORD) from the tenant's Secrets Manager secret
created by Terraform modules/tenant (corebanking/<environment>/tenants/<code>/db). The provisioning pipeline adds
the tenant code to tenantDbSecrets.tenants, waits for this secret to sync, then restarts the pods (env is read at start).
*/ -}}
{{- if .Values.tenantDbSecrets.enabled }}
{{- $env := required "tenantDbSecrets.environment is required (sandbox, prod ...)" .Values.tenantDbSecrets.environment }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "corebanking.fullname" . }}-tenant-db
  labels:
    {{- include "corebanking.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.tenantDbSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "tenantDbSecrets.secretStore.name is required" .Values.tenantDbSecrets.secretStore.name }}
    kind: {{ .Values.tenantDbSecrets.secretStore.kind }}
  target:
    name: {{ include "corebanking.fullname" . }}-tenant-db
    creationPolicy: Owner
  data:
    {{- range $code := .Values.tenantDbSecrets.tenants }}
    {{- if not (regexMatch "^[a-z][a-z0-9-]{2,30}$" $code) }}
    {{- fail (printf "invalid tenant code %q in tenantDbSecrets.tenants" $code) }}
    {{- end }}
    {{- $var := printf "COREBANKING_TENANT_%s" ($code | upper | replace "-" "_") }}
    {{- $key := printf "corebanking/%s/tenants/%s/db" $env $code }}
    - secretKey: {{ $var }}_URL
      remoteRef: { key: {{ $key | quote }}, property: jdbcUrl }
    - secretKey: {{ $var }}_USER
      remoteRef: { key: {{ $key | quote }}, property: username }
    - secretKey: {{ $var }}_PASSWORD
      remoteRef: { key: {{ $key | quote }}, property: password }
    {{- end }}
{{- end }}
