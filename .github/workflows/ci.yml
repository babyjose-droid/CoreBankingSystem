name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.3'
      - name: Golden calculation, ledger and kernel tests (block merge on any failure)
        run: gradle :backend:calc:test :backend:ledger-core:test :backend:kernel:test :backend:lending-core:test :backend:integration-core:test :backend:deposits-core:test --no-daemon
      - name: App build, modularity check, DB invariant tests (Testcontainers)
        run: gradle :backend:app:build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json
      - run: npm ci
      - name: API types are up to date with docs/api/openapi.yaml
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2 lint docs/api/openapi.yaml

  sql-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ar, POSTGRES_PASSWORD: ar, POSTGRES_DB: tenant_ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply migrations and run invariant suite
        run: |
          P="psql -h localhost -U ar -v ON_ERROR_STOP=1 -q"
          $P -d postgres -c "create database control"
          tools/db/apply-migrations.sh control -h localhost -U ar -d control
          i=0
          for t in backend/app/src/test/resources/db/*_test.sql; do
            i=$((i+1)); db="tenant_ci_$i"
            echo "== $t on fresh database $db"
            $P -d postgres -c "create database $db"
            tools/db/apply-migrations.sh tenant -h localhost -U ar -d "$db"
            $P -d "$db" -f "$t" | tee out.txt
            grep -q "TESTS PASSED" out.txt
          done
          for t in backend/app/src/test/resources/db/control/*_test.sql; do
            i=$((i+1)); db="control_ci_$i"
            echo "== $t on fresh control database $db"
            $P -d postgres -c "create database $db"
            tools/db/apply-migrations.sh control -h localhost -U ar -d "$db"
            $P -d "$db" -f "$t" | tee out.txt
            grep -q "TESTS PASSED" out.txt
          done

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
