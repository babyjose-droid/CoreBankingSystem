name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Golden calculation, ledger and kernel tests (block merge on any failure)
        run: gradle :backend:calc:test :backend:ledger-core:test :backend:kernel:test :backend:lending-core:test :backend:integration-core:test --no-daemon
      - name: App build, modularity check, DB invariant tests (Testcontainers)
        run: gradle :backend:app:build --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json
      - run: npm ci
      - name: API types are up to date with docs/api/openapi.yaml
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2 lint docs/api/openapi.yaml

  sql-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ar, POSTGRES_PASSWORD: ar, POSTGRES_DB: tenant_ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: ar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply migrations and run invariant suite
        run: |
          P="psql -h localhost -U ar -v ON_ERROR_STOP=1 -q"
          $P -d postgres -c "create database control"
          tools/db/apply-migrations.sh control -h localhost -U ar -d control
          i=0
          for t in backend/app/src/test/resources/db/*_test.sql; do
            i=$((i+1)); db="tenant_ci_$i"
            echo "== $t on fresh database $db"
            $P -d postgres -c "create database $db"
            tools/db/apply-migrations.sh tenant -h localhost -U ar -d "$db"
            $P -d "$db" -f "$t" | tee out.txt
            grep -q "TESTS PASSED" out.txt
          done
          for t in backend/app/src/test/resources/db/control/*_test.sql; do
            i=$((i+1)); db="control_ci_$i"
            echo "== $t on fresh control database $db"
            $P -d postgres -c "create database $db"
            tools/db/apply-migrations.sh control -h localhost -U ar -d "$db"
            $P -d "$db" -f "$t" | tee out.txt
            grep -q "TESTS PASSED" out.txt
          done

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
