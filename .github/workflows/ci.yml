name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Golden calculation tests (block merge on any failure)
        run: gradle :backend:calc:test :backend:ledger-core:test --no-daemon
      - name: App build, modularity check, DB invariant tests (Testcontainers)
        run: gradle :backend:app:build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  sql-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ar, POSTGRES_PASSWORD: ar, POSTGRES_DB: tenant_ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: ar
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run invariant suite
        run: |
          P="psql -h localhost -U ar -v ON_ERROR_STOP=1 -q"
          $P -d postgres -c "create database control"
          $P -d control -f backend/app/src/main/resources/db/migration/control/V1__control_plane.sql
          for f in backend/app/src/main/resources/db/migration/tenant/V*.sql; do $P -d tenant_ci -f "$f"; done
          $P -d tenant_ci -f backend/app/src/test/resources/db/ledger_invariants_test.sql | tee out.txt
          grep -q "ALL DB INVARIANT TESTS PASSED" out.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
