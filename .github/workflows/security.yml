name: security
# Code scanning (CodeQL) and dependency review on PRs. Results go to the
# repository's Security tab (SARIF). Weekly run catches newly published CVEs in unchanged code.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * 1'   # Mondays 06:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code scanning and dependency review on a PRIVATE repository need GitHub Code Security (paid) plus the
  # Dependency graph setting. Until the repository variable CODE_SECURITY is set to 'true', these jobs are
  # skipped rather than failing; Dependabot alerts and gitleaks (ci.yml) still run.
  codeql:
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY == 'true' }}
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect sources
        id: sources
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          present=true
          if [ "$LANGUAGE" = "javascript-typescript" ]; then
            first=$(find frontend -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
              -not -path '*/node_modules/*' -print -quit)
            [ -n "$first" ] || present=false
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "$LANGUAGE sources present: $present"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.language == 'java-kotlin'
        with:
          gradle-version: '8.14.3'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: steps.sources.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile Java (traced by CodeQL)
        if: matrix.language == 'java-kotlin'
        run: gradle :backend:app:compileJava --no-daemon --no-build-cache
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: steps.sources.outputs.present == 'true'
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.CODE_SECURITY == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Copyleft licences need legal review before entering a product sold to banks.
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  # Trivy was removed on 28-Sep-2026: in March 2026 attackers hijacked aquasecurity/trivy-action tags and
  # published a malicious Trivy release to steal CI secrets. Vulnerable dependencies are covered by
  # Dependabot alerts, dependency-review (PRs) and CodeQL. Re-add a scanner only pinned to a verified
  # commit SHA.

  # US-132: every third-party action is pinned to a full commit SHA (tags can be moved, as the March 2026
  # trivy-action compromise showed). Dependabot (github-actions ecosystem) proposes SHA bumps.
  actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All actions pinned to commit SHAs
        run: |
          bad=$(grep -rnE '^\s*-?\s*uses:\s*[^./][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [ -n "$bad" ]; then echo "Pin these actions to a commit SHA:"; echo "$bad"; exit 1; fi
          echo "all actions pinned"
