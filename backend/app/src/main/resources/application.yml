spring:
  application:
    name: corebanking
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: false   # TenantMigrator migrates control plane and each tenant explicitly
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: always

corebanking:
  oidc:
    # Tokens are accepted from any realm under this prefix; realm name must equal the token's tenant claim.
    issuer-prefix: ${COREBANKING_OIDC_ISSUER_PREFIX:http://localhost:8081/realms/}
    # Where to fetch signing keys when the public issuer host is not reachable from the app (Docker, K8s).
    jwks-base: ${COREBANKING_OIDC_JWKS_BASE:}
    audience: ${COREBANKING_OIDC_AUDIENCE:api}
  bootstrap:
    demo-tenant: ${COREBANKING_BOOTSTRAP_DEMO_TENANT:false}   # LOCAL ONLY
  control:
    create-databases: ${COREBANKING_CREATE_DATABASES:false}   # true only for dev/standalone
    datasource:
      jdbc-url: ${COREBANKING_CONTROL_URL:jdbc:postgresql://localhost:5432/control}
      username: ${COREBANKING_CONTROL_USER:control}
      password: ${COREBANKING_CONTROL_PASSWORD:}
      maximum-pool-size: 5
  documents:
    # KYC documents, report files, NACH files. directory (default): a directory, for dev and standalone installs (use an
    # encrypted volume). s3: Amazon S3 with SSE-KMS (MinIO in the local stack), see S3DocumentStore.
    store: ${COREBANKING_DOCUMENTS_STORE:directory}
    dir: ${COREBANKING_DOCUMENTS_DIR:${java.io.tmpdir}/corebanking-documents}
    s3:
      bucket: ${COREBANKING_DOCUMENTS_S3_BUCKET:}
      key-prefix: ${COREBANKING_DOCUMENTS_S3_KEY_PREFIX:}
      region: ${COREBANKING_DOCUMENTS_S3_REGION:ap-south-1}
      endpoint: ${COREBANKING_DOCUMENTS_S3_ENDPOINT:}          # empty for AWS; http://minio:9000 locally
      path-style: ${COREBANKING_DOCUMENTS_S3_PATH_STYLE:false}  # true for MinIO
      sse: ${COREBANKING_DOCUMENTS_S3_SSE:aws:kms}               # aws:kms | AES256 | none (none only for a local MinIO without KMS)
      kms-key-id: ${COREBANKING_DOCUMENTS_S3_KMS_KEY_ID:}       # empty: the bucket's default KMS key
  mail:
    # Outgoing e-mail (scheduled reports to internal staff, EOD failure alerts, the SMTP e-mail provider) through
    # an SMTP relay: Amazon SES over SMTP in the cloud tiers, Mailpit locally. Relay settings: spring.mail.*.
    enabled: ${COREBANKING_MAIL_ENABLED:false}
    from: ${COREBANKING_MAIL_FROM:no-reply@example.invalid}
  eod:
    partitions: 4
    scheduler-enabled: true
  jobs:
    # Tenant job catalogue (US-112): every instance polls; the database settles which one runs a job.
    scheduler-enabled: ${COREBANKING_JOBS_SCHEDULER_ENABLED:true}
    scheduler-interval-ms: 30000
  reports:
    # Report files older than this are removed by the EXPORT_CLEANUP job; a tenant overrides it with the
    # system property reports.retention-days.
    retention-days: ${COREBANKING_REPORTS_RETENTION_DAYS:90}
  usage:
    flush-interval-ms: 60000        # API call counts go from memory to the control plane this often (US-004)
  keycloak:
    admin:
      # Session management (US-027). The client lives in each tenant realm (service account with view-users and
      # manage-users). Its secret per tenant: COREBANKING_TENANT_<CODE>_KEYCLOAK_ADMIN_SECRET; or one for all here.
      base-url: ${COREBANKING_KEYCLOAK_ADMIN_BASE_URL:}
      client-id: ${COREBANKING_KEYCLOAK_ADMIN_CLIENT_ID:corebanking-admin}
      client-secret: ${COREBANKING_KEYCLOAK_ADMIN_CLIENT_SECRET:}

  integration:
    # Providers a tenant may configure, comma separated. Empty by default: the SIMULATOR reports success without
    # moving money (dev, test and demo only) and EASEBUZZ / GENERIC_HTTP are unverified against the provider.
    providers-enabled: ${COREBANKING_INTEGRATION_PROVIDERS:}
    worker-enabled: ${COREBANKING_INTEGRATION_WORKER:true}
    worker-interval-ms: 5000
    # Keycloak Admin REST for API clients (US-120). Off until an admin service account exists; see docs/runbooks/integrations.md.
    keycloak-admin:
      enabled: ${COREBANKING_KEYCLOAK_ADMIN_ENABLED:false}
      base-url: ${COREBANKING_KEYCLOAK_ADMIN_URL:http://localhost:8081}
      realm: ${COREBANKING_KEYCLOAK_ADMIN_REALM:master}
      client-id: ${COREBANKING_KEYCLOAK_ADMIN_CLIENT_ID:corebanking-admin}
      client-secret: ${COREBANKING_KEYCLOAK_ADMIN_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        # prometheus is NOT on the public port: metrics name every tenant. To scrape, set MANAGEMENT_SERVER_PORT
        # (e.g. 9090, not routed by the ingress, allowed only from the monitoring namespace) and
        # MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: false   # the routed tenant data source has no connection outside a request

logging:
  pattern:
    correlation: "[%X{tenant:-}] [%X{traceId:-}] "
