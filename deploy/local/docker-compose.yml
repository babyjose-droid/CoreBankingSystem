# CoreBanking local development stack. LOCAL DEVELOPMENT ONLY — every password below is a
# throwaway default; never reuse these values in any shared, UAT or production environment.
#
#   cd deploy/local
#   docker compose up -d --build              # postgres + keycloak + backend
#   docker compose --profile console up -d    # ...plus the React staff console
#
# Ports are bound to 127.0.0.1 so nothing is exposed to the LAN. See README.md.
name: corebanking

x-db-passwords: &db-passwords
  CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-control-local-only}
  TENANT_DEMO_NBFC_DB_PASSWORD: ${TENANT_DEMO_NBFC_DB_PASSWORD:-demo-nbfc-local-only}
  TENANT_DEMO_BANK_DB_PASSWORD: ${TENANT_DEMO_BANK_DB_PASSWORD:-demo-bank-local-only}
  TENANT_DEMO_NBFC_D_DB_PASSWORD: ${TENANT_DEMO_NBFC_D_DB_PASSWORD:-demo-nbfc-d-local-only}

services:
  postgres:
    image: postgres:16
    environment:
      <<: *db-passwords
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      POSTGRES_DB: postgres
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # LOCAL ONLY, runs once on every `up` and exits: creates the databases of the demo tenants added in Phase 4
  # (demo-bank, demo-nbfc-d) when they are missing, so a postgres volume created earlier needs no reset.
  postgres-demo-tenants:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-passwords
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
    volumes:
      - ./postgres/ensure-demo-tenants.sh:/ensure-demo-tenants.sh:ro
    entrypoint: ["bash", "/ensure-demo-tenants.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Dev mode: embedded H2, HTTP, relaxed caching. Imports every realm JSON in /opt/keycloak/data/import
    # on first start (existing realms are skipped; `docker compose rm -sf keycloak` to re-import).
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      # Tokens always carry iss=http://localhost:8081/realms/<realm> (what the browser sees);
      # back-channel calls from the backend container use http://keycloak:8081.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # LOCAL ONLY: becomes the secret of the realm's corebanking-admin client at import (the realm file holds the
      # placeholder ${LOCAL_KEYCLOAK_ADMIN_CLIENT_SECRET}). Generated into .env by ./init-env.sh.
      LOCAL_KEYCLOAK_ADMIN_CLIENT_SECRET: ${LOCAL_KEYCLOAK_ADMIN_CLIENT_SECRET:?run ./init-env.sh first}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; probe the management port with bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # LOCAL ONLY S3-compatible document store (the cloud tiers use Amazon S3 with SSE-KMS). Adobe S3Mock: the
  # MinIO images are no longer published on Docker Hub or Quay. It creates the private bucket at start-up and
  # accepts SSE-KMS only under the key ARN listed here (validation only: S3Mock does not encrypt), so the
  # backend's SSE-KMS request path is exercised as in AWS. Credentials are not checked.
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: corebanking-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_VALID_KMS_KEYS: arn:aws:kms:us-east-1:000000000000:key/corebanking-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"     # S3 API (HTTP)
    volumes:
      - s3data:/s3mockroot

  # LOCAL ONLY mail catcher: everything the backend e-mails lands here. UI http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"     # web UI
    environment:
      MP_MAX_MESSAGES: 5000

  # LOCAL ONLY webhook receiver: logs every request it gets (headers and body) and answers 200 with an echo. Register
  # http://webhook-echo:8080/hook as a webhook endpoint (Integrations, Webhooks); the backend allows plain http to this one
  # host name only (COREBANKING_WEBHOOK_LOCAL_ALLOW_HOSTS below). See README.md.
  webhook-echo:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      LOG_IGNORE_PATH: /health
    ports:
      - "127.0.0.1:8088:8080"     # try it: curl -s -XPOST localhost:8088/hook -d '{}'

  backend:
    build:
      context: ../..
      dockerfile: backend/app/Dockerfile
    image: corebanking/backend:local
    depends_on:
      postgres:
        condition: service_healthy
      postgres-demo-tenants:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      s3:
        condition: service_started
      mailpit:
        condition: service_started
      webhook-echo:
        condition: service_started
    environment:
      # Control plane (TenancyConfig.controlDataSource)
      COREBANKING_CONTROL_URL: jdbc:postgresql://postgres:5432/control
      COREBANKING_CONTROL_USER: control
      COREBANKING_CONTROL_PASSWORD: ${CONTROL_DB_PASSWORD:-control-local-only}
      # Identity: one realm per tenant under this issuer prefix (the realm must equal the token's tenant claim).
      # Tokens say iss=http://localhost:8081/...; signing keys are fetched over the compose network instead.
      COREBANKING_OIDC_ISSUER_PREFIX: http://localhost:8081/realms/
      COREBANKING_OIDC_JWKS_BASE: http://keycloak:8081/realms/
      # LOCAL ONLY: provision the demo tenants on first start (starter kit, HO + MUM branches, business date
      # 30-Jun-2026): demo-nbfc (lending, no deposits), demo-bank (savings, current and term deposits) and
      # demo-nbfc-d (an NBFC recorded as deposit-taking: term deposits only).
      COREBANKING_BOOTSTRAP_DEMO_TENANT: "true"
      # P2-2 integrations, local only: the simulator reports payouts as paid without moving any money.
      # SMTP: the e-mail provider through the mail relay (Mailpit here).
      COREBANKING_INTEGRATION_PROVIDERS: SIMULATOR,SMTP
      # Documents on the local S3 (S3Mock) with SSE-KMS under the local key ARN (as S3 + KMS in the cloud tiers).
      COREBANKING_DOCUMENTS_STORE: s3
      COREBANKING_DOCUMENTS_S3_BUCKET: corebanking-documents
      COREBANKING_DOCUMENTS_S3_ENDPOINT: http://s3:9090
      COREBANKING_DOCUMENTS_S3_PATH_STYLE: "true"
      COREBANKING_DOCUMENTS_S3_REGION: us-east-1
      COREBANKING_DOCUMENTS_S3_SSE: aws:kms
      COREBANKING_DOCUMENTS_S3_KMS_KEY_ID: corebanking-local   # S3Mock matches the key id after "key/" in its listed ARN
      AWS_ACCESS_KEY_ID: local-only
      AWS_SECRET_ACCESS_KEY: local-only
      # E-mail to Mailpit (no TLS, no login: local only). The cloud tiers use Amazon SES over SMTP with STARTTLS.
      COREBANKING_MAIL_ENABLED: "true"
      COREBANKING_MAIL_FROM: no-reply@demo-nbfc.invalid
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_STARTTLS: "false"
      # LOCAL ONLY: outbound webhooks may go, over plain http, to the webhook-echo container (and to no other host that is
      # not a public https name). Default everywhere else: empty.
      COREBANKING_WEBHOOK_LOCAL_ALLOW_HOSTS: webhook-echo
      # LOCAL ONLY Keycloak admin client (corebanking-admin in the demo-nbfc realm): sessions (US-027) and API
      # clients (US-120). Both read this secret; API clients take their admin token from the tenant's own realm
      # here, where a shared environment would use a client that can reach every tenant realm.
      COREBANKING_KEYCLOAK_ADMIN_CLIENT_SECRET: ${LOCAL_KEYCLOAK_ADMIN_CLIENT_SECRET:?run ./init-env.sh first}
      COREBANKING_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8081
      COREBANKING_KEYCLOAK_ADMIN_ENABLED: "true"
      COREBANKING_KEYCLOAK_ADMIN_URL: http://keycloak:8081
      COREBANKING_KEYCLOAK_ADMIN_REALM: demo-nbfc
      # LOCAL ONLY personal-data keys (base64, 32 bytes). Cloud tiers inject KMS-unwrapped keys instead.
      # Generated into deploy/local/.env by ./init-env.sh (git-ignored); never commit real keys.
      COREBANKING_TENANT_DEMO_NBFC_PII_KEY: ${DEMO_PII_KEY:?run ./init-env.sh first}
      COREBANKING_TENANT_DEMO_NBFC_PII_INDEX_KEY: ${DEMO_PII_INDEX_KEY:?run ./init-env.sh first}
      # Tenant credentials (TenancyConfig.envCredentials): COREBANKING_TENANT_<CODE upper, '-'→'_'>_URL/_USER/_PASSWORD
      COREBANKING_TENANT_DEMO_NBFC_URL: jdbc:postgresql://postgres:5432/tenant_demo_nbfc
      COREBANKING_TENANT_DEMO_NBFC_USER: tenant_demo_nbfc
      COREBANKING_TENANT_DEMO_NBFC_PASSWORD: ${TENANT_DEMO_NBFC_DB_PASSWORD:-demo-nbfc-local-only}
      # The Phase 4 demo tenants. LOCAL ONLY: they share the demo personal-data keys above (each real tenant has
      # its own keys). Their realms have no corebanking-admin client, so Sessions and API clients work on
      # demo-nbfc only.
      COREBANKING_TENANT_DEMO_BANK_URL: jdbc:postgresql://postgres:5432/tenant_demo_bank
      COREBANKING_TENANT_DEMO_BANK_USER: tenant_demo_bank
      COREBANKING_TENANT_DEMO_BANK_PASSWORD: ${TENANT_DEMO_BANK_DB_PASSWORD:-demo-bank-local-only}
      COREBANKING_TENANT_DEMO_BANK_PII_KEY: ${DEMO_PII_KEY:?run ./init-env.sh first}
      COREBANKING_TENANT_DEMO_BANK_PII_INDEX_KEY: ${DEMO_PII_INDEX_KEY:?run ./init-env.sh first}
      COREBANKING_TENANT_DEMO_NBFC_D_URL: jdbc:postgresql://postgres:5432/tenant_demo_nbfc_d
      COREBANKING_TENANT_DEMO_NBFC_D_USER: tenant_demo_nbfc_d
      COREBANKING_TENANT_DEMO_NBFC_D_PASSWORD: ${TENANT_DEMO_NBFC_D_DB_PASSWORD:-demo-nbfc-d-local-only}
      COREBANKING_TENANT_DEMO_NBFC_D_PII_KEY: ${DEMO_PII_KEY:?run ./init-env.sh first}
      COREBANKING_TENANT_DEMO_NBFC_D_PII_INDEX_KEY: ${DEMO_PII_INDEX_KEY:?run ./init-env.sh first}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:8080:8080"
      # Staff console dev server (profile "console") shares this service's network namespace.
      - "127.0.0.1:5173:5173"
    # Same constraints as the Kubernetes pod: read-only root filesystem, writable /tmp only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  console:
    profiles: ["console"]
    image: node:22
    working_dir: /workspace/frontend/console
    command: ["sh", "-c", "npm ci && npm run dev -- --host"]
    # Share the backend's network namespace so the Vite dev proxy (/api -> http://localhost:8080,
    # see frontend/console/vite.config.ts) reaches the backend without CORS. Port 5173 is published
    # on the backend service. Restart the console after restarting the backend.
    network_mode: "service:backend"
    environment:
      VITE_MOCK: "0"
      VITE_API_BASE_URL: ""
      VITE_OIDC_AUTHORITY: http://localhost:8081/realms/demo-nbfc
      VITE_OIDC_CLIENT_ID: console
      # LOCAL ONLY development sign-in (ADR-007 amendment): username/password form on the login page, using the
      # realm's console-dev client. The dev server proxies /realms to Keycloak; "keycloak" resolves here because
      # this container shares the backend's network namespace (and with it Docker's DNS for the compose network),
      # exactly as COREBANKING_OIDC_JWKS_BASE above. localhost:8081 would NOT work inside this namespace.
      VITE_DEV_LOGIN: "1"
      # LOCAL ONLY: the development sign-in offers these tenants (one Keycloak realm each, all with console-dev).
      # The first is the default. SSO stays on the realm of VITE_OIDC_AUTHORITY.
      VITE_DEV_TENANTS: demo-nbfc,demo-bank,demo-nbfc-d
      # LOCAL ONLY: the webhook form accepts http://webhook-echo:... (matches COREBANKING_WEBHOOK_LOCAL_ALLOW_HOSTS above).
      VITE_WEBHOOK_LOCAL_HOSTS: webhook-echo
      VITE_KEYCLOAK_PROXY_TARGET: http://keycloak:8081
    volumes:
      - ../../frontend/console:/workspace/frontend/console
      # Keep Linux node_modules out of the host checkout.
      - console_node_modules:/workspace/frontend/console/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  s3data:
  console_node_modules:
